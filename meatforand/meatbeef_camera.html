html,body,#root{

}

  color:#fff!important;
  border-color:var(--ink)!important
}

  box-shadow:0 -8px 30px rgba(0,0,0,.13)

  box-shadow:0 6px 22px rgba(30,20,15,.08)
}

.pulse{
  animation:pulse 1.8s infinite
}

@keyframes pulse{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.35
  }
}

.scanline{
  animation:scan 1.8s ease-in-out infinite
}

@keyframes scan{
  0%,100%{
    top:12%
  }

  50%{
    top:78%
  }
}

.fade{
  animation:fade .28s ease both
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(8px)
  }

  to{
    opacity:1;
    transform:none
  }
}
