<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미트포앤 발주 관리</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--line:#2a2e38;--tx:#e8eaf0;--sub:#9aa3b2;--ac:#f0a04b;--ac2:#4bb0f0;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Pretendard','Malgun Gothic',sans-serif;font-size:14px;padding:16px;max-width:1100px;margin:0 auto}
h1{font-size:20px;margin-bottom:4px}
.sub{color:var(--sub);font-size:12px;margin-bottom:16px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:110px}
.stat b{display:block;font-size:22px;color:var(--ac)}
.stat span{color:var(--sub);font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{background:var(--card);border:1px solid var(--line);color:var(--sub);padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px}
.tab.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
input[type=search]{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);margin-bottom:14px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--sub)}
.chip.on{background:var(--ac2);color:#0b0d12;font-weight:700;border-color:var(--ac2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;flex-wrap:wrap;gap:4px}
.card .cli{font-weight:700;font-size:15px}
.card .tm{color:var(--sub);font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:#252a35;border-radius:6px;padding:3px 9px;font-size:12px}
.tag b{color:var(--ac)}
.raw{display:none;white-space:pre-wrap;color:var(--sub);font-size:12px;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.card.open .raw{display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--card)}
tr:hover td{background:#20242e}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;background:#252a35;border-radius:10px;padding:1px 8px;font-size:11px;color:var(--sub);margin:1px}
mark{background:var(--ac);color:#111;border-radius:3px;padding:0 2px}
.back{color:var(--ac2);cursor:pointer;font-size:13px;margin-bottom:10px;display:inline-block}
.empty{color:var(--sub);text-align:center;padding:40px 0}
</style>
<base target="_blank">
</head>
<body>
<h1>🥩 미트포앤 발주 관리</h1>
<div class="sub">카카오톡 발주 대화 기반 · 2026-10-17 ~ 2026-11-04 · 외부 전송 없음(로컬 파일)</div>
<div class="stats" id="stats"></div>
<div class="tabs">

  <div class="tab" data-t="client" onclick="show('client')">🏪 거래처 목록</div>
  <div class="tab" data-t="item" onclick="show('item')">📦 품목 집계</div>

<input type="search" id="q" placeholder="🔍 검색 (거래처, 품목, 키워드)…" oninput="render()">

let mode='date', selDate='all', selClient=null;
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hi=s=>{const q=$('#q').value.trim(); if(!q)return esc(s); const i=s.toLowerCase().indexOf(q.toLowerCase()); if(i<0)return esc(s); return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length));};

function show(t){mode=t; selClient=null; document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.dataset.t===t)); render();}

$('#stats').innerHTML =
 `<div class="stat"><b>${D.orders.length}</b><span>총 발주 건</span></div>
  <div class="stat"><b>${D.clientSummary.length}</b><span>거래처 수</span></div>
  <div class="stat"><b>${D.itemSummary.length}</b><span>품목 수</span></div>
  <div class="stat"><b>${D.dates.length}</b><span>수집 일수</span></div>`;

const matchQ = s => !$('#q').value.trim() || s.toLowerCase().includes($('#q').value.trim().toLowerCase());

function renderChips(){
  let h = `<div class="chip ${selDate==='all'?'on':''}" onclick="selDate='all';render()">전체</div>`;
  for(const d of D.dates){const n=D.orders.filter(o=>o.date===d).length;
    h+=`<div class="chip ${selDate===d?'on':''}" onclick="selDate='${d}';render()">${d.slice(5)} (${n})</div>`;}
  $('#chips').innerHTML=h;
}

function orderCard(o){
  const tags=o.items.map(i=>`<span class="tag">${hi(i.item)} <b>${i.qty}${i.unit}</b></span>`).join('');
  return `<div class="card" onclick="this.classList.toggle('open')">
    <div class="hd"><span class="cli">${hi(o.client)}</span><span class="tm">${o.date} ${o.time} · ${esc(o.sender)}</span></div>
    <div class="tags">${tags}</div>
    <div class="raw">${esc(o.raw)}</div></div>`;
}

function render(){
  renderChips();
  const v=$('#view'); let h='';
  if(mode==='date'){
    const ds = selDate==='all'? D.dates : [selDate];
    let list=[];
    for(const d of ds) for(const o of D.orders.filter(o=>o.date===d))
      if(matchQ(o.client+' '+o.items.map(i=>i.item).join(' '))) list.push(o);
    if(!list.length){v.innerHTML='<div class="empty">해당하는 발주가 없습니다</div>';return;}
    let last='';
    for(const o of list){
      if(o.date!==last){h+=`<div class="sub" style="margin:14px 0 8px;font-weight:700;color:var(--ac)">📌 ${o.date}</div>`;last=o.date;}
      h+=orderCard(o);
    }
  }
  else if(mode==='client'){
    if(selClient){
      const os=D.orders.filter(o=>o.client===selClient);
      h+=`<span class="back" onclick="selClient=null;render()">← 거래처 목록으로</span>`;
      h+=`<div class="card"><div class="hd"><span class="cli">${esc(selClient)}</span><span class="tm">총 ${os.length}건</span></div></div>`;
      for(const o of os) h+=orderCard(o);
    } else {
      const cs=D.clientSummary.filter(c=>matchQ(c.name+' '+c.topItems.join(' ')));
      h+=`<table><tr><th>거래처</th><th class="num">발주건수</th><th>주요 품목</th><th class="num">최근발주</th></tr>`;
      for(const c of cs) h+=`<tr style="cursor:pointer" onclick="selClient='${esc(c.name)}';render()">
        <td>${hi(c.name)}</td><td class="num">${c.count}</td>
        <td>${c.topItems.slice(0,5).map(i=>`<span class="pill">${hi(i)}</span>`).join('')}</td>
        <td class="num">${c.dates[c.dates.length-1]}</td></tr>`;
      h+='</table>';
    }
  }
  else {
    const its=D.itemSummary.filter(i=>matchQ(i.name));
    h+=`<table><tr><th>품목</th><th class="num">발주 횟수</th><th>누적 수량</th></tr>`;
    for(const i of its) h+=`<tr><td>${hi(i.name)}</td><td class="num">${i.orders}</td>
      <td>${Object.entries(i.units).map(([u,q])=>`<span class="pill">${q%1?q.toFixed(1):q}${u}</span>`).join('')}</td></tr>`;
    h+='</table>';
  }
  v.innerHTML=h;
}
render();
