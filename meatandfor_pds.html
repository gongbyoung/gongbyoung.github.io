:root{
  --surface:#F4F0E6;
  --paper:#FFFDF6;
  --ink:#191A17;
  --muted:#6B675E;
  --line:#DDD6C4;
  --line2:#EDE8DB;
  --accent:#E85D04;
  --accent-soft:#FFF0E6;
  --green:#1E5B3A;
  --green-soft:#E8F2EC;
  --navy:#1C2B36;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --surface:#141512;
    --paper:#1E1F1B;
    --ink:#F2EFE6;
    --muted:#B0AC9E;
    --line:#3A3B34;
    --line2:#2A2B26;
    --accent:#FF8A3D;
    --accent-soft:#33231A;
    --green:#7BC49A;
    --green-soft:#1F2E26;
    --navy:#E8E4D6;
  }
}
*{
  box-sizing:border-box
}
html,body{
  margin:0;
  background:var(--surface);
  color:var(--ink);
  font-family:'Noto Sans KR',system-ui,sans-serif
}
.mono{
  font-family:'IBM Plex Mono',ui-monospace,monospace
}
input,textarea,select,button{
  font-family:inherit
}
button{
  cursor:pointer
}
.field{
  width:100%;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  border-radius:10px;
  padding:10px 11px;
  font-size:14px;
  outline:none
}
.field:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  border:1px solid var(--line);
  background:var(--paper);
  border-radius:999px;
  padding:8px 10px;
  font-size:13px;
  cursor:pointer;
  -webkit-user-select:none;
     -moz-user-select:none;
          user-select:none
}
.chip input{
  accent-color:var(--accent);
  width:16px;
  height:16px
}
.seg{
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px;
  background:var(--paper);
  display:flex;
  gap:4px
}
.seg button{
  border:0;
  background:transparent;
  color:var(--muted);
  border-radius:999px;
  padding:8px 14px;
  font-weight:700;
  font-size:13px
}
.seg button.on{
  background:var(--ink);
  color:var(--paper)
}
.pre{
  white-space:pre-wrap;
  word-break:break-word;
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  line-height:1.75
}
.tablewrap{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch
}
table.pivot{
  border-collapse:separate;
  border-spacing:0;
  min-width:100%;
  font-size:12px
}
table.pivot th,table.pivot td{
  border-bottom:1px solid var(--line2);
  padding:0 6px;
  height:28px;
  white-space:nowrap;
  text-align:center
}
table.pivot th{
  font-weight:700;
  background:var(--paper);
  color:var(--muted)
}
table.pivot td:first-child,table.pivot th:first-child{
  text-align:left
}
</style>
