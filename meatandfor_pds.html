:root{
  --bg:#f4f1e8;
  --surface:#fffdf7;
  --ink:#1d1a16;
  --muted:#6e675e;
  --line:#ddd5c3;
  --primary:#c63d1e;
  --orange:#e87a1c;
  --gray:#9a948a;
  --safe-area-inset-top:0px
}
*{
  box-sizing:border-box
}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,sans-serif
}
button,input,textarea{
  font:inherit
}
button{
  cursor:pointer
}
.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 0 0;
  background:var(--bg)
}
.top{
  border-bottom:3px solid var(--ink);
  background:#fff7e8
}
.top-in{
  max-width:1180px;
  margin:auto;
  padding:26px 20px 22px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-end
}
.eyebrow{
  font-family:"JetBrains Mono",monospace;
  font-size:11px;
  letter-spacing:.18em;
  color:var(--primary);
  font-weight:700;
  margin:0 0 8px
}
.top h1{
  font-size:clamp(30px,5vw,50px);
  line-height:.95;
  letter-spacing:-.04em;
  margin:0
}
.top h1 span{
  color:var(--primary)
}
.sub{
  color:var(--muted);
  max-width:720px;
  margin:12px 0 0;
  line-height:1.55
}
.badge{
  flex:0 0 auto;
  text-align:right
}
.badge strong{
  display:block;
  font-family:"JetBrains Mono",monospace;
  font-size:42px;
  line-height:1
}
.badge span{
  font-size:12px;
  color:var(--muted)
}
main{
  max-width:1180px;
  margin:auto;
  padding:22px 20px 40px
}
.rule{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border:2px solid var(--ink);
  background:var(--ink);
  gap:2px;
  margin-bottom:20px
}
.rule>div{
  background:#fffdf7;
  padding:16px
}
.rule b{
  font-family:"JetBrains Mono",monospace;
  color:var(--primary)
}
.rule p{
  font-weight:700;
  line-height:1.45;
  margin:7px 0
}
.rule span{
  font-size:12px;
  color:var(--muted);
  line-height:1.4;
  display:block
}
.grid{
  display:grid;
  grid-template-columns:1.25fr .75fr;
  gap:18px;
  align-items:start
}
.panel{
  background:var(--surface);
  border:1px solid var(--line);
  box-shadow:5px 5px 0 #e5ddcb;
  padding:18px
}
.panel-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start
}
.kicker{
  font-family:"JetBrains Mono",monospace;
  font-size:11px;
  letter-spacing:.12em;
  color:var(--primary);
  font-weight:700
}
.panel h2{
  font-size:22px;
  margin:4px 0 12px;
  letter-spacing:-.02em
}
.ghost{
  border:1px solid var(--line);
  background:#fff;
  padding:8px 10px;
  border-radius:999px;
  display:flex;
  gap:6px;
  align-items:center;
  font-weight:600
}
.hint{
  font-size:13px;
  line-height:1.55;
  color:var(--muted);
  margin:0 0 12px
}
.hint.small{
  margin-top:8px
}
.drop{
  width:100%;
  border:2px dashed #c3b8a3;
  background:#fff7e8;
  padding:16px;
  display:flex;
  gap:12px;
  align-items:center;
  text-align:left
}
.drop small{
  display:block;
  color:var(--muted);
  margin-top:3px
}
.pill{
  margin-left:auto;
  background:var(--ink);
  color:#fff;
  padding:6px 9px;
  border-radius:999px;
  font-family:"JetBrains Mono",monospace;
  font-size:11px
}
.sr{
  position:absolute;
  width:1px;
  height:1px;
  opacity:0
}
.label{
  font-size:13px;
  font-weight:700;
  display:flex;
  justify-content:space-between;
  margin:16px 0 7px
}
.label span{
  color:var(--muted);
  font-weight:400
}
textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  padding:12px;
  resize:vertical;
  font-family:"JetBrains Mono",monospace;
  font-size:12px;
  line-height:1.6;
  outline:none
}
textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px #f3d8cd
}
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px
}
.controls label{
  font-size:13px;
  font-weight:600;
  display:flex;
  gap:7px;
  align-items:center
}
.controls input[type=date],.controls input[type=number]{
  border:1px solid var(--line);
  padding:8px;
  background:#fff
}
.check{
  grid-column:span 1
}
.notice{
  background:#fff0e8;
  border-left:4px solid var(--orange);
  padding:10px 12px;
  font-size:13px;
  margin:12px 0 0
}
.log{
  border-top:1px solid var(--line);
  margin-top:16px
}
.log summary{
  padding:13px 0;
  cursor:pointer;
  font-weight:700;
  display:flex;
  justify-content:space-between
}
.log summary span{
  color:var(--primary)
}
.log-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}
.log-grid>div{
  border:1px solid var(--line);
  padding:10px
}
.log-grid b{
  display:block;
  font-family:"JetBrains Mono",monospace;
  font-size:18px
}
.log-grid span{
  font-size:11px;
  color:var(--muted)
}
.log ul{
  padding-left:18px;
  color:var(--muted);
  font-size:12px;
  line-height:1.6
}
.nat-chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px
}
.nat-chip{
  font-size:12px;
  border:1px solid #f0c7a5;
  background:#fff3e7;
  padding:5px 8px
}
.nat-chip b{
  color:var(--orange)
}
.callout{
  display:flex;
  gap:10px;
  background:#fff7e8;
  border:1px solid var(--line);
  padding:12px;
  margin-top:16px;
  font-size:13px;
  line-height:1.5
}
.callout p{
  margin:4px 0 0;
  color:var(--muted)
}
.output{
  margin-top:18px
}
.output-head{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center
}
.seg{
  display:flex;
  border:1px solid var(--ink);
  background:#fff
}
.seg button{
  border:0;
  background:transparent;
  padding:10px 14px;
  display:flex;
  gap:7px;
  align-items:center;
  font-weight:700
}
.seg button.on{
  background:var(--ink);
  color:#fff
}
.seg.small button{
  padding:7px 10px;
  font-size:12px
}
.kakao-tools,.table-tools{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:16px 0 10px;
  color:var(--muted);
  font-size:13px
}
.primary{
  background:var(--primary);
  color:#fff;
  border:0;
  padding:11px 15px;
  display:flex;
  gap:8px;
  align-items:center;
  font-weight:700
}
.kakao{
  white-space:pre-wrap;
  background:#1d1a16;
  color:#f8f2e6;
  padding:20px;
  font-family:"JetBrains Mono",monospace;
  font-size:13px;
  line-height:1.8;
  margin:0;
  overflow-x:auto
}
.table-wrap{
  overflow-x:auto
}
.table-wrap table{
  width:100%;
  border-collapse:collapse;
  font-size:12px
}
.table-wrap th{
  text-align:left;
  border-bottom:2px solid var(--ink);
  padding:8px;
  height:28px
}
.table-wrap td{
  border-bottom:1px solid var(--line);
  padding:4px 8px;
  height:28px;
  vertical-align:middle
}
.cell{
  display:inline-block;
  border:1px solid var(--line);
  padding:2px 6px;
  margin:2px 4px 2px 0;
  background:#fff
}
.cell.zero{
  color:var(--gray);
  background:#f1eee7
}
.nat-badge{
  display:inline-block;
  background:var(--orange);
  color:#fff;
  font-weight:700;
  padding:3px 6px;
  margin-left:4px
}
.zero{
  color:var(--gray)
}
.muted{
  color:var(--muted)
}
.empty{
  text-align:center;
  color:var(--muted);
  padding:18px!important
}
.foot{
  font-size:12px;
  color:var(--muted);
  margin:12px 0 0
}
.verify{
  margin-top:18px;
  border:2px solid var(--ink);
  padding:18px;
  background:#fff
}
.verify h3{
  display:flex;
  gap:8px;
  align-items:center;
  margin:0 0 14px
}
.verify>div{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}
.verify p{
  margin:0;
  border-top:1px solid var(--line);
  padding-top:10px
}
.verify b{
  display:block;
  margin-bottom:5px
}
.verify span{
  font-size:12px;
  line-height:1.5;
  color:var(--muted);
  display:block
}
footer{
  max-width:1180px;
  margin:0 auto;
  padding:0 20px 30px;
  color:var(--muted);
  font-size:12px
}
@media(max-width:760px){
  .top-in{
    align-items:flex-start
  }
  .badge{
    display:none
  }
  .rule{
    grid-template-columns:1fr 1fr
  }
  .grid{
    grid-template-columns:1fr
  }
  .output-head{
    align-items:flex-start;
    flex-direction:column
  }
  .kakao-tools,.table-tools{
    align-items:flex-start;
    flex-direction:column;
    gap:10px
  }
  .verify>div{
    grid-template-columns:1fr 1fr
  }
  .controls{
    grid-template-columns:1fr
  }
  .pill{
    display:none
  }
  .seg{
    width:100%
  }
  .seg button{
    flex:1;
    justify-content:center
  }
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#171512;
    --surface:#24201b;
    --ink:#f4ede0;
    --muted:#b8ae9f;
    --line:#453e33
  }
  .top,.callout,.drop{
    background:#2a251e
  }
  .rule>div,.panel,.verify{
    background:#24201b
  }
  .rule{
    background:#f4ede0
  }
  .kakao{
    background:#0f0d0a
  }
  .cell{
    background:#2a251e
  }
  .cell.zero{
    background:#322d26
  }
  .ghost,.seg{
    background:#24201b
  }
  .seg button.on{
    background:#f4ede0;
    color:#171512
  }
  textarea,.controls input{
    background:#171512;
    color:#f4ede0
  }
  .drop .pill{
    background:#f4ede0;
    color:#171512
  }
}
