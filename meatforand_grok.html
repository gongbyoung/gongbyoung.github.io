<script>
const SAVE_KEY = 'meatpoan_dash_v1';
const POLITE = /부탁|주세요|보내주|이상입니다|감사|수고|입니다|합니다|드립니다|입고|다음주|발주체크/;
const DEFAULT_VEHICLES = ['승호', '진', '한', '명', '진우'];

let chatText = '';
let availableDates = [];
let orders = []; // { client, address, time, items:[{name,qty,unit,note}], raw }
let stockRows = [];
let currentTab = 'order';

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function closeNotice() {
  const m = document.getElementById('noticeModal');
  m.classList.add('hidden');
  m.classList.remove('flex');
}
function showNotice(msg) {
  document.getElementById('noticeText').textContent = msg;
  const m = document.getElementById('noticeModal');
  m.classList.remove('hidden');
  m.classList.add('flex');
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('panel-' + tab);
  if (panel) panel.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('nav-active', b.getAttribute('data-tab') === tab);
  });
  if (tab === 'dispatch') renderDispatch();
  if (tab === 'stock') renderRemain();
  saveState();
}

/* ----- persist ----- */
function saveState() {
  try {
    const payload = {
      orders, stockRows, availableDates, currentTab,
      dateSelect: document.getElementById('dateSelect').value,
      stockInput: document.getElementById('stockInput').value,
      fileStatus: document.getElementById('fileStatus').textContent,
      savedAt: Date.now()
    };
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(Object.assign({}, payload, {
        chatText: chatText.length < 1500000 ? chatText : ''
      })));
    } catch (e) {
      localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
    }
  } catch (e) {}
}

function loadState() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!d) return false;
    orders = d.orders || [];
    stockRows = d.stockRows || [];
    availableDates = d.availableDates || [];
    currentTab = d.currentTab || 'order';
    if (d.chatText) chatText = d.chatText;
    if (d.stockInput != null) document.getElementById('stockInput').value = d.stockInput;
    if (d.fileStatus) document.getElementById('fileStatus').textContent = d.fileStatus;
    const sel = document.getElementById('dateSelect');
    sel.innerHTML = '<option value="">날짜 선택</option>';
    availableDates.forEach(x => {
      const o = document.createElement('option');
      o.value = x.key; o.textContent = x.label;
      sel.appendChild(o);
    });
    if (d.dateSelect) sel.value = d.dateSelect;
    sel.disabled = !availableDates.length;
    return orders.length > 0 || stockRows.length > 0;
  } catch (e) { return false; }
}

/* ----- parse dates / orders ----- */
function extractDates(text) {
  const re = /20(\d{2})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/g;
  const map = new Map();
  let m;
  while ((m = re.exec(text))) {
    const y = 2000 + parseInt(m[1], 10);
    const mo = parseInt(m[2], 10), d = parseInt(m[3], 10);
    const key = `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if (!map.has(key)) map.set(key, `${mo}월 ${d}일`);
  }
  return [...map.entries()].map(([key, label]) => ({ key, label })).sort((a, b) => a.key.localeCompare(b.key));
}

function sliceByDate(text, dateKey) {
  if (!dateKey) return text;
  const [y, mo, d] = dateKey.split('-').map(Number);
  const prev = new Date(y, mo - 1, d); prev.setDate(prev.getDate() - 1);
  const dayRe = /20\d{2}\s*년\s*\d{1,2}\s*월\s*\d{1,2}\s*일[^\n]*/g;
  const headers = [];
  let m;
  while ((m = dayRe.exec(text))) headers.push({ index: m.index, raw: m[0] });
  if (!headers.length) return text;
  const parts = [];
  for (let i = 0; i < headers.length; i++) {
    const hm = headers[i].raw.match(/20(\d{2})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
    if (!hm) continue;
    const hy = 2000 + parseInt(hm[1], 10), hmo = parseInt(hm[2], 10), hd = parseInt(hm[3], 10);
    const ok = (hy === y && hmo === mo && hd === d) ||
      (hy === prev.getFullYear() && hmo === prev.getMonth() + 1 && hd === prev.getDate());
    if (ok) {
      const end = i + 1 < headers.length ? headers[i + 1].index : text.length;
      parts.push(text.slice(headers[i].index, end));
    }
  }
  return parts.length ? parts.join('\n') : text;
}

function getAdminConfig() {
  try {
    return JSON.parse(localStorage.getItem('meatpoan_admin_cfg') || 'null') || {};
  } catch (e) { return {}; }
}
function setAdminConfig(cfg) {
  try { localStorage.setItem('meatpoan_admin_cfg', JSON.stringify(cfg)); } catch (e) {}
}
function loadAdminUI() {
  const cfg = getAdminConfig();
  const ex = document.getElementById('adminExclude');
  const mk = document.getElementById('adminMakers');
  const sw = document.getElementById('adminStrictWeight');
  if (ex) ex.value = cfg.excludeText != null ? cfg.excludeText : '개체\n계근\n바코드\n스캔안됨\n스캔 안\n이력';
  if (mk) mk.value = cfg.makers != null ? cfg.makers : '대산,포크,황금,정담,IBP,올리멜,토레인';
  if (sw) sw.checked = cfg.strictWeight !== false;
}
function openAdmin() {
  loadAdminUI();
  const m = document.getElementById('adminModal');
  m.classList.remove('hidden');
  m.classList.add('flex');
}
function closeAdmin() {
  const m = document.getElementById('adminModal');
  m.classList.add('hidden');
  m.classList.remove('flex');
}
function saveAdminAndReparse() {
  setAdminConfig({
    excludeText: document.getElementById('adminExclude').value,
    makers: document.getElementById('adminMakers').value,
    strictWeight: document.getElementById('adminStrictWeight').checked
  });
  closeAdmin();
  if (chatText) reparseOrders();
  else showNotice('관리자 설정을 저장했습니다.\n파일이 있으면 다시 추출됩니다.');
}

/** 계근 예제
 *  업체 고기 4포 5.5
 *  수입양지 얼라이언스 135 1245  (1245 = 12.45kg, 점 생략)
 *  업체 고기 이력번호 KG / 제조일·메이커 KG
 */
function isWeightOrLotLine(line, strict) {
  const t = (line || '').trim();
  if (!t) return false;
  const cfg = getAdminConfig();
  const keys = (cfg.excludeText || '개체\n계근\n바코드').split(/\n/).map(s => s.trim()).filter(Boolean);
  for (const k of keys) {
    if (k && t.includes(k)) return true;
  }
  // 명시 발주 단위가 있으면 계근 우선 제외하지 않음(아래에서 조합 판단)
  const hasOrderUnit = /\d+\s*(박스|박|팩|Pack|Box|봉지)\b/i.test(t);

  // 1) N포 / N대 + 무게
  if (/\d+\s*(포|대)\s+\d+(\.\d+)?/.test(t)) return true;
  if (/\d+\s*(포|대)\s*$/.test(t) && !hasOrderUnit) return true;

  // 2) 소수점 kg (5.5, 15.3)
  if (/\d+\.\d{1,2}\b/.test(t) && !hasOrderUnit) {
    // 박스/팩 없이 무게만
    if (!/\b(박스|박|팩)\b/i.test(t)) return true;
  }

  // 3) 이력·로트(3자리) + 무게(소수점 또는 4자리 점생략)
  //    예: 얼라이언스 135 1245 / 삼겹 451 15.3
  if (/[가-힣A-Za-z]+\s+\d{3,4}(\s+\d{3,4})+\s*$/.test(t) && !hasOrderUnit) return true;
  if (/[가-힣A-Za-z].*\d{3}\s+\d{3,4}\s*$/.test(t) && !hasOrderUnit) return true;
  if (/[가-힣A-Za-z].*\d{3,4}\s+\d+\.\d+/.test(t) && !hasOrderUnit) return true;

  // 4) 한 줄에 토큰: 업체? 고기 메이커/숫자 숫자 — 박스 없고 숫자 2개 이상
  if (!hasOrderUnit) {
    const tokens = t.split(/\s+/);
    const nums = tokens.filter(x => /^\d{3,4}$/.test(x) || /^\d+\.\d+$/.test(x));
    // 4자리 숫자는 점 생략 kg 후보 (1000~9999 → 10.00~99.99)
    const fourDigit = tokens.filter(x => /^\d{4}$/.test(x));
    if (nums.length >= 2 && !tokens.some(x => /박스|박|팩/i.test(x))) return true;
    if (fourDigit.length >= 1 && tokens.some(x => /[가-힣]{2,}/.test(x)) && !tokens.some(x => /박스|박|팩/i.test(x))) {
      // 고기명 + 4자리(무게) 형태
      if (tokens.length >= 2 && tokens.length <= 6) return true;
    }
  }

  if (strict) {
    if (/^\S+\s+\d+\.\d+\s*$/.test(t)) return true;
    if (/^[\d.\s]+$/.test(t) && t.length > 3) return true;
  }
  return false;
}


function isWeightOnlyBlock(lines) {
  if (!lines || !lines.length) return false;
  const strict = getAdminConfig().strictWeight !== false;
  let w = 0, orderish = 0;
  lines.forEach(l => {
    if (isWeightOrLotLine(l, strict)) w++;
    if (/\d+\s*(박스|박|팩|Pack|Box)/i.test(l)) orderish++;
  });
  if (w >= 1 && orderish === 0) return true;
  if (w >= 2 && orderish <= 1) return true;
  return false;
}

function parseOrdersFromText(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const result = [];
  let client = '', time = '', rawBuf = [];
  const itemRe = /^(.+?)\s+(\d+(?:\.\d+)?)\s*(박스|박|팩|봉지|봉|키로|kg|Kg|판|개|Pack|Box)?(.*)$/i;
  const strict = getAdminConfig().strictWeight !== false;

  function flush() {
    if (!client || !rawBuf.length) { rawBuf = []; return; }
    // 블록 전체가 계근이면 발주 제외
    if (isWeightOnlyBlock(rawBuf)) { rawBuf = []; return; }
    const items = [];
    rawBuf.forEach(line => {
      if (isWeightOrLotLine(line, strict)) return;
      const im = line.match(itemRe);
      if (!im) return;
      let name = im[1].replace(/[●■☆★]/g, '').trim();
      let qty = im[2], unit = (im[3] || '').trim(), note = (im[4] || '').trim();
      if (!unit && /^\d{3,4}$/.test(qty)) return;
      if (/\d+\.\d+/.test(qty) && !unit) return;
      if (/^(대|포)$/.test(unit)) return;
      if (POLITE.test(name) && name.length < 12) return;
      if (!unit) unit = 'Box';
      if (/박/.test(unit)) unit = 'Box';
      if (/팩|Pack/i.test(unit)) unit = 'Pack';
      if (/키로|kg/i.test(unit)) unit = 'Kg';
      if (/봉/.test(unit)) unit = '봉';
      items.push({ name, qty: parseFloat(qty), unit, note });
    });
    if (items.length) {
      result.push({ client, address: '', time, items, raw: rawBuf.join('\n') });
    }
    rawBuf = [];
  }

  for (const line of lines) {
    if (/메시지가 삭제|사진|이모티콘|동영상|발주체크|여기까지|Web발신/.test(line)) continue;
    if (/^20\d{2}\s*년/.test(line)) continue;
    if (POLITE.test(line) && !/\d/.test(line)) continue;
    if (/^(내일|오늘|모레|냉장|냉동)$/.test(line)) continue;
    if (isWeightOrLotLine(line, strict) && !/\d+\s*(박스|박|팩)/i.test(line)) continue;

    const tm = line.match(/(오전|오후)\s*(\d{1,2}):(\d{2})/);
    if (tm && /\[|,/.test(line)) {
      let h = parseInt(tm[2], 10);
      if (tm[1] === '오후' && h < 12) h += 12;
      if (tm[1] === '오전' && h === 12) h = 0;
      time = String(h).padStart(2,'0') + ':' + tm[3];
      continue;
    }

    const im = line.match(itemRe);
    if (im) {
      if (!isWeightOrLotLine(line, strict)) rawBuf.push(line);
      continue;
    }

    if (!/\d/.test(line) && line.length >= 2 && line.length <= 40 && !POLITE.test(line)) {
      if (/^(네|예|알겠|수고|감사)/.test(line)) continue;
      flush();
      client = line.replace(/[●■☆★]/g, '').replace(/추가|정정|급급/g, '').trim();
      rawBuf = [];
    }
  }
  flush();
  return result;
}


function reparseOrders() {
  if (!chatText) return;
  const key = document.getElementById('dateSelect').value;
  const slice = sliceByDate(chatText, key);
  orders = parseOrdersFromText(slice);
  renderVouchers();
  renderRemain();
  saveState();
}

async function onFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const buf = await file.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if (!/[가-힣]/.test(text)) {
    try { text = new TextDecoder('euc-kr').decode(buf); } catch (err) {}
  }
  chatText = text;
  availableDates = extractDates(text);
  const sel = document.getElementById('dateSelect');
  sel.innerHTML = '<option value="">전체</option>';
  availableDates.forEach(d => {
    const o = document.createElement('option');
    o.value = d.key; o.textContent = d.label;
    sel.appendChild(o);
  });
  sel.disabled = false;
  if (availableDates.length) sel.value = availableDates[availableDates.length - 1].key;
  document.getElementById('fileStatus').textContent = file.name + ' 로드 완료';
  reparseOrders();
  showNotice('발주 파일을 불러왔습니다.\n\n• 파일: ' + file.name + '\n• 날짜: ' + (sel.selectedOptions[0]?.textContent || '전체') + '\n• 거래처: ' + orders.length + '곳');
}

function renderVouchers() {
  const box = document.getElementById('voucherContainer');
  let list = orders.slice();
  const sort = document.getElementById('sortSelect').value;
  if (sort === 'name') list.sort((a, b) => a.client.localeCompare(b.client, 'ko'));
  else list.sort((a, b) => (a.time || '').localeCompare(b.time || ''));

  let totalBox = 0, totalLoose = 0;
  list.forEach(o => o.items.forEach(it => {
    if (/Box|박스/i.test(it.unit)) totalBox += it.qty;
    else totalLoose += it.qty;
  }));
  document.getElementById('mClients').textContent = list.length;
  document.getElementById('mBoxes').textContent = totalBox;
  document.getElementById('mLoose').textContent = totalLoose;

  if (!list.length) {
    box.innerHTML = '<div class="text-center text-on-surface-variant text-sm py-16">추출된 발주가 없습니다</div>';
    return;
  }

  box.innerHTML = list.map((o, idx) => {
    const rows = o.items.map(it => {
      const noteCls = it.note ? 'text-error font-medium' : 'text-on-surface-variant';
      return `<tr>
        <td class="py-1">${esc(it.name)}</td>
        <td class="py-1 text-right font-mono font-semibold text-secondary">${it.qty}</td>
        <td class="py-1 text-center text-on-surface-variant">${esc(it.unit)}</td>
        <td class="py-1 pl-2 ${noteCls}">${esc(it.note || '-')}</td>
      </tr>`;
    }).join('');
    const tlabel = o.time ? o.time : '--:--';
    return `<article class="voucher-card bg-white rounded border border-outline-variant/40 p-2.5 shadow-sm">
      <div class="flex items-center justify-between text-xs pb-1.5 border-b border-surface-container-low">
        <div class="flex items-center gap-1.5 min-w-0 flex-1 mr-2">
          <span class="font-mono text-secondary font-bold flex-shrink-0">#${String(idx + 1).padStart(2, '0')}</span>
          <span class="font-semibold text-on-surface truncate">${esc(o.client)}</span>
          <button type="button" class="p-0.5 text-on-surface-variant" onclick="this.closest('article').querySelector('.raw-preview').classList.toggle('hidden')" title="원문">
            <span class="material-symbols-outlined text-[16px] leading-none">article</span>
          </button>
        </div>
        <span class="font-mono text-on-surface-variant text-[11px] flex-shrink-0">${esc(tlabel)}</span>
      </div>
      <div class="raw-preview hidden mt-1.5 p-1.5 bg-surface-container-low rounded text-[11px] font-mono text-on-surface-variant border border-outline-variant/30 whitespace-pre-wrap">${esc(o.raw)}</div>
      <div class="mt-1.5 overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead><tr class="text-[11px] text-on-surface-variant/80 border-b border-surface-container">
            <th class="py-1 font-medium">품목명</th>
            <th class="py-1 text-right font-medium">수량</th>
            <th class="py-1 text-center font-medium">단위</th>
            <th class="py-1 pl-2 font-medium">비고</th>
          </tr></thead>
          <tbody class="divide-y divide-surface-container/60">${rows}</tbody>
        </table>
      </div>
    </article>`;
  }).join('');
}

/* ----- stock ----- */
function parseStock(text) {
  const makers = ['대산', '포크', '황금', 'IBP', '엑셀', 'NBP', '올리멜', '토레인', '정담'];
  const lines = text.split('\n');
  const rows = [];
  let curProd = '', curBrand = '기본';

  function add(prod, brand, detail) {
    prod = prod.replace(/\s+/g, ' ').trim();
    if (!prod) return;
    let qty = 0;
    const cleaned = detail.replace(/박/g, ' ').trim();
    const nums = cleaned.match(/\d+/g);
    if (nums) qty = parseInt(nums[0], 10) || 0;
    const noteM = detail.match(/~[^\s]+/);
    rows.push({
      product: prod,
      brand,
      qty,
      detail: cleaned,
      note: noteM ? noteM[0] : ''
    });
  }

  lines.forEach(line => {
    const t = line.trim();
    if (!t) return;
    if (t.startsWith('토레인 삼겹')) {
      curProd = '삼겹'; curBrand = '토레인';
      const r = t.replace('토레인 삼겹', '').trim();
      if (r) add(curProd, curBrand, r);
      return;
    }
    const mm = t.match(/\(([^)]+)\)/);
    const first = t.split(/\s+/)[0];
    const isNew = !first.startsWith('(') && !/^\d/.test(first);
    if (isNew) {
      curProd = t.split(/\s*\(/)[0].trim();
      curBrand = mm ? mm[1] : '기본';
      for (const m of makers) {
        if (curProd.includes(m)) { curBrand = m; curProd = curProd.replace(m, '').trim(); break; }
      }
      const rest = t.replace(curProd, '').replace(`(${curBrand})`, '').trim();
      if (rest) add(curProd, curBrand, rest);
    } else if (mm) {
      curBrand = mm[1];
      const rest = t.replace(`(${curBrand})`, '').trim();
      if (rest) add(curProd, curBrand, rest);
    } else if (curProd) add(curProd, curBrand, t);
  });
  return rows;
}

function renderStock() {
  const tb = document.getElementById('inventory-tbody');
  if (!stockRows.length) {
    tb.innerHTML = '<tr><td colspan="4" class="py-6 text-center text-slate-400">재고 없음</td></tr>';
    document.getElementById('stockMeta').textContent = '—';
    return;
  }
  document.getElementById('stockMeta').textContent = stockRows.length + '줄';
  tb.innerHTML = stockRows.map(r => `<tr class="hover:bg-slate-50">
    <td class="py-2 px-2.5 font-bold whitespace-nowrap">${esc(r.product)}</td>
    <td class="py-2 px-2"><span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 text-[11px]">${esc(r.brand)}</span></td>
    <td class="py-2 px-2.5 font-mono font-bold">${r.qty ? r.qty + '박스' : esc(r.detail)}</td>
    <td class="py-2 px-2 text-right pr-3 font-mono text-[11px] text-slate-600">${esc(r.note || '—')}</td>
  </tr>`).join('');
}

function renderRemain() {
  const orderSum = {};
  orders.forEach(o => o.items.forEach(it => {
    if (!/Box|박스/i.test(it.unit)) return;
    const k = it.name.replace(/냉장|냉동|수입|국내산|\s/g, '');
    orderSum[k] = (orderSum[k] || 0) + it.qty;
  }));
  const stockSum = {};
  stockRows.forEach(r => {
    const k = r.product.replace(/냉장|냉동|수입|국내산|\s/g, '');
    stockSum[k] = (stockSum[k] || 0) + (r.qty || 0);
  });
  const keys = [...new Set([...Object.keys(stockSum), ...Object.keys(orderSum)])].sort((a, b) => a.localeCompare(b, 'ko'));
  const tb = document.getElementById('remain-tbody');
  if (!keys.length) {
    tb.innerHTML = '<tr><td colspan="4" class="py-4 text-center text-slate-400">—</td></tr>';
    return;
  }
  tb.innerHTML = keys.map(k => {
    const s = stockSum[k] || 0, o = orderSum[k] || 0, rem = s - o;
    const cls = rem < 0 ? 'text-red-600 font-bold' : 'text-emerald-600 font-bold';
    return `<tr><td class="py-1.5 px-2">${esc(k)}</td><td class="py-1.5 px-2 text-right font-mono">${s}</td>
      <td class="py-1.5 px-2 text-right font-mono">${o}</td><td class="py-1.5 px-2 text-right font-mono ${cls}">${rem}</td></tr>`;
  }).join('');
}

document.getElementById('btnParseStock').onclick = () => {
  stockRows = parseStock(document.getElementById('stockInput').value);
  renderStock();
  renderRemain();
  saveState();
};

/* ----- dispatch ----- */
function getVehicles() {
  try {
    const v = JSON.parse(localStorage.getItem('meatpoan_vehicles') || 'null');
    if (Array.isArray(v) && v.length) return v;
  } catch (e) {}
  return DEFAULT_VEHICLES.slice();
}
function setVehicles(v) { try { localStorage.setItem('meatpoan_vehicles', JSON.stringify(v)); } catch (e) {} }
function getDispatch() {
  try { return JSON.parse(localStorage.getItem('meatpoan_dispatch') || '{}'); } catch (e) { return {}; }
}
function setDispatch(m) { try { localStorage.setItem('meatpoan_dispatch', JSON.stringify(m)); } catch (e) {} }

function addVehicle() {
  const n = (document.getElementById('newVehicle').value || '').trim();
  if (!n) return;
  const vs = getVehicles();
  if (!vs.includes(n)) { vs.push(n); setVehicles(vs); }
  document.getElementById('newVehicle').value = '';
  renderDispatch();
}

function renderDispatch() {
  const clients = [...new Set(orders.map(o => o.client))].sort((a, b) => a.localeCompare(b, 'ko'));
  const vs = getVehicles();
  const dm = getDispatch();
  const list = document.getElementById('dispatchList');
  if (!clients.length) {
    list.innerHTML = '<p class="text-xs text-slate-400">발주 거래처 없음</p>';
    document.getElementById('dispatchSummary').innerHTML = '';
    return;
  }
  list.innerHTML = clients.map(c => {
    const opts = vs.map(v => `<option value="${esc(v)}" ${dm[c] === v ? 'selected' : ''}>${esc(v)}</option>`).join('');
    return `<div class="flex items-center gap-2 text-xs">
      <span class="flex-1 font-medium truncate">${esc(c)}</span>
      <select class="border rounded px-1 py-1" data-c="${esc(c)}" onchange="(function(s){const m=getDispatch();if(s.value)m[s.dataset.c]=s.value;else delete m[s.dataset.c];setDispatch(m);renderDispatch();})(this)">
        <option value="">미배정</option>${opts}
      </select>
    </div>`;
  }).join('');

  const byV = {};
  vs.forEach(v => { byV[v] = []; });
  clients.forEach(c => { const v = dm[c]; if (v && byV[v]) byV[v].push(c); });
  document.getElementById('dispatchSummary').innerHTML = vs.map(v =>
    `<div class="bg-white border border-slate-200 rounded p-2.5">
      <div class="text-sm font-bold text-primary mb-1">${esc(v)} <span class="text-xs font-normal text-slate-500">${(byV[v]||[]).length}</span></div>
      <div class="text-xs text-slate-700 leading-relaxed">${(byV[v]||[]).length ? byV[v].map(esc).join(' · ') : '<span class="text-slate-400">없음</span>'}</div>
    </div>`
  ).join('');
}

/* ----- boot ----- */
(function boot() {
  const ok = loadState();
  renderVouchers();
  renderStock();
  renderRemain();
  switchTab(currentTab || 'order');
  if (ok) {
    showNotice(
      '저장된 마지막 결과입니다.\n\n' +
      '• 발주 거래처: ' + orders.length + '곳\n' +
      '• 재고 줄: ' + stockRows.length + '\n' +
      '• 날짜: ' + (document.getElementById('dateSelect').selectedOptions[0]?.textContent || '—') +
      '\n\n지금 보고 있는 화면이 마지막 추출 결과입니다.'
    );
  } else {
    showNotice('미트포앤 유통시스템\n\n저장된 결과가 없습니다.\n상단 📁 아이콘으로 카톡 TXT를 불러오세요.');
  }
})();
