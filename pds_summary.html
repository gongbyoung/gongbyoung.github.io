  display: inline-block;
}

.flex{
  display: flex;
}

.\!table{
  display: table !important;
}

.table{
  display: table;
}

.grid{
  display: grid;
}

.hidden{
  display: none;
}

.border{
  border-width: 1px;
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

:root{
  --bg:#eef0f2;
  --surface:#ffffff;
  --ink:#17191d;
  --muted:#667085;
  --line:#d7dce2;
  --blue:#2563eb;
  --orange:#ea580c;
  --yellow:#fff7cc;
  --dark:#2f343d;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#121418;
    --surface:#1d2026;
    --ink:#f2f4f7;
    --muted:#a6aebd;
    --line:#343a44;
    --blue:#60a5fa;
    --orange:#fb923c;
    --yellow:#2a260f;
    --dark:#23272f;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0
}

body{
  font-family:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--ink)
}

.mono{
  font-family:"IBM Plex Mono",ui-monospace,monospace
}

textarea,input,select,button{
  font-family:inherit
}

textarea{
  resize:vertical
}

table{
  border-collapse:collapse
}

::-webkit-scrollbar{
  height:8px;
  width:8px
}

::-webkit-scrollbar-thumb{
  background:#cbd5e1;
  border-radius:99px
}

  .lg\:grid-cols-\[360px_minmax\(0\2c 1fr\)_300px\]{
