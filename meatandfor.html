    let currentDateFilter = 'all';

    function renderTable(filter = 'all', searchQuery = '') {
        const tbody = document.getElementById('orderTableBody');
        const noResults = document.getElementById('noResults');
        tbody.innerHTML = '';

        const filtered = ordersData.filter(order => {
            const matchesDate = (filter === 'all') || (order.date.includes(filter));
            const matchesSearch = order.client.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                  order.items.toLowerCase().includes(searchQuery.toLowerCase());
            return matchesDate && matchesSearch;
        });

        document.getElementById('totalCount').innerText = `총 ${filtered.length}건`;

        if (filtered.length === 0) {
            noResults.classList.remove('hidden');
            return;
        } else {
            noResults.classList.add('hidden');
        }

        filtered.forEach(order => {
            const tr = document.createElement('tr');
            tr.className = "hover:bg-slate-50 transition-colors border-b border-slate-100";
            tr.innerHTML = `
                <td class="py-3 px-4 text-xs font-semibold text-slate-500 whitespace-nowrap">${order.date}</td>
                <td class="py-3 px-4 font-bold text-slate-900 whitespace-nowrap">${order.client}</td>
                <td class="py-3 px-4 text-slate-700 leading-relaxed">${order.items}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filterByDate(dateCode) {
        currentDateFilter = dateCode;
        document.querySelectorAll('.date-btn').forEach(btn => {
            btn.classList.remove('bg-slate-900', 'text-white');
            btn.classList.add('bg-slate-100', 'text-slate-600');
        });
        event.target.classList.remove('bg-slate-100', 'text-slate-600');
        event.target.classList.add('bg-slate-900', 'text-white');
        
        const query = document.getElementById('searchInput').value;
        renderTable(currentDateFilter, query);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        renderTable(currentDateFilter, e.target.value);
    });

    // Initial render
    renderTable();
</script>
