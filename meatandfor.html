<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미트포앤 발주 집계 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f8fafc; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body class="text-slate-800 pb-12">

  <!-- 상단 헤더 -->
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="bg-amber-500 text-slate-950 font-extrabold px-2.5 py-1 rounded text-sm">MEAT FOR &</span>
        <h1 class="text-base md:text-lg font-bold">미트포앤 발주 품목 및 배송지 집계 시스템</h1>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <label class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded cursor-pointer font-bold transition flex items-center gap-1.5 shadow-sm">
          <span>📂 1. 주소록(CSV) 먼저 업로드</span>
          <input type="file" id="csvFileInput" accept=".csv" class="hidden" />
        </label>
        <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded font-semibold transition">🖨️ 인쇄</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 flex flex-col gap-4">

    <!-- 입력 섹션 (슬라이드 대신 깔끔한 고정 높이 텍스트박스) -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
      <div class="flex justify-between items-center mb-2">
        <h2 class="font-bold text-sm text-slate-700">💬 2. 카카오톡 발주 텍스트 복사/붙여넣기</h2>
        <span id="dbStatusBadge" class="text-xs bg-rose-50 text-rose-600 border border-rose-200 px-2 py-0.5 rounded font-bold">⚠️ 주소록 CSV 미등록</span>
      </div>
      <textarea id="kakaoInput" class="w-full h-32 border border-slate-300 rounded-lg p-2.5 text-xs font-mono leading-snug bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none custom-scroll resize-y" placeholder="주소록 CSV 파일을 먼저 업로드한 뒤, 카톡 발주 내용을 이곳에 붙여넣어 주세요."></textarea>
      
      <button onclick="parseAndAnalyze()" class="mt-3 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow-sm transition flex items-center justify-center gap-2 text-sm">
        <span>🚀 발주 내역 자동 집계 실행</span>
      </button>
    </section>

    <!-- 결과 요약 지표 -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
        <div class="text-xs text-slate-500 font-medium">당일 배송지 수</div>
        <div class="text-2xl font-extrabold text-slate-900 mt-1"><span id="kpiStores">0</span><span class="text-sm font-normal text-slate-500 ml-1">곳</span></div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
        <div class="text-xs text-slate-500 font-medium">전체 품목 종류 (카테고리)</div>
        <div class="text-2xl font-extrabold text-indigo-600 mt-1"><span id="kpiCategories">0</span><span class="text-sm font-normal text-slate-500 ml-1">종</span></div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
        <div class="text-xs text-slate-500 font-medium">팩/Kg 등 특수단위</div>
        <div class="text-2xl font-extrabold text-rose-600 mt-1"><span id="kpiSpecialUnits">0</span><span class="text-sm font-normal text-slate-500 ml-1">건</span></div>
      </div>
    </div>

    <!-- 결과 탭 메뉴 -->
    <div class="bg-slate-800 p-2 rounded-xl flex gap-1 overflow-x-auto text-sm no-print">
      <button onclick="setTab('destinations')" id="tab_destinations" class="flex-1 py-2 px-4 rounded-lg font-bold transition bg-indigo-500 text-white shadow">📍 1. 배송지 목록 (거리순)</button>
      <button onclick="setTab('items')" id="tab_items" class="flex-1 py-2 px-4 rounded-lg font-bold transition text-slate-300 hover:bg-slate-700 hover:text-white">🥩 2. 전체 발주 항목표 (품목별)</button>
      <button onclick="setTab('specials')" id="tab_specials" class="flex-1 py-2 px-4 rounded-lg font-bold transition text-slate-300 hover:bg-slate-700 hover:text-white">🔪 3. 팩/Kg 특수단위 작업목록</button>
    </div>

    <!-- 결과 출력 화면 컨테이너 -->
    <div id="outputContainer" class="bg-white rounded-xl shadow-sm border border-slate-200 min-h-[400px]">
      <div class="p-10 text-center text-slate-400 font-medium">
        카톡 텍스트를 입력하고 실행 버튼을 눌러주세요.
      </div>
    </div>

  </main>

<script>
// ==========================================================
// 1. 상태 및 기본 설정
// ==========================================================
const DEPOT = { lat: 37.305, lon: 126.855 }; // 미트포앤(안산)
let CLIENT_DB = [];
let parsedOrders = [];
let currentTab = 'destinations';

const MEAT_CATEGORIES = ['삼겹', '오겹', '특목살', '목살', 'B목살', '미전지', '전지', '미후지', '냉장3mm후지', '후지', '등뼈', '등심', '안심', '갈비', '등갈비', '항정', '가브리', '갈매기', '사태', '우삼겹', '차돌', '돈피', '장족', '모돈', '민찌', '살치', '홍두깨', '늑간'];

// Haversine 거리 계산 (km)
function calcDistKm(lat1, lon1, lat2, lon2) {
  const R = 6371.0;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 1.35; // 실제 주행 보정치 1.35
}

// 간단한 지역 추출기 (CSV에서 위경도가 없을 경우를 대비한 대체 좌표)
function getApproxGeo(addr) {
  if (addr.includes('서울')) return { region: '서울권', lat: 37.5, lon: 126.9 };
  if (addr.includes('대부')) return { region: '대부도', lat: 37.24, lon: 126.58 };
  if (addr.includes('단원구') || addr.includes('시화') || addr.includes('정왕')) return { region: '안산/시흥 서남부', lat: 37.33, lon: 126.75 };
  if (addr.includes('상록구') || addr.includes('매송')) return { region: '안산/화성 인접', lat: 37.30, lon: 126.85 };
  if (addr.includes('시흥')) return { region: '시흥 내륙', lat: 37.39, lon: 126.80 };
  if (addr.includes('인천')) return { region: '인천권', lat: 37.45, lon: 126.70 };
  if (addr.includes('부천') || addr.includes('광명')) return { region: '부천/광명', lat: 37.49, lon: 126.82 };
  if (addr.includes('수원') || addr.includes('동탄') || addr.includes('용인')) return { region: '경기 동남부', lat: 37.26, lon: 127.05 };
  return { region: '기타/지방', lat: 37.10, lon: 127.00 };
}

// ==========================================================
// 2. CSV 파일 업로드 및 DB 구축
// ==========================================================
document.getElementById('csvFileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    CLIENT_DB = [];
    const lines = evt.target.result.split(/\r?\n/);
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',');
      if (cols.length >= 2 && cols[0].trim()) {
        const name = cols[0].trim();
        const addr = cols[1].trim();
        const customAlias = cols[2] ? cols[2].trim() : '';
        const baseClean = name.replace(/\([^\)]*\)/g, '').replace(/(주식회사|농업회사법인|\(주\))/g, '').trim();
        
        let aliases = [];
        if (customAlias) aliases.push(customAlias);
        if (baseClean && baseClean !== name && baseClean.length > 1) aliases.push(baseClean);
        
        const geo = getApproxGeo(addr);
        CLIENT_DB.push({ name, addr, aliases, region: geo.region, lat: geo.lat, lon: geo.lon });
      }
    }
    const badge = document.getElementById('dbStatusBadge');
    badge.innerText = `✅ 주소록 ${CLIENT_DB.length}곳 로드 완료`;
    badge.className = "text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded font-bold";
    alert(`성공적으로 ${CLIENT_DB.length}개의 거래처 주소록을 로드했습니다. 이제 카톡 텍스트를 분석할 수 있습니다.`);
  };
  reader.readAsText(file, 'utf-8');
});

// ==========================================================
// 3. 발주 품목 및 단위 파서
// ==========================================================
function determineCategory(text) {
  for (const cat of MEAT_CATEGORIES) {
    if (text.includes(cat)) return cat;
  }
  return "기타 품목";
}

function parseUnitAndQty(text) {
  const isPass = text.includes('패스') || text.includes('취소');
  if (isPass) return { qty: 0, unit: '취소', raw: '0' };

  let unit = '기타/세트';
  let qty = 0;
  
  // 박스
  const mBox = text.match(/(\d+(?:\.\d+)?)\s*(?:박스|빡스|박|box|b\b)/i);
  // 특수단위
  const mPack = text.match(/(\d+(?:\.\d+)?)\s*(?:판|팩|펙|봉|봉지|덩이|덩어리|진공|벌|구이)/);
  const mKg = text.match(/(\d+(?:\.\d+)?)\s*(?:키로|kg|k\b)/i);
  const mMari = text.match(/(\d+)\s*마리/);
  // 단순 숫자
  const mBare = text.match(/[가-힣a-zA-Z]+\s*[ㅡ\-:\.]?\s*(\d+)(?:\.|\s|$|[가-힣])/);

  if (mBox) { qty = parseFloat(mBox[1]); unit = '박스'; }
  else if (mPack) { qty = parseFloat(mPack[1]); unit = text.match(/(판|팩|펙|봉|덩이|진공|벌)/)[0]; }
  else if (mKg) { qty = parseFloat(mKg[1]); unit = 'Kg'; }
  else if (mMari) { qty = parseInt(mMari[1]); unit = '마리'; }
  else if (mBare && parseInt(mBare[1]) < 100) { qty = parseFloat(mBare[1]); unit = '박스(추정)'; }
  else { qty = 1; unit = '단위미상'; }

  return { qty, unit, raw: `${qty}${unit}` };
}

// ==========================================================
// 4. 카카오톡 분석 엔진
// ==========================================================
function parseAndAnalyze() {
  if (CLIENT_DB.length === 0) {
    alert("⚠️ 거래처 주소록(CSV) 파일을 먼저 업로드해주세요.");
    return;
  }

  const rawText = document.getElementById('kakaoInput').value.trim();
  if (!rawText) {
    alert('카톡 대화 텍스트를 붙여넣어 주세요.');
    return;
  }

  const lines = rawText.split(/\r?\n/);
  const orderMap = new Map(); // key: client name
  
  let currentClient = null;

  for (let i = 0; i < lines.length; i++) {
    const rawLine = lines[i].trim();
    if (!rawLine || ['여기까지', '사진', '네', '내일', '오늘'].includes(rawLine) || rawLine.startsWith('발주체크')) continue;

    // 카톡 헤더 제거: "[이름] [오후 2:32] 대상" 또는 "2026년 10월... 이름 : 대상"
    let cleanLine = rawLine.replace(/^\[[^\]]+\]\s*\[[^\]]+\]\s*/, '');
    cleanLine = cleanLine.replace(/^\d{4}[년\.\-].+?,\s*[^:]+\s*:\s*/, '');
    cleanLine = cleanLine.replace(/[●■☆★\[\]\(\)\.\,]/g, ' ').replace(/(추가|정정|급급)/g, '').trim();
    const cleanNoSpace = cleanLine.replace(/\s+/g, '');

    if (!cleanNoSpace) continue;

    // 거래처 이름 매칭 로직 (품목 단어가 없으면서 이름과 일치하는지 확인)
    const isItemLine = /(삼겹|목살|전지|후지|등뼈|항정|가브리|갈매기|갈비|등심|안심|사태|차돌|우삼겹|돈피|모돈|박스|팩|키로|kg)\s*\d/i.test(cleanLine);
    
    let matchedDB = null;
    if (!isItemLine) {
      let bestLen = 0;
      for (const c of CLIENT_DB) {
        for (const k of [c.name, ...c.aliases]) {
          const kNo = k.replace(/\s+/g, '');
          if (kNo.length >= 2 && cleanNoSpace.includes(kNo)) {
            if (kNo.length > bestLen) {
              bestLen = kNo.length;
              matchedDB = c;
            }
          }
        }
      }
    }

    if (matchedDB) {
      currentClient = matchedDB;
      if (!orderMap.has(currentClient.name)) {
        orderMap.set(currentClient.name, {
          client: currentClient,
          distKm: calcDistKm(DEPOT.lat, DEPOT.lon, currentClient.lat, currentClient.lon),
          items: []
        });
      }
    } else if (currentClient) {
      // 품목 줄 처리
      if (!/(부탁드립니다|감사합니다|이상입니다|안녕하세요)/.test(cleanLine) || /\d/.test(cleanLine)) {
        const parsed = parseUnitAndQty(rawLine);
        if (parsed.unit !== '취소' && parsed.qty > 0) {
          orderMap.get(currentClient.name).items.push({
            originalText: rawLine.replace(/^[●■-]\s*/, '').trim(),
            category: determineCategory(rawLine),
            qty: parsed.qty,
            unit: parsed.unit,
            isSpecialUnit: !['박스', '박스(추정)'].includes(parsed.unit)
          });
        }
      }
    }
  }

  parsedOrders = Array.from(orderMap.values()).filter(o => o.items.length > 0);
  
  // KPI 업데이트
  let allItemsCount = 0;
  let specialUnitsCount = 0;
  const catSet = new Set();
  
  parsedOrders.forEach(o => {
    o.items.forEach(it => {
      allItemsCount++;
      catSet.add(it.category);
      if (it.isSpecialUnit) specialUnitsCount++;
    });
  });

  document.getElementById('kpiStores').innerText = parsedOrders.length;
  document.getElementById('kpiCategories').innerText = catSet.size;
  document.getElementById('kpiSpecialUnits').innerText = specialUnitsCount;

  setTab('destinations');
}

// ==========================================================
// 5. 결과 화면 (탭별 렌더링)
// ==========================================================
function setTab(tabId) {
  currentTab = tabId;
  const tabs = ['destinations', 'items', 'specials'];
  tabs.forEach(t => {
    const btn = document.getElementById('tab_' + t);
    if (t === tabId) {
      btn.className = "flex-1 py-2 px-4 rounded-lg font-bold transition bg-indigo-500 text-white shadow";
    } else {
      btn.className = "flex-1 py-2 px-4 rounded-lg font-bold transition text-slate-300 hover:bg-slate-700 hover:text-white";
    }
  });

  const container = document.getElementById('outputContainer');
  if (parsedOrders.length === 0) {
    container.innerHTML = `<div class="p-10 text-center text-slate-400 font-medium">분석된 데이터가 없습니다.</div>`;
    return;
  }

  // 1) 배송지 목록 탭
  if (tabId === 'destinations') {
    // 거리순 정렬
    const sorted = [...parsedOrders].sort((a, b) => a.distKm - b.distKm);
    
    let html = `
    <div class="p-4">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-slate-800 text-sm">📍 배송지 목록 (미트포앤 기준 거리순 정렬)</h3>
        <span class="text-xs text-slate-500">배송지를 클릭하면 상세 품목이 열립니다.</span>
      </div>
      <div class="flex flex-col gap-2">
    `;

    sorted.forEach((o, i) => {
      html += `
        <details class="bg-slate-50 border border-slate-200 rounded-lg overflow-hidden group">
          <summary class="p-3 bg-white flex justify-between items-center hover:bg-slate-50 transition border-b border-transparent group-open:border-slate-200">
            <div class="flex items-center gap-3">
              <span class="bg-indigo-100 text-indigo-700 font-bold px-2 py-1 rounded text-xs">${i+1}</span>
              <div>
                <div class="font-extrabold text-slate-900">${o.client.name}</div>
                <div class="text-[11px] text-slate-500 mt-0.5">${o.client.region} · ${o.client.addr}</div>
              </div>
            </div>
            <div class="flex items-center gap-3 text-right">
              <div class="text-xs font-bold text-slate-600">${o.distKm.toFixed(1)} km</div>
              <div class="bg-slate-800 text-white text-[10px] px-2 py-1 rounded">▼ 상세 보기</div>
            </div>
          </summary>
          <div class="p-3 bg-slate-50 text-xs">
            <table class="w-full text-left">
              <tbody>
                ${o.items.map(it => `
                  <tr class="border-b border-slate-200/60 last:border-0">
                    <td class="py-1.5 text-slate-700">${it.originalText}</td>
                    <td class="py-1.5 text-right font-bold ${it.isSpecialUnit ? 'text-rose-600' : 'text-indigo-600'}">${it.qty} <span class="text-[10px] font-normal">${it.unit}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </details>
      `;
    });
    html += `</div></div>`;
    container.innerHTML = html;
  }

  // 2) 전체 발주 항목표 (품목별)
  else if (tabId === 'items') {
    // 카테고리별로 묶기
    const catMap = {};
    parsedOrders.forEach(o => {
      o.items.forEach(it => {
        if (!catMap[it.category]) catMap[it.category] = [];
        catMap[it.category].push({ client: o.client.name, item: it });
      });
    });

    // 정렬 (삼겹살 등 주요 품목이 위로 오게)
    const sortedCats = Object.keys(catMap).sort((a, b) => {
      const idxA = MEAT_CATEGORIES.indexOf(a);
      const idxB = MEAT_CATEGORIES.indexOf(b);
      return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
    });

    let html = `
    <div class="p-4">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-slate-800 text-sm">🥩 전체 발주 항목표 (카테고리 묶음)</h3>
        <span class="text-xs text-slate-500">품목명을 클릭하면 주문한 상호가 나옵니다.</span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    `;

    sortedCats.forEach(cat => {
      const items = catMap[cat];
      const totalBox = items.filter(x => x.item.unit.includes('박스')).reduce((s, x) => s + x.item.qty, 0);
      const totalSpecial = items.filter(x => x.item.isSpecialUnit).length;
      
      let badgeHtml = '';
      if (totalBox > 0) badgeHtml += `<span class="bg-indigo-100 text-indigo-800 px-1.5 py-0.5 rounded text-[10px] ml-2">${totalBox}박스</span>`;
      if (totalSpecial > 0) badgeHtml += `<span class="bg-rose-100 text-rose-800 px-1.5 py-0.5 rounded text-[10px] ml-1">특수단위 ${totalSpecial}건</span>`;

      html += `
        <details class="bg-white border border-slate-300 rounded-lg shadow-sm group">
          <summary class="p-3 bg-slate-100 hover:bg-slate-200 flex justify-between items-center border-b border-transparent group-open:border-slate-300 transition">
            <div class="font-extrabold text-slate-800 text-sm">${cat} ${badgeHtml}</div>
            <div class="text-slate-500 text-[10px] font-bold">▼</div>
          </summary>
          <div class="p-2">
            <table class="w-full text-[11px] text-left">
              <tbody>
                ${items.map(x => `
                  <tr class="border-b border-slate-100 last:border-0 hover:bg-slate-50">
                    <td class="py-1.5 px-2 font-bold text-slate-700 w-1/3 truncate">${x.client}</td>
                    <td class="py-1.5 px-2 text-slate-600">${x.item.originalText}</td>
                    <td class="py-1.5 px-2 text-right font-extrabold ${x.item.isSpecialUnit ? 'text-rose-600' : 'text-slate-800'}">${x.item.qty}${x.item.unit}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </details>
      `;
    });
    html += `</div></div>`;
    container.innerHTML = html;
  }

  // 3) 팩/Kg 특수단위 작업목록
  else if (tabId === 'specials') {
    const specialItems = [];
    parsedOrders.forEach(o => {
      o.items.filter(it => it.isSpecialUnit).forEach(it => {
        specialItems.push({ client: o.client.name, item: it });
      });
    });

    let html = `
    <div class="p-4">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-slate-800 text-sm">🔪 팩 / Kg / 개 특수단위 작업 목록</h3>
        <span class="text-xs text-rose-600 font-bold">소분 및 개별 작업이 필요한 항목만 모았습니다.</span>
      </div>
      <div class="overflow-x-auto border border-slate-200 rounded-lg">
        <table class="w-full text-xs text-left">
          <thead class="bg-rose-50 text-rose-900 border-b border-rose-200">
            <tr>
              <th class="p-2.5 w-10 text-center">번호</th>
              <th class="p-2.5 w-48">거래처명</th>
              <th class="p-2.5">발주 원문 (작업 내용)</th>
              <th class="p-2.5 w-24 text-right">수량 / 단위</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-200 bg-white">
            ${specialItems.length === 0 ? '<tr><td colspan="4" class="p-4 text-center text-slate-400">특수 단위 발주가 없습니다.</td></tr>' : ''}
            ${specialItems.map((x, i) => `
              <tr class="hover:bg-rose-50/50">
                <td class="p-2.5 text-center text-slate-400 font-mono">${i+1}</td>
                <td class="p-2.5 font-bold text-slate-800">${x.client}</td>
                <td class="p-2.5 text-slate-600 font-medium">${x.item.originalText}</td>
                <td class="p-2.5 text-right font-extrabold text-rose-600 text-sm">${x.item.qty} <span class="text-[10px] font-medium text-rose-500">${x.item.unit}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
    container.innerHTML = html;
  }
}
</script>
</body>
</html>
