<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>미트포앤(모바일 전용)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f1f5f9; padding-bottom: 80px; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    details > summary { list-style: none; outline: none; }
    details > summary::-webkit-details-marker { display: none; }

</head>
<body class="text-slate-800">

  <!-- 상단 알림 토스트 (모바일 피드백용) -->
  <div id="toastBanner" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden bg-indigo-600 text-white px-4 py-2.5 rounded-full shadow-xl font-bold text-xs flex items-center gap-2 transition-all">
    <span id="toastMsg">✅ 분석 완료!</span>
  </div>

  <!-- 모바일 플로팅 헤더 -->
  <header class="fixed top-0 w-full z-50 bg-slate-900 text-white shadow-md">
    <div class="px-3 py-2 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="bg-amber-500 text-slate-950 font-extrabold px-1.5 py-0.5 rounded text-[10px]">미트포앤</span>
        <h1 class="text-sm font-bold truncate">모바일 발주 집계</h1>
      </div>
      <div class="text-[10px] font-medium bg-slate-800 px-2 py-1 rounded border border-slate-700">
        <span id="dbStatusBadge" class="text-rose-400 font-bold">CSV 미등록</span>
      </div>
    </div>
    
    <!-- 4대 요약 KPI (항상 보임) -->
    <div class="bg-slate-800 border-t border-slate-700 grid grid-cols-4 text-center divide-x divide-slate-700">
      <div class="py-1.5">
        <div class="text-[9px] text-slate-400 mb-0.5">납품처</div>
        <div class="text-sm font-bold text-white leading-tight"><span id="kpiStores">0</span><span class="text-[9px] font-normal ml-0.5">곳</span></div>
      </div>
      <div class="py-1.5">
        <div class="text-[9px] text-slate-400 mb-0.5">총 박스</div>
        <div class="text-sm font-bold text-indigo-400 leading-tight"><span id="kpiTotalBoxes">0.0</span><span class="text-[9px] font-normal ml-0.5">박</span></div>
      </div>
      <div class="py-1.5">
        <div class="text-[9px] text-slate-400 mb-0.5">추가/정정</div>
        <div class="text-sm font-bold text-rose-400 leading-tight"><span id="kpiDelta">0</span><span class="text-[9px] font-normal ml-0.5">건</span></div>
      </div>
      <div class="py-1.5">
        <div class="text-[9px] text-slate-400 mb-0.5">특수(팩/kg)</div>
        <div class="text-sm font-bold text-amber-400 leading-tight"><span id="kpiSpecials">0</span><span class="text-[9px] font-normal ml-0.5">건</span></div>
      </div>
    </div>
  </header>

  <!-- 여백 보상 -->
  <div class="h-[90px]"></div>

  <main class="p-3 flex flex-col gap-3">

    <!-- 1. 설정 및 입력 섹션 -->
    <details class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden" open id="inputDetails">
      <summary class="p-3 bg-slate-50 flex justify-between items-center font-bold text-sm text-slate-700 cursor-pointer">
        <div class="flex items-center gap-2">
          <span>⚙️ 데이터 입력 및 AI 설정</span>
        </div>
        <span class="arrow text-slate-400 text-xs transition-transform duration-200">▼</span>
      </summary>
      
      <div class="p-3 flex flex-col gap-3 text-xs">
        
        <!-- API 키 입력 -->
        <div class="bg-indigo-50 p-2.5 rounded-lg border border-indigo-100 flex flex-col gap-1">
          <label class="font-bold text-indigo-800 flex justify-between">
            <span>🔑 Google Gemini API Key</span>
            <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-[10px] text-indigo-500 underline font-normal">키 발급/확인</a>
          </label>
          <input type="password" id="geminiApiKey" placeholder="AI Studio에서 발급받은 API 키 입력" class="w-full bg-white border border-indigo-200 rounded px-2 py-1.5 font-mono text-slate-800 focus:ring-1 focus:ring-indigo-500" />
        </div>

        <!-- 주소록 업로드 -->
        <label class="w-full bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 p-2.5 rounded-lg text-center font-bold flex flex-col items-center justify-center transition active:scale-[0.98]">
          <span class="text-base mb-0.5">📂</span>
          <span>1. 거래처 주소록(CSV) 먼저 업로드하기</span>
          <input type="file" id="csvFileInput" accept=".csv" class="hidden" />
        </label>

        <!-- 출고일 선택 -->
        <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200">
          <label class="font-bold text-slate-700 block mb-1">📅 출고(배송) 기준일 선택</label>
          <input type="date" id="targetDate" class="w-full bg-white border border-slate-300 rounded px-2 py-1.5 font-bold text-slate-800" />
          <div class="text-[10px] text-slate-500 mt-1.5 leading-tight">
            ※ <b>[전날 오전 10시 ~ 당일 오후 2시]</b> 사이 카톡만 추출. 단, 본문에 <b>오늘/내일</b> 단어가 있으면 예외 자동 적용.
          </div>
        </div>

        <!-- 카톡 TXT 파일 직접 업로드 -->
        <label class="w-full bg-amber-100 hover:bg-amber-200 text-amber-800 border border-amber-300 p-2.5 rounded-lg text-center font-bold flex flex-col items-center justify-center transition active:scale-[0.98] cursor-pointer">
          <span class="text-base mb-0.5">📄</span>
          <span>2. 카카오톡 내보내기(.txt) 파일 업로드</span>
          <input type="file" id="txtFileInput" accept=".txt,text/plain" class="hidden" />
        </label>

        <!-- 텍스트 직접 입력창 (보조용) -->
        <div>
          <div class="flex justify-between items-end mb-1">
            <label class="font-bold text-slate-700 block">💬 또는 대화 내용 복사해서 붙여넣기</label>
            <button onclick="document.getElementById('kakaoInput').value=''" class="text-[10px] text-rose-500 font-bold bg-rose-50 px-2 py-1 rounded">지우기</button>
          </div>
          <textarea id="kakaoInput" class="w-full h-24 border border-slate-300 rounded-lg p-2 font-mono text-[11px] leading-tight bg-slate-50 focus:bg-white focus:ring-1 focus:ring-indigo-500 focus:outline-none resize-none" placeholder="파일 업로드 대신 텍스트를 바로 붙여넣어도 됩니다."></textarea>
        </div>

        <!-- 실행 버튼 -->
        <button id="btnRunAnalyze" onclick="runAiAnalysis()" class="w-full bg-indigo-600 text-white font-extrabold text-sm py-3.5 rounded-xl shadow-md active:scale-[0.98] transition flex items-center justify-center gap-1.5">
          <span id="btnRunText">🚀 AI 추출 및 집계 실행</span>
        </button>
      </div>
    </details>

    <!-- 2. 모바일 스와이프 탭 -->
    <div class="flex gap-1.5 overflow-x-auto hide-scrollbar text-xs font-bold whitespace-nowrap mt-1">
      <button onclick="setTab('destinations')" id="tab_destinations" class="flex-1 min-w-[100px] py-2.5 px-2 rounded-lg bg-indigo-500 text-white shadow transition-all">📍 1. 배송지</button>
      <button onclick="setTab('items')" id="tab_items" class="flex-1 min-w-[110px] py-2.5 px-2 rounded-lg bg-slate-200 text-slate-600 transition-all">🥩 2. 전체품목</button>
      <button onclick="setTab('specials')" id="tab_specials" class="flex-1 min-w-[110px] py-2.5 px-2 rounded-lg bg-slate-200 text-slate-600 transition-all">🔪 3. 팩/Kg 소분</button>
    </div>

    <!-- 3. 결과 출력 컨테이너 -->
    <div id="outputContainer" class="bg-white rounded-xl shadow-sm border border-slate-200 min-h-[300px] overflow-hidden">
      <div class="p-8 text-center text-slate-400 font-medium text-xs leading-relaxed">
        위쪽 박스에서 파일을 업로드하거나<br>텍스트를 넣고 <b class="text-indigo-500">[실행]</b>을 누르세요.
      </div>
    </div>

  </main>

<script>
// ==========================================================
// 1. 전역 상태 및 날짜 세팅
// ==========================================================
let CLIENT_DB = [];
let parsedOrders = [];
let currentTab = 'destinations';

const MEAT_CATEGORIES = ['삼겹', '오겹', '특목살', '목살', 'B목살', '미전지', '전지', '미후지', '냉장3mm후지', '후지', '등뼈', '등심', '안심', '갈비', '등갈비', '항정', '가브리', '갈매기', '사태', '우삼겹', '차돌', '돈피', '장족', '모돈', '민찌', '살치', '홍두깨', '늑간'];

// 오늘 날짜 셋팅
const today = new Date();
const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
document.getElementById('targetDate').value = todayStr;

// API 키 브라우저 자동 저장
window.addEventListener('DOMContentLoaded', () => {
  const savedKey = localStorage.getItem('geminiApiKey');
  if (savedKey) document.getElementById('geminiApiKey').value = savedKey;
});
document.getElementById('geminiApiKey').addEventListener('change', function() {
  localStorage.setItem('geminiApiKey', this.value.trim());
});

// UI 피드백 토스트
function showToast(msg, isError = false) {
  const banner = document.getElementById('toastBanner');
  document.getElementById('toastMsg').innerText = msg;
  banner.className = `fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full shadow-xl font-bold text-xs flex items-center gap-2 transition-all ${isError ? 'bg-rose-600 text-white' : 'bg-indigo-600 text-white'}`;
  banner.classList.remove('hidden');
  setTimeout(() => banner.classList.add('hidden'), 3000);
}

// 거리 계산 (Haversine)
const DEPOT = { lat: 37.305, lon: 126.855 };
function calcDistKm(lat1, lon1, lat2, lon2) {
  const R = 6371.0;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 1.35;
}

// 대체 위경도
function getApproxGeo(addr) {
  if (addr.includes('대부')) return { region: '안산 대부', lat: 37.24, lon: 126.58 };
  if (addr.includes('단원구') || addr.includes('정왕') || addr.includes('배곧')) return { region: '안산/시흥 서부', lat: 37.33, lon: 126.75 };
  if (addr.includes('상록구') || addr.includes('매송')) return { region: '안산/화성 내륙', lat: 37.30, lon: 126.85 };
  if (addr.includes('서울')) return { region: '서울권', lat: 37.5, lon: 126.9 };
  if (addr.includes('인천')) return { region: '인천권', lat: 37.45, lon: 126.70 };
  if (addr.includes('부천') || addr.includes('광명')) return { region: '부천/광명', lat: 37.49, lon: 126.82 };
  if (addr.includes('수원') || addr.includes('동탄') || addr.includes('오산') || addr.includes('용인')) return { region: '경기 동남부', lat: 37.26, lon: 127.05 };
  return { region: '기타/지방', lat: 37.38, lon: 126.80 };
}

// ==========================================================
// 2. CSV 파일 업로드
// ==========================================================
document.getElementById('csvFileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    CLIENT_DB = [];
    const lines = evt.target.result.split(/\r?\n/);
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',');
      if (cols.length >= 2 && cols[0].trim()) {
        const name = cols[0].trim();
        const addr = cols[1].trim();
        const customAlias = cols[2] ? cols[2].trim() : '';
        const baseClean = name.replace(/\([^\)]*\)/g, '').replace(/(주식회사|농업회사법인|\(주\))/g, '').trim();
        
        let aliases = [];
        if (customAlias) aliases.push(customAlias);
        if (baseClean && baseClean !== name && baseClean.length > 1) aliases.push(baseClean);
        
        const geo = getApproxGeo(addr);
        CLIENT_DB.push({ name, addr, aliases, region: geo.region, lat: geo.lat, lon: geo.lon });
      }
    }
    document.getElementById('dbStatusBadge').innerText = `${CLIENT_DB.length}곳 등록완료`;
    document.getElementById('dbStatusBadge').className = "text-emerald-400 font-bold";
    showToast(`✅ 주소록 ${CLIENT_DB.length}곳 로드 완료`);
  };
  reader.readAsText(file, 'utf-8');
});

document.getElementById('txtFileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    document.getElementById('kakaoInput').value = evt.target.result;
    showToast(`📄 파일 로딩 완료! 분석을 시작합니다.`);
    runAiAnalysis();
  };
  reader.readAsText(file, 'utf-8');
});


// ==========================================================
// 3. AI 연동 및 데이터 분석 (최신 모델: gemini-3.5-flash)
// ==========================================================
async function runAiAnalysis() {
  const apiKey = document.getElementById('geminiApiKey').value.trim();
  if (!apiKey) {
    alert("⚠️ Google Gemini API 키를 먼저 입력해주세요.");
    return;
  }
  if (CLIENT_DB.length === 0) {
    alert("⚠️ 거래처 주소록(CSV)을 먼저 업로드해 주세요.");
    return;
  }

  const rawText = document.getElementById('kakaoInput').value.trim();
  if (!rawText) {
    alert("카톡 텍스트나 파일을 입력해 주세요.");
    return;
  }

  const btn = document.getElementById('btnRunAnalyze');
  const btnText = document.getElementById('btnRunText');
  btn.disabled = true;
  btn.classList.add('opacity-75');
  btnText.innerText = "⏳ AI가 발주를 분리 중입니다... (약 3~5초)";

  try {
    const targetDateStr = document.getElementById('targetDate').value;
    const tDt = new Date(targetDateStr + "T00:00:00");
    const winStart = new Date(tDt.getFullYear(), tDt.getMonth(), tDt.getDate() - 1, 10, 0); 
    const winEnd = new Date(tDt.getFullYear(), tDt.getMonth(), tDt.getDate(), 14, 0); 

    const lines = rawText.split(/\r?\n/);
    const blocks = [];
    let curBlock = null;
    let currentExtractDate = tDt; 

    // 모바일, PC 모두 호환되는 정규식
    const reMobileDot = /^\s*[·\.\-]?\s*(\d{1,2})[\/\.](\d{1,2})\.?\s+(오전|오후)\s+(\d{1,2}):(\d{2}),\s*([^:]+)\s*:\s*(.*)$/;
    const reExport = /^(\d{4})[년\.\-\/]\s*(\d{1,2})[월\.\-\/]\s*(\d{1,2})[일\.]?\s*(오전|오후)?\s*(\d{1,2}):(\d{2}),\s*([^:]+)\s*:\s*(.*)$/;
    const rePc = /^\[([^\]]+)\]\s*\[(오전\vert{}오후)?\s*(\d{1,2}):(\d{2})\]\s*(.*)$/;
    const reDateDiv = /^-*\s*(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/;

    for (const rawLine of lines) {
      const line = rawLine.trim();
      if (!line || line.includes('저장한 날짜') || line.includes('카카오톡 대화')) continue;

      const mDateDiv = line.match(reDateDiv);
      if (mDateDiv) {
        currentExtractDate = new Date(parseInt(mDateDiv[1]), parseInt(mDateDiv[2]) - 1, parseInt(mDateDiv[3]));
        continue;
      }

      const mDot = line.match(reMobileDot);
      const mExp = line.match(reExport);
      const mPc = line.match(rePc);

      let dt = null;

      if (mDot) {
        let mo = parseInt(mDot[1]), dy = parseInt(mDot[2]), ampm = mDot[3];
        let hr = parseInt(mDot[4]), mn = parseInt(mDot[5]);
        if (ampm === '오후' && hr !== 12) hr += 12;
        if (ampm === '오전' && hr === 12) hr = 0;
        dt = new Date(tDt.getFullYear(), mo - 1, dy, hr, mn);
        curBlock = { dt, lines: mDot[7].trim() ? [mDot[7].trim()] : [] };
      } else if (mExp) {
        let yr = parseInt(mExp[1]), mo = parseInt(mExp[2]), dy = parseInt(mExp[3]), ampm = mExp[4] || '';
        let hr = parseInt(mExp[5]), mn = parseInt(mExp[6]);
        if (ampm === '오후' && hr !== 12) hr += 12;
        if (ampm === '오전' && hr === 12) hr = 0;
        dt = new Date(yr, mo - 1, dy, hr, mn);
        curBlock = { dt, lines: mExp[8].trim() ? [mExp[8].trim()] : [] };
      } else if (mPc) {
        let ampm = mPc[2] || '', hr = parseInt(mPc[3]), mn = parseInt(mPc[4]);
        if (ampm === '오후' && hr !== 12) hr += 12;
        if (ampm === '오전' && hr === 12) hr = 0;
        dt = new Date(currentExtractDate.getFullYear(), currentExtractDate.getMonth(), currentExtractDate.getDate(), hr, mn);
        curBlock = { dt, lines: mPc[5].trim() ? [mPc[5].trim()] : [] };
      }

      if (dt) {
        if (curBlock && curBlock.lines.length > 0) blocks.push(curBlock);
      } else {
        if (!curBlock) curBlock = { dt: tDt, lines: [] };
        curBlock.lines.push(line);
      }
    }
    if (curBlock && curBlock.lines.length > 0) blocks.push(curBlock);

    // 지정일 Time Window 필터링 + 오늘/내일 키워드 검사
    let filteredText = "";
    for (const b of blocks) {
      const fullBody = b.lines.join(' ');
      const hasToday = fullBody.includes('오늘') || fullBody.includes('금일');
      const hasTomorrow = fullBody.includes('내일') || fullBody.includes('모레') || fullBody.includes('금요일');
      const isPrevDayMsg = b.dt < new Date(tDt.getFullYear(), tDt.getMonth(), tDt.getDate(), 0, 0);

      let isValid = false;
      if (b.dt >= winStart && b.dt <= winEnd) isValid = true;
      if (isPrevDayMsg) {
          if (hasToday) isValid = false;
          if (hasTomorrow) isValid = true;
      } else {
          if (hasTomorrow) isValid = false;
          if (hasToday) isValid = true;
      }

      if (isValid) {
        const cleanBody = b.lines.map(l => l.replace(/^전달:\s*/, '').trim()).join('\n');
        filteredText += `[시간: ${b.dt.toLocaleString()}]\n${cleanBody}\n\n`;
      }
    }

    if (!filteredText.trim()) {
      alert("⚠️ 지정일 시간대(전날 오전 10시~당일 오후 2시)에 유효한 발주가 없습니다.");
      btn.disabled = false; btn.classList.remove('opacity-75');
      btnText.innerText = "🚀 AI 추출 및 집계 실행";
      return;
    }

    // 🔥 404 에러 원인이었던 구형 모델명 제거 후 최신 모델 연결 🔥
    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`;

    const prompt = `
너는 육가공 도매업체 '미트포앤'의 카톡 발주 데이터를 정리하는 AI야.
아래 카카오톡 대화 내용에서 '실제 발주(주문)' 내역만 추출해서 순수 JSON 배열로 반환해.

[절대 주의사항 - 계근 기록 및 요약본 제외]
1. 현장 직원이 고기 무게를 잰 '계근 기록' (예: "암삼 21대 16.9 16.9", "19대 6.10")은 절대 발주가 아니니 무조건 버려! 숫자에 소수점(16.9)이 있거나 단위가 '대', '포', '개'이면 100% 버릴 것.
2. 메시지 첫 줄이 "발주체크"로 시작하는 전체 요약본은 이중 집계되므로 무조건 버려.

[수량 및 단위 추출 규칙]
- 단위는 '박스', '팩', '봉', 'kg', '마리', '판' 등으로 정확히 구분해.
- 만약 품목명 뒤에 숫자만 달랑 적혀있다면 (예: "삼겹 2"), 현장 관행상 '박스'로 간주해.
- "패스", "취소" 단어가 포함된 품목은 발주에서 제외해.

[출력 형식]
반드시 배열 구조로만 대답해. 마크다운은 생략해.
[
  {
    "client_name": "상호명(카톡에 적힌 원문 그대로)",
    "original_text": "발주 원문 1줄 (예: 삼겹 2박스 대산)",
    "category": "대표 품목 (예: 삼겹, 목살, 미전지, 등뼈 등)",
    "qty": 2.0,
    "unit": "박스",
    "is_special_unit": false,
    "is_delta": false
  }
]
* is_special_unit: 단위가 '박스'가 아니면 true.
* is_delta: 원문에 '추가'나 '정정'이 포함되어 있으면 true.

[대화 내용]
${filteredText}
    `;

    const response = await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { 
            temperature: 0.1,
            responseMimeType: "application/json" // 확실한 JSON 응답 보장
        } 
      })
    });

    if (!response.ok) {
      if (response.status === 400) throw new Error("API 키가 올바르지 않습니다.");
      if (response.status === 404) throw new Error("API 모델 연결 실패 (404).");
      throw new Error(`API 호출 실패: ${response.status} 에러`);
    }

    const data = await response.json();
    const jsonStr = data.candidates[0].content.parts[0].text;
    const aiOrders = JSON.parse(jsonStr);

    const orderMap = new Map();
    
    for (const item of aiOrders) {
      let matchedClient = null;
      let bestLen = 0;
      const cNoSpace = item.client_name.replace(/[●■☆★\[\]\(\)\.\,]/g, ' ').replace(/\s+/g, '');
      
      for (const c of CLIENT_DB) {
        for (const k of [c.name, ...c.aliases]) {
          const kNo = k.replace(/\s+/g, '');
          if (kNo.length >= 2 && cNoSpace.includes(kNo)) {
            if (kNo.length > bestLen) {
              bestLen = kNo.length;
              matchedClient = c;
            }
          }
        }
      }

      if (!matchedClient) continue; 

      if (!orderMap.has(matchedClient.name)) {
        orderMap.set(matchedClient.name, { 
            client: matchedClient, 
            distKm: calcDistKm(DEPOT.lat, DEPOT.lon, matchedClient.lat, matchedClient.lon), 
            items: [],
            isDelta: false
        });
      }

      const entry = orderMap.get(matchedClient.name);
      if (item.is_delta) entry.isDelta = true;
      
      entry.items.push({
        originalText: item.original_text,
        category: item.category,
        qty: parseFloat(item.qty),
        unit: item.unit,
        isSpecialUnit: item.is_special_unit,
        isDeltaItem: item.is_delta
      });
    }

    parsedOrders = Array.from(orderMap.values());
    
    if (parsedOrders.length > 0) {
      showToast(`✨ AI 분석 완료! ${parsedOrders.length}곳 추출 성공`);
      document.getElementById('inputDetails').open = false; 
    } else {
      showToast(`⚠️ AI 분석 결과 유효한 발주가 없습니다.`, true);
    }

    let specialUnitsCount = 0;
    let deltaCount = 0;
    let totalBoxes = 0;
    const catSet = new Set();
    
    parsedOrders.forEach(o => {
      if (o.isDelta) deltaCount++;
      o.items.forEach(it => {
        catSet.add(it.category);
        if (it.unit.includes('박스')) totalBoxes += it.qty;
        else if (it.isSpecialUnit) {
          specialUnitsCount++;
          totalBoxes += (it.qty * 0.35); 
        }
      });
    });

    document.getElementById('kpiStores').innerText = parsedOrders.length;
    document.getElementById('kpiTotalBoxes').innerText = Math.round(totalBoxes*10)/10;
    document.getElementById('kpiDelta').innerText = deltaCount;
    document.getElementById('kpiCategories').innerText = catSet.size;
    document.getElementById('kpiSpecials').innerText = specialUnitsCount;

    setTab('destinations');

  } catch (err) {
    console.error(err);
    alert("오류 발생: " + err.message + "\n(입력한 API 키가 정확한지 확인해주세요.)");
  } finally {
    btn.disabled = false;
    btn.classList.remove('opacity-75');
    btnText.innerText = "🚀 AI 추출 및 집계 실행";
  }
}

// 4. 모바일 스와이프 탭별 렌더링
// ==========================================================
function setTab(tabId) {
  currentTab = tabId;
  const tabs = ['destinations', 'items', 'specials'];
  tabs.forEach(t => {
    const btn = document.getElementById('tab_' + t);
    if (t === tabId) {
      btn.className = "flex-1 min-w-[100px] py-2.5 px-2 rounded-lg text-white font-bold transition-all shadow bg-indigo-500";
    } else {
      btn.className = "flex-1 min-w-[100px] py-2.5 px-2 rounded-lg text-slate-600 font-bold transition-all bg-slate-200 hover:bg-slate-300";
    }
  });

  const container = document.getElementById('outputContainer');

  if (tabId === 'destinations') {
    const sorted = [...parsedOrders].sort((a, b) => a.distKm - b.distKm);
    let html = `<div class="p-2">`;
    sorted.forEach((o, i) => {
      let bSum = o.items.filter(it => it.unit.includes('박스')).reduce((s,it) => s+it.qty, 0);
      let sSum = o.items.filter(it => it.isSpecialUnit).length;
      html += `
        <details class="bg-slate-50 border border-slate-200 rounded-xl mb-2.5 overflow-hidden group">
          <summary class="p-3 bg-white flex justify-between items-center active:bg-slate-50 border-b border-transparent group-open:border-slate-200 cursor-pointer">
            <div class="flex items-center gap-2.5 truncate">
              <span class="bg-indigo-100 text-indigo-700 font-extrabold w-6 h-6 flex items-center justify-center rounded-full text-[10px] flex-shrink-0">${i+1}</span>
              <div class="truncate">
                <div class="font-extrabold text-slate-900 text-sm flex items-center gap-1.5 truncate">
                  <span class="truncate">${o.client.name}</span>
                  ${o.isDelta ? '<span class="bg-rose-100 text-rose-600 px-1 py-0.5 rounded text-[8px] flex-shrink-0">추가/수정</span>' : ''}
                </div>
                <div class="text-[10px] text-slate-500 mt-0.5 truncate">${o.client.region} <span class="text-slate-300">|</span> 약 ${o.distKm.toFixed(1)}km</div>
              </div>
            </div>
            <div class="flex flex-col items-end gap-1 flex-shrink-0 ml-2">
              <span class="text-xs font-extrabold text-indigo-600">${bSum > 0 ? bSum+'박' : ''}${sSum > 0 ? ' +특수' : ''}</span>
              <span class="text-[9px] bg-slate-200 text-slate-500 px-1.5 py-0.5 rounded arrow inline-block">▼ 열기</span>
            </div>
          </summary>
          <div class="p-3 bg-slate-50 text-xs">
            <table class="w-full text-left">
              <tbody>
                ${o.items.map(it => `
                  <tr class="border-b border-slate-200/50 last:border-0">
                    <td class="py-2 text-slate-700">${it.originalText}</td>
                    <td class="py-2 text-right font-bold whitespace-nowrap ${it.isSpecialUnit ? 'text-rose-600' : 'text-indigo-600'}">${it.qty}<span class="text-[9px] font-normal ml-0.5">${it.unit}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </details>
      `;
    });
    html += `</div>`;
    container.innerHTML = html;
  }

  else if (tabId === 'items') {
    const catMap = {};
    parsedOrders.forEach(o => {
      o.items.forEach(it => {
        if (!catMap[it.category]) catMap[it.category] = [];
        catMap[it.category].push({ client: o.client.name, item: it });
      });
    });

    const sortedCats = Object.keys(catMap).sort((a, b) => {
      const cats = ['삼겹', '오겹', '목살', '특목살', '미전지', '전지', '미후지', '등뼈', '갈비', '등심', '항정', '가브리', '기타 품목'];
      const idxA = cats.indexOf(a); const idxB = cats.indexOf(b);
      return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
    });

    let html = `<div class="p-2 flex flex-col gap-2">`;
    sortedCats.forEach(cat => {
      const items = catMap[cat];
      const tBox = items.filter(x => x.item.unit.includes('박스')).reduce((s, x) => s + x.item.qty, 0);
      const tSpc = items.filter(x => x.item.isSpecialUnit).length;
      html += `
        <details class="bg-white border border-slate-300 rounded-xl shadow-sm group">
          <summary class="p-3 bg-slate-50 hover:bg-slate-100 flex justify-between items-center border-b border-transparent group-open:border-slate-300 cursor-pointer">
            <div class="font-extrabold text-slate-800 text-sm flex items-center gap-2">
              ${cat}
              ${tBox > 0 ? `<span class="bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded text-[10px] font-bold">${tBox}박</span>` : ''}
              ${tSpc > 0 ? `<span class="bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded text-[10px] font-bold">특수 ${tSpc}</span>` : ''}
            </div>
            <div class="text-slate-400 text-[10px] font-bold arrow">▼ 열기</div>
          </summary>
          <div class="p-1">
            <table class="w-full text-[11px] text-left">
              <tbody>
                ${items.map(x => `
                  <tr class="border-b border-slate-100 last:border-0 hover:bg-slate-50">
                    <td class="py-2 px-2 font-bold text-slate-700 w-[35%] truncate leading-tight">${x.client}</td>
                    <td class="py-2 px-1 text-slate-600 leading-tight">${x.item.originalText}</td>
                    <td class="py-2 px-2 text-right font-extrabold whitespace-nowrap ${x.item.isSpecialUnit ? 'text-rose-600' : 'text-slate-800'}">${x.item.qty}<span class="text-[9px] font-normal">${x.item.unit}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </details>
      `;
    });
    html += `</div>`;
    container.innerHTML = html;
  }

  else if (tabId === 'specials') {
    const specialItems = [];
    parsedOrders.forEach(o => {
      o.items.filter(it => it.isSpecialUnit).forEach(it => {
        specialItems.push({ client: o.client.name, item: it });
      });
    });

    let html = `
    <div class="p-2">
      <div class="bg-rose-50 border border-rose-200 rounded-xl overflow-hidden shadow-sm">
        <table class="w-full text-[11px] text-left">
          <thead class="bg-rose-100 text-rose-900 border-b border-rose-200">
            <tr>
              <th class="p-2 w-[40%] font-extrabold">거래처명</th>
              <th class="p-2 font-extrabold">품목/작업 지시 원문</th>
              <th class="p-2 w-[18%] text-right font-extrabold">수량</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-rose-100 bg-white">
            ${specialItems.length === 0 ? '<tr><td colspan="3" class="p-6 text-center text-slate-400">특수 단위 발주가 없습니다.</td></tr>' : ''}
            ${specialItems.map(x => `
              <tr class="active:bg-rose-50">
                <td class="p-2 font-bold text-slate-800 leading-tight">${x.client}</td>
                <td class="p-2 text-slate-600 leading-tight">${x.item.originalText}</td>
                <td class="p-2 text-right font-extrabold text-rose-600 whitespace-nowrap text-xs">${x.item.qty}<span class="text-[9px] font-normal ml-0.5">${x.item.unit}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
    container.innerHTML = html;
  }
}
