<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미트포앤 일일 동적 배차 · 역순 상차 자동화 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    @media print {
      .no-print { display: none !important; }
      .print-full { width: 100% !important; max-width: 100% !important; }
    }
  </style>
</head>
<body class="text-slate-800">

  <!-- 상단 헤더 -->
  <header class="bg-slate-900 text-white shadow-md no-print">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="bg-amber-500 text-slate-950 font-extrabold px-2.5 py-1 rounded text-sm">MEAT FOR &</span>
        <h1 class="text-lg md:text-xl font-bold tracking-tight">미트포앤 일일 발주 기반 동적 5대 배차 · 역순 상차 시스템</h1>
      </div>
      <div class="flex flex-wrap items-center gap-2 text-xs md:text-sm">
        <label class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-1.5 rounded cursor-pointer transition flex items-center gap-1.5">
          <span>📂 거래처 주소록(CSV) 추가/갱신</span>
          <input type="file" id="csvFileInput" accept=".csv" class="hidden" />
        </label>
        <button onclick="loadSampleOct21()" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded font-semibold transition">
          🧪 방금 입력한 카톡 발주(36곳) 불러오기
        </button>
        <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded font-semibold transition">
          🖨️ 작업지시서 인쇄
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 레이아웃 -->
  <main class="max-w-[1600px] mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-4">

    <!-- 좌측 패널: 카톡 입력 -->
    <section class="lg:col-span-4 bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col gap-3 no-print">
      <div class="flex items-center justify-between border-b pb-2">
        <h2 class="font-bold text-base">💬 1단계: 카카오톡 발주 데이터 입력</h2>
        <span id="dbCountBadge" class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-2 py-0.5 rounded font-bold">전체 거래처 198곳 내장완료</span>
      </div>

      <!-- 옵션 설정 -->
      <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 grid grid-cols-2 gap-2 text-xs">
        <div>
          <label class="font-semibold text-slate-600 block mb-1">📅 출고 기준일</label>
          <input type="date" id="targetDate" value="2026-10-22" class="w-full border border-slate-300 rounded px-2 py-1.5 font-semibold text-slate-800" />
        </div>
        <div>
          <label class="font-semibold text-slate-600 block mb-1">⚖️ 차량당 적재 상한(박스)</label>
          <input type="number" id="maxBoxLimit" value="58" min="25" max="100" onchange="reclusterAndRender()" class="w-full border border-slate-300 rounded px-2 py-1.5 font-bold text-slate-800" />
        </div>
      </div>

      <!-- 멀티 업로드 존 -->
      <div class="grid grid-cols-2 gap-2">
        <label class="border-2 border-dashed border-amber-400 bg-amber-50/50 hover:bg-amber-50 rounded-lg p-2.5 text-center cursor-pointer transition flex flex-col items-center justify-center gap-0.5">
          <span class="text-lg">📄</span>
          <span class="text-xs font-bold text-amber-900">카톡 내보내기 (.txt)</span>
          <span class="text-[11px] text-amber-700">클릭 또는 드래그</span>
          <input type="file" id="txtFileInput" accept=".txt" class="hidden" />
        </label>

        <label class="border-2 border-dashed border-blue-400 bg-blue-50/50 hover:bg-blue-50 rounded-lg p-2.5 text-center cursor-pointer transition flex flex-col items-center justify-center gap-0.5">
          <span class="text-lg">📸</span>
          <span class="text-xs font-bold text-blue-900">카톡 캡처 이미지(OCR)</span>
          <span class="text-[11px] text-blue-700">클릭 또는 화면에 Ctrl+V</span>
          <input type="file" id="imgFileInput" accept="image/*" multiple class="hidden" />
        </label>
      </div>

      <!-- OCR 진행 상태 -->
      <div id="ocrStatusBox" class="hidden bg-blue-50 border border-blue-200 rounded-lg p-2.5 text-xs text-blue-900">
        <div class="flex justify-between font-bold mb-1">
          <span id="ocrStatusText">📸 캡처 이미지 텍스트 추출 중...</span>
          <span id="ocrProgressPct">0%</span>
        </div>
        <div class="w-full bg-blue-200 h-2 rounded-full overflow-hidden">
          <div id="ocrProgressBar" class="bg-blue-600 h-full transition-all duration-200" style="width: 0%"></div>
        </div>
      </div>

      <!-- 텍스트 입력창 -->
      <div class="flex-1 flex flex-col">
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-semibold text-slate-600">✍️ 카카오톡 대화 텍스트 ([이름] [시간] 복붙 & 내보내기 모두 호환)</label>
          <button onclick="clearInput()" class="text-xs text-rose-600 hover:underline font-medium">비우기</button>
        </div>
        <textarea id="kakaoInput" rows="15" placeholder="[한재호(주)미트포앤] [오후 2:32] 태광&#10;내일&#10;빵삼겹 3박스&#10;&#10;위와 같은 PC 카톡 복사본이나 모바일 내보내기 텍스트를 그대로 붙여넣으세요." class="w-full flex-1 border border-slate-300 rounded-lg p-2.5 text-xs font-mono leading-relaxed focus:ring-2 focus:ring-indigo-500 focus:outline-none custom-scroll"></textarea>
      </div>

      <button onclick="parseAndAnalyze()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow transition flex items-center justify-center gap-2 text-sm">
        <span>🚀 당일 발주 거래처 자동 매칭 & 5대 동적 코스 생성</span>
      </button>
    </section>

    <!-- 우측 패널: 결과 보드 -->
    <section class="lg:col-span-8 flex flex-col gap-4 print-full">

      <!-- KPI 카드 -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200">
          <div class="text-xs text-slate-500 font-medium">당일 매칭 납품처</div>
          <div class="text-2xl font-extrabold text-slate-900 mt-0.5"><span id="kpiTotalStores">0</span><span class="text-sm font-normal text-slate-500 ml-1">곳</span></div>
          <div id="kpiWaveSplit" class="text-[11px] text-slate-500 mt-1">198개 전체 거래처 DB 자동대조</div>
        </div>
        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200">
          <div class="text-xs text-slate-500 font-medium">총 환산 물량 (박스)</div>
          <div class="text-2xl font-extrabold text-indigo-600 mt-0.5"><span id="kpiTotalBoxes">0.0</span><span class="text-sm font-normal text-slate-500 ml-1">박스</span></div>
          <div id="kpiBoxSplit" class="text-[11px] text-slate-500 mt-1">차량당 평균 0.0박스</div>
        </div>
        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200">
          <div class="text-xs text-slate-500 font-medium">⚡ 추가·정정(Delta)</div>
          <div class="text-2xl font-extrabold text-rose-600 mt-0.5"><span id="kpiMorningAdds">0</span><span class="text-sm font-normal text-slate-500 ml-1">곳</span></div>
          <div class="text-[11px] text-rose-600 font-medium mt-1">●추가 / 정정 / 오전 발주 포함</div>
        </div>
        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200">
          <div class="text-xs text-slate-500 font-medium">출발 준비 상태</div>
          <div id="kpiDepartureStatus" class="text-base font-extrabold text-emerald-600 mt-1">대기 중</div>
          <div class="text-[11px] text-slate-500 mt-1">방문지당 하차시간 설정 연동</div>
        </div>
      </div>

      <!-- 컨트롤 바 -->
      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-2 no-print">
        <div class="flex flex-wrap items-center gap-1.5">
          <button onclick="setViewMode('route')" id="btnModeRoute" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white transition">
            🚚 1. 배송 방문순 (1번➔끝번)
          </button>
          <button onclick="setViewMode('lifo')" id="btnModeLifo" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
            📦 2. 차량 역순 상차 지시서 (안쪽➔문쪽)
          </button>
          <button onclick="setViewMode('items')" id="btnModeItems" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
            🥩 3. 품목별 총 피킹 합산표
          </button>
        </div>

        <div class="flex flex-wrap items-center gap-3">
          <label class="flex items-center gap-1 text-xs font-medium text-slate-600 cursor-pointer">
            <input type="checkbox" id="chkIncludeRetail" onchange="parseAndAnalyze()" class="rounded text-indigo-600" />
            <span>사내 '제소매' 포함</span>
          </label>
          <label class="flex items-center gap-1.5 text-xs font-bold text-rose-600 cursor-pointer bg-rose-50 border border-rose-200 px-2.5 py-1.5 rounded-lg">
            <input type="checkbox" id="chkDeltaOnly" onchange="renderAll()" class="rounded text-rose-600" />
            <span>⚡ 추가/변경분만 보기</span>
          </label>
          <div class="flex items-center gap-1 text-xs">
            <span class="font-semibold text-slate-600">정차:</span>
            <input type="number" id="dwellMinutes" value="10" min="3" max="60" onchange="renderAll()" class="w-12 border border-slate-300 rounded px-1.5 py-1 text-center font-bold" />
            <span class="text-slate-500">분</span>
          </div>
        </div>
      </div>

      <!-- 차량 탭 -->
      <div class="flex overflow-x-auto gap-2 no-print" id="vehicleTabs"></div>

      <!-- 결과 컨테이너 -->
      <div id="resultContainer" class="flex flex-col gap-4"></div>

    </section>
  </main>

document.getElementById('csvFileInput').addEventListener('change', function(e) {

        const addr = cols[1].trim();

        if (!CLIENT_DB.some(c => c.name === name)) {
          const geo = getGeoInfoFromAddr(name, addr);
          const baseClean = name.replace(/\([^\)]*\)/g, '').trim();
          CLIENT_DB.push({
            name,
            aliases: alias ? [alias, baseClean] : [baseClean],
            addr,
            region: geo.region,
            lat: geo.lat,
            lon: geo.lon
          });
          added++;
        }
      }

    parseAndAnalyze();
  };

});

async function runOcrOnImages(files) {
  if (!files || files.length === 0) return;
  const statusBox = document.getElementById('ocrStatusBox');
  const statusText = document.getElementById('ocrStatusText');
  const pctText = document.getElementById('ocrProgressPct');
  const bar = document.getElementById('ocrProgressBar');
  statusBox.classList.remove('hidden');

  let combinedText = document.getElementById('kakaoInput').value;
  if (combinedText && !combinedText.endsWith('\n')) combinedText += '\n\n';

  for (let i = 0; i < files.length; i++) {
    statusText.innerText = `📸 캡처 이미지 인식 중 (${i + 1}/${files.length})...`;
    const result = await Tesseract.recognize(files[i], 'kor+eng', {
      logger: m => {
        if (m.status === 'recognizing text') {
          const p = Math.round(m.progress * 100);
          pctText.innerText = `${p}%`;
          bar.style.width = `${p}%`;
        }
      }
    });
    combinedText += `\n` + result.data.text.trim() + '\n';
  }
  document.getElementById('kakaoInput').value = combinedText.trim();
  statusText.innerText = `✅ 캡처 이미지 ${files.length}장 인식 완료!`;
  setTimeout(() => statusBox.classList.add('hidden'), 2000);
  parseAndAnalyze();
}

function findClientInLines(candidateLines) {
  for (let idx = 0; idx < candidateLines.length; idx++) {
    const rawLine = candidateLines[idx];
    const cleanLine = rawLine.replace(/[●■☆★\[\]\(\)\.\,]/g, ' ').replace(/(추가|더추가|이거로정정요|정정|오늘|내일|오후에|급급)/g, '').trim();
    const cleanNoSpace = cleanLine.replace(/\s+/g, '');
    if (!cleanNoSpace) continue;

    let bestClient = null;
    let bestLen = 0;
    for (const c of CLIENT_DB) {
      const allKeys = [c.name, ...c.aliases];
      for (const k of allKeys) {
        const kNoSpace = k.replace(/\s+/g, '');
        if (kNoSpace.length >= 2 && cleanNoSpace.includes(kNoSpace)) {
          if (kNoSpace.length > bestLen) {
            bestLen = kNoSpace.length;
            bestClient = c;
          }
        }
      }
    }
    if (bestClient) return { client: bestClient, lineIdx: idx, rawNick: cleanLine };
  }
  return null;
}

function parseOrderItemsFromLines(lines, isDelta) {
  const items = [];
  let boxSum = 0;
  const skipWords = ['안녕하십니까', '안녕하세요', '부탁드립니다', '부탁드려요', '부탁해요', '감사합니다', '이상입니다', '보내주세요', '주세여', '주세요', '발주입니다', '발주드리려고', '문자드립니다', '발주요', '주문합니다', '이렇게', '아차산입니다', '율전동에스할인마트입니다', '동탄점', '우편함에', '심곡동394-18', '삼호점', '끝까지', '예전', '지방 적당히만', '지방 어느정도', '대산꺼로만', '큰냉장고'];

  for (const raw of lines) {
    const l = raw.trim();
    if (!l) continue;
    if (['냉장', '냉동', '내일', '오늘'].includes(l)) continue;
    if (l.includes('심곡동394-18')) continue;
    if (skipWords.some(w => l.includes(w)) && !/\d/.test(l)) continue;

    const isPass = l.includes('패스') || l.includes('취소');
    const mBox = l.match(/(\d+(?:\.\d+)?)\s*(?:박스|빡스|박|box|Box|b\b)/);
    const mHalf = l.match(/반\s*박스/);
    const mPack = l.match(/(\d+(?:\.\d+)?)\s*(?:판|팩|펙|봉|봉지|덩이|덩어리|진공|벌)/);
    const mHanpan = l.match(/한\s*판/);
    const mMari = l.match(/(\d+)\s*마리/);
    const mKg = l.match(/(\d+(?:\.\d+)?)\s*(?:키로|kg|k\b)/i);
    const mBare = l.match(/[가-힣a-zA-Z]+\s*[ㅡ\-:\.]?\s*(\d+)(?:\.|\s|$|[가-힣])/);

    let beq = 0;
    if (isPass) beq = 0;
    else if (mBox) beq = parseFloat(mBox[1]);
    else if (mHalf) beq = 0.5;
    else if (mPack) beq = Math.round(parseFloat(mPack[1]) * 0.35 * 10) / 10;
    else if (mHanpan) beq = 0.4;
    else if (mMari) beq = Math.round((parseFloat(mMari[1]) / 15.0) * 10) / 10;
    else if (mKg) beq = Math.round((parseFloat(mKg[1]) / 15.0) * 10) / 10;
    else if (mBare && parseInt(mBare[1]) <= 40) beq = parseFloat(mBare[1]);
    else beq = 0.5;

    const tags = [];
    if (/냉동|테니쉬|두메코|올리멜|우삼겹|차돌/.test(l)) tags.push('❄️냉동/수입');
    if (/mm|센치|슬라이스|제육|대패|소분|습지|작업|3등분|까서/.test(l)) tags.push('🔪세절/작업');
    if (/행사|할인|써비스|서비스|반품/.test(l)) tags.push('⚠️특이사항');

    items.push({ text: l, boxEq: Math.round(beq * 10) / 10, isDelta, isPass, tags });
    boxSum += beq;
  }
  return { items, totalBoxEq: Math.round(boxSum * 10) / 10 };
}

function parseAndAnalyze() {
  const rawText = document.getElementById('kakaoInput').value.replace(/\u00A0/g, ' ').trim();
  if (!rawText) {
    alert('카카오톡 발주 대화 내용을 붙여넣거나 파일을 업로드해 주세요.');
    return;
  }

  const includeRetail = document.getElementById('chkIncludeRetail').checked;
  const lines = rawText.split(/\r?\n/);

  const reExport = /^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일\s*(오전|오후)\s*(\d{1,2}):(\d{2}),\s*([^:]+)\s*:\s*(.*)$/;
  const rePc = /^\[([^\]]+)\]\s*\[(오전|오후)\s*(\d{1,2}):(\d{2})\]\s*(.*)$/;

  const blocks = [];
  let curBlock = null;

  for (const rawLine of lines) {
    const line = rawLine.trim();
    if (!line) continue;
    if (line.includes('저장한 날짜 :') || line.includes('초대했습니다') || line.includes('메시지가 삭제되었습니다')) continue;
    if (/^-*\s*\d{4}년\s*\d{1,2}월\s*\d{1,2}일/.test(line)) continue;

    const m1 = line.match(reExport);
    const m2 = line.match(rePc);

    if (m1) {
      if (curBlock) blocks.push(curBlock);
      const ampm = m1[4];
      let hr = parseInt(m1[5]);
      const mn = parseInt(m1[6]);
      if (ampm === '오후' && hr !== 12) hr += 12;
      if (ampm === '오전' && hr === 12) hr = 0;
      curBlock = {
        timeStr: `${String(hr).padStart(2,'0')}:${String(mn).padStart(2,'0')}`,
        hr,
        sender: m1[7].trim(),
        lines: m1[8].trim() ? [m1[8].trim()] : []
      };
    } else if (m2) {
      if (curBlock) blocks.push(curBlock);
      const ampm = m2[2];
      let hr = parseInt(m2[3]);
      const mn = parseInt(m2[4]);
      if (ampm === '오후' && hr !== 12) hr += 12;
      if (ampm === '오전' && hr === 12) hr = 0;
      curBlock = {
        timeStr: `${String(hr).padStart(2,'0')}:${String(mn).padStart(2,'0')}`,
        hr,
        sender: m2[1].trim(),
        lines: m2[5].trim() ? [m2[5].trim()] : []
      };
    } else {
      if (!curBlock) {
        curBlock = { timeStr: "18:00", hr: 18, sender: "직접입력", lines: [line] };
      } else {
        curBlock.lines.push(line);
      }
    }
  }
  if (curBlock) blocks.push(curBlock);

  const orderMap = new Map();

  for (const b of blocks) {
    if (b.lines.length === 0) continue;
    const body = b.lines.join('\n').trim();
    if (['여기까지', '사진', '네'].includes(body) || body.startsWith('발주체크')) continue;

    const isWeightLog = /\d+\.\d+\s+\d+\.\d+/.test(body) || /\d{4}\s+\d{4}/.test(body);
    const found = findClientInLines(b.lines.slice(0, 3));
    if (!found) continue;

    const matchedClient = found.client;
    if (!includeRetail && matchedClient.name.startsWith('소매(')) continue;

    if (isWeightLog) {
      if (orderMap.has(matchedClient.name)) {
        orderMap.get(matchedClient.name).weightLogs.push(`[${b.timeStr} ${b.sender}] ${b.lines.slice(found.lineIdx + 1).join(' ')}`);
      }
      continue;
    }

    const isDelta = (b.hr >= 6 && b.hr <= 11) || body.includes('추가') || body.includes('정정');
    const isUrgent = body.includes('급급') || body.includes('오전중');

    const itemLines = b.lines.slice(found.lineIdx + 1);
    const parsed = parseOrderItemsFromLines(itemLines, isDelta);
    if (parsed.items.length === 0) continue;

    if (!orderMap.has(matchedClient.name)) {
      orderMap.set(matchedClient.name, {
        client: matchedClient,
        nickUsed: found.rawNick,
        vehicle: 1,
        items: [],
        totalBoxes: 0,
        hasDelta: isDelta,
        isUrgent,
        timestamps: [b.timeStr],
        weightLogs: []
      });
    }

    const entry = orderMap.get(matchedClient.name);
    entry.items.push(...parsed.items);
    entry.totalBoxes = Math.round((entry.totalBoxes + parsed.totalBoxEq) * 10) / 10;
    if (isDelta) entry.hasDelta = true;
    if (isUrgent) entry.isUrgent = true;
    if (!entry.timestamps.includes(b.timeStr)) entry.timestamps.push(b.timeStr);
  }

  parsedOrders = Array.from(orderMap.values());
  reclusterAndRender();
}

// ============================================================================
// 4. 일일 발주 기반 동적 5대 클러스터링 & TSP 최적 경로 엔진
// ============================================================================
function calcDistKm(lat1, lon1, lat2, lon2) {
  const R = 6371.0;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 1.35;
}

function estimateDriveMin(distKm) {
  if (distKm < 1.2) return Math.max(3, Math.round(distKm / 25 * 60));
  if (distKm < 12.0) return Math.max(5, Math.round(distKm / 30 * 60));
  return Math.max(12, Math.round(distKm / 45 * 60));
}

function calcTspTourKm(pts) {
  if (!pts || pts.length === 0) return 0;
  const unv = [...pts];
  let cx = 0, cy = 0, tot = 0;
  while (unv.length > 0) {
    unv.sort((a, b) => Math.hypot(a.x - cx, a.y - cy) - Math.hypot(b.x - cx, b.y - cy));
    const nxt = unv.shift();
    tot += Math.hypot(nxt.x - cx, nxt.y - cy) * 1.35;
    cx = nxt.x; cy = nxt.y;
  }
  tot += Math.hypot(cx, cy) * 1.35;
  return tot;
}

function runDynamic5Clustering() {
  if (parsedOrders.length === 0) return;
  const maxBoxLimit = parseFloat(document.getElementById('maxBoxLimit').value) || 58.0;

  const pts = parsedOrders.map((o, idx) => {
    const y = (o.client.lat - DEPOT.lat) * 111.0;
    const x = (o.client.lon - DEPOT.lon) * 88.8;
    const dist = Math.hypot(x, y);
    const deg = Math.atan2(y, x) * 180 / Math.PI;
    const sweep = (deg + 110.0 + 360.0) % 360.0;
    return { idx, order: o, x, y, dist, sweep, boxes: Math.max(0.5, o.totalBoxes) };
  });

  const localCore = pts.filter(p => p.dist <= 6.5).sort((a, b) => a.dist - b.dist);
  const outerRing = pts.filter(p => p.dist > 6.5);

  const v1 = [];
  let v1Boxes = 0;
  for (const p of localCore) {
    if (v1.length < 8 && v1Boxes + p.boxes <= 48.0) {
      v1.push(p);
      v1Boxes += p.boxes;
    } else {
      outerRing.push(p);
    }
  }
  outerRing.sort((a, b) => a.sweep - b.sweep);

  const N = outerRing.length;
  let clusters = [v1, [], [], [], []];

  if (N <= 4) {
    for (let i = 0; i < N; i++) clusters[i + 1] = [outerRing[i]];
  } else {
    const avgBoxes = outerRing.reduce((s, p) => s + p.boxes, 0) / 4.0;
    const avgStops = N / 4.0;

    function scoreCluster(sub) {
      if (!sub || sub.length === 0) return 1e6;
      const bSum = sub.reduce((s, p) => s + p.boxes, 0);
      const tourKm = calcTspTourKm(sub);
      const estMins = tourKm * 1.55 + sub.length * 10.0;
      const boxPen = Math.max(0, bSum - maxBoxLimit) * 45.0 + Math.abs(bSum - avgBoxes) * 0.85;
      const timePen = Math.abs(estMins - 190.0) * 0.75;
      const stopPen = Math.abs(sub.length - avgStops) * 7.5;
      return tourKm * 2.25 + boxPen + timePen + stopPen;
    }

    let bestTotal = 1e12;
    let bestCuts = [1, 2, 3];
    for (let i = 1; i < N - 2; i++) {
      const c1 = scoreCluster(outerRing.slice(0, i));
      if (c1 > bestTotal) continue;
      for (let j = i + 1; j < N - 1; j++) {
        const c2 = scoreCluster(outerRing.slice(i, j));
        if (c1 + c2 > bestTotal) continue;
        for (let k = j + 1; k < N; k++) {
          const c3 = scoreCluster(outerRing.slice(j, k));
          const c4 = scoreCluster(outerRing.slice(k));
          const tot = c1 + c2 + c3 + c4;
          if (tot < bestTotal) {
            bestTotal = tot;
            bestCuts = [i, j, k];
          }
        }
      }
    }
    const [i, j, k] = bestCuts;
    clusters = [v1, outerRing.slice(0, i), outerRing.slice(i, j), outerRing.slice(j, k), outerRing.slice(k)];

    for (let iter = 0; iter < 8; iter++) {
      let moved = false;
      for (let a = 0; a < 5; a++) {
        if (clusters[a].length <= 4) continue;
        for (const p of [...clusters[a]]) {
          for (let b = 0; b < 5; b++) {
            if (a === b) continue;
            const newA = clusters[a].filter(x => x.idx !== p.idx);
            const newB = [...clusters[b], p];
            if (scoreCluster(newA) + scoreCluster(newB) + 1.5 < scoreCluster(clusters[a]) + scoreCluster(clusters[b])) {
              clusters[a] = newA;
              clusters[b] = newB;
              moved = true;
              break;
            }
          }
          if (moved) break;
        }
        if (moved) break;
      }
      if (!moved) break;
    }
  }

  clusters.forEach((cList, idx) => {
    const vNum = idx + 1;
    cList.forEach(p => { p.order.vehicle = vNum; });
    const uniqRegs = [...new Set(cList.map(p => p.order.client.region.split('(')[0].trim()))];
    const regTitle = uniqRegs.slice(0, 4).join('·') + (uniqRegs.length > 4 ? ' 외' : '');
    dynamicVehicleTitles[vNum] = `${vNum}호차 [${regTitle || '대기'}]`;
  });

  optimizeRoutesWithinVehicles();
}

function optimizeRoutesWithinVehicles() {
  for (let v = 1; v <= 5; v++) {
    const group = parsedOrders.filter(o => o.vehicle === v);
    const unv = [...group];
    let curLat = DEPOT.lat, curLon = DEPOT.lon;
    let step = 1;
    while (unv.length > 0) {
      unv.sort((a, b) => {
        if (a.isUrgent !== b.isUrgent) return a.isUrgent ? -1 : 1;
        const aDaebu = a.client.region.includes('대부') ? 1 : 0;
        const bDaebu = b.client.region.includes('대부') ? 1 : 0;
        if (aDaebu !== bDaebu) return aDaebu - bDaebu;
        return calcDistKm(curLat, curLon, a.client.lat, a.client.lon) - calcDistKm(curLat, curLon, b.client.lat, b.client.lon);
      });
      const nxt = unv.shift();
      nxt.stopOrder = step++;
      curLat = nxt.client.lat;
      curLon = nxt.client.lon;
    }
  }
}

function reclusterAndRender() {
  runDynamic5Clustering();
  renderAll();
}

function addMinutesToTimeStr(timeStr, addMins) {
  const [hh, mm] = timeStr.split(':').map(Number);
  const total = hh * 60 + mm + addMins;
  const nh = Math.floor(total / 60) % 24;
  const nm = total % 60;
  return `${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`;
}

function setViewMode(mode) {
  currentViewMode = mode;
  ['route', 'lifo', 'items'].forEach(m => {
    const btn = document.getElementById('btnMode' + m.charAt(0).toUpperCase() + m.slice(1));
    btn.className = m === mode
      ? "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white transition"
      : "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition";
  });
  renderAll();
}

function selectVehicleTab(v) {
  selectedVehicleTab = v;
  renderAll();
}

function changeStoreVehicle(clientName, newVehicle) {
  const target = parsedOrders.find(o => o.client.name === clientName);
  if (target) {
    target.vehicle = parseInt(newVehicle);
    optimizeRoutesWithinVehicles();
    renderAll();
  }
}

function updateDepartureTime(v, newTime) {
  customDepartureTimes[v] = newTime;
  renderAll();
}

function copyVehicleSchedule(v) {
  const vOrders = parsedOrders.filter(o => o.vehicle === v).sort((a, b) => a.stopOrder - b.stopOrder);
  if (vOrders.length === 0) return;
  const vTotalBoxes = vOrders.reduce((s, o) => s + o.totalBoxes, 0);
  let txt = `📢 [${dynamicVehicleTitles[v]}] 금일 납품 및 상차 지시서\n`;
  txt += `- 미트포앤 출발: ${customDepartureTimes[v]}\n`;
  txt += `- 총 방문지: ${vOrders.length}곳 (약 ${vTotalBoxes.toFixed(1)}박스)\n\n`;
  txt += `📦 [역순 상차 순서 (안쪽 ➔ 문쪽)]\n`;
  [...vOrders].reverse().forEach((o, i) => {
    txt += `${i+1}순위(안쪽): ${o.client.name} (${o.totalBoxes}박)\n`;
  });
  txt += `\n🚚 [방문 일정 및 품목]\n`;
  vOrders.forEach(o => {
    txt += `${o.stopOrder}. ${o.client.name} (도착 ${o.etaArr}~${o.etaDep})\n`;
    txt += `   주소: ${o.client.addr}\n`;
    txt += `   품목: ${o.items.filter(i=>!i.isPass).map(i=>i.text).join(' / ')}\n`;
  });
  navigator.clipboard.writeText(txt).then(() => {
    alert(`${v}호차 일정표가 복사되었습니다! 카톡창에 붙여넣기(Ctrl+V) 하세요.`);
  });
}
