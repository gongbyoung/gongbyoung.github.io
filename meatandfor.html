<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미트포앤gemini</title>
    <style>
        :root { --primary: #1f4e79; --bg: #f4f7f6; --card: #ffffff; --text: #333; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); }
        .container { max-width: 100%; margin: 0 auto; background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; color: var(--primary); font-size: 20px; }
        p { color: #666; font-size: 13px; line-height: 1.4; }
        .upload-box { border: 2px dashed #b0c4de; padding: 20px; text-align: center; border-radius: 8px; background: #fafbfc; margin-bottom: 15px; cursor: pointer; }
        .upload-box input { display: none; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        button { background-color: var(--primary); color: white; border: none; padding: 10px 16px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; flex: 1; min-width: 140px; }
        button.toggle-btn { background-color: #d97706; }
        button.toggle-btn.active { background-color: #047857; }
        button.download { background-color: #2e7d32; }
        button:active { opacity: 0.8; }
        .stats { margin-bottom: 15px; font-weight: bold; color: #444; font-size: 14px; }
        .table-responsive { overflow-x: auto; max-height: 600px; border: 1px solid #ddd; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: left; vertical-align: top; }
        th { background-color: var(--primary); color: white; position: sticky; top: 0; z-index: 10; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f9fbfd; }
        .badge-order { background-color: #047857; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .badge-weight { background-color: #b45309; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .badge-other { background-color: #4b5563; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .client-name { font-weight: bold; color: #1f4e79; }
    </style>
</head>
<body>

<div class="container">
    <h2>🥩 미트포앤 통합 발주 분류기 v3 (PC/모바일 공용)</h2>
    <p>스마트폰 또는 컴퓨터에서 내보낸 카톡 대화(.txt)를 모두 지원합니다. 컬럼 순서 [날짜 ➔ 거래처명 ➔ 발주내용 ➔ 발신자/구분] 및 토글 필터가 적용되어 있습니다.</p>

    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <p>📁 <b>여기를 터치하여 카카오톡 대화 텍스트(.txt) 파일 선택</b></p>
        <input type="file" id="fileInput" accept=".txt" onchange="handleFileUpload(event)">
    </div>

    <div class="btn-group">
        <button id="toggleBtn" class="toggle-btn" onclick="toggleOrderFilter()" style="display:none;">🔍 순수 발주만 보기: OFF</button>
        <button id="downloadBtn" class="download" onclick="downloadCSV()" style="display:none;">📥 정제 목록 다운로드(CSV)</button>
    </div>
    
    <div id="stats" class="stats"></div>

    <div class="table-responsive">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>날짜</th>
                    <th>거래처명</th>
                    <th>발주 내용</th>
                    <th>발신자 / 구분</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="4" style="text-align: center; color: #888; padding: 20px;">대화 파일을 업로드해주세요.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
let allParsedData = [];
let onlyOrderMode = false;

function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        parseKakaoChat(e.target.result);
    };
    reader.readAsText(file, 'utf-8');
}

function parseKakaoChat(text) {
    const lines = text.split('\n');
    allParsedData = [];
    let currentDateStr = "10/13";
    
    // PC 버전 패턴: 2026년 10월 13일 오전 9:49, 이명석 이사 : 내용
    const pcPattern = /^(\d{4}년\s*\d{1,2}월\s*\d{1,2}일)\s+([오전|오후]+\s*\d{1,2}:\d{2}),\s*(.*?)\s*:\s*(.*)$/;
    // 모바일 버전 패턴: [발신자] [오후 2:35] 내용
    const mobilePattern = /^\[(.*?)\] \[(오전|오후 \d{1,2}:\d{2})\] (.*)$/;

    let currentItem = null;

    for (let i = 0; i < lines.length; i++) {
        let line = lines.trim();
        if (!line) continue;

        // 모바일 날짜 줄 감지 (예: --------------- 2026년 10월 17일 토요일 ---------------)
        if (line.includes('---------------') && line.includes('년')) {
            const dateMatch = line.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
            if (dateMatch) {
                currentDateStr = `${String(dateMatch).padStart(2, '0')}/${String(dateMatch).padStart(2, '0')}`;
            }
            continue;
        }

        let match = line.match(pcPattern);
        if (match) {
            if (currentItem) {
                finalizeItem(currentItem);
                allParsedData.push(currentItem);
            }
            const datePart = match;
            const timePart = match;
            const sender = match;
            const message = match;

            const dm = datePart.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
            if (dm) currentDateStr = `${String(dm).padStart(2, '0')}/${String(dm).padStart(2, '0')}`;

            currentItem = {
                dateRaw: currentDateStr,
                timeRaw: timePart,
                sender: sender.trim(),
                content: message,
                clientName: "-",
                type: "기타"
            };
            continue;
        }

        match = line.match(mobilePattern);
        if (match) {
            if (currentItem) {
                finalizeItem(currentItem);
                allParsedData.push(currentItem);
            }
            const sender = match;
            const timePart = match; 
            const message = match;

            currentItem = {
                dateRaw: currentDateStr,
                timeRaw: timePart,
                sender: sender.trim(),
                content: message,
                clientName: "-",
                type: "기타"
            };
        } else {
            if (currentItem && !line.includes('님과 카카오톡 대화') && !line.includes('---------------') && !line.includes('저장한 날짜')) {
                currentItem.content += "\n" + line;
            }
        }
    }
    if (currentItem) {
        finalizeItem(currentItem);
        allParsedData.push(currentItem);
    }

    renderTable();
    document.getElementById("toggleBtn").style.display = "inline-block";
    document.getElementById("downloadBtn").style.display = "inline-block";
}

// 시간 정제 (오후 2:35 -> 14:35)
function convertTime(timeStr) {
    if (!timeStr) return "00:00";
    let cleaned = timeStr.replace('오전', 'AM').replace('오후', 'PM').replace(/\s+/g, ' ');
    let parts = cleaned.split(' ');
    if (parts.length < 2) return timeStr;
    let meridiem = parts;
    let hm = parts.split(':');
    let h = parseInt(hm) || 0;
    let m = hm || "00";
    if (meridiem === 'PM' && h < 12) h += 12;
    if (meridiem === 'AM' && h === 12) h = 0;
    return `${String(h).padStart(2, '0')}:${m}`;
}

// 발주 vs 계근 지능형 판별
function finalizeItem(item) {
    let text = item.content;

    // 계근 판별 (소수점 무게나 3~4자리 숫자가 3개 이상 연속 나열)
    const numberTokens = text.match(/\b\d+\.\d+|\b\d{3,4}\b/g);
    let isWeighIn = false;
    if (numberTokens && numberTokens.length >= 3) {
        isWeighIn = true;
    }
    if ((text.includes("포 ") || text.includes("대 ") || text.includes("개 ")) && /\d+\.\d+/.test(text)) {
        isWeighIn = true;
    }

    const ignoreKeywords = ['사진', '삭제되었습니다', '재고현황', '발주체크', '분류전', '입금', '출고', '반품장', '공지', '투표', '장갑'];
    let hasIgnore = ignoreKeywords.some(kw => text.includes(kw));

    const meatKeywords = [
        '삼겹', '목살', '미전지', '전지', '미삼', '등갈비', '등뼈', '갈비', '등심', '안심', 
        '사태', '앞사태', '항정', '가브리', '갈매기', '미후지', '후지', '오겹', '우삼겹', 
        '차돌', '스지', 'LA', '살치', '부채', '토시', '안창', '족', '껍데기', '잡육', '박스', '팩', '판', '키로', 'kg', '덩이'
    ];
    let hasMeat = meatKeywords.some(kw => text.includes(kw));

    if (hasIgnore) {
        item.type = "기타";
    } else if (isWeighIn) {
        item.type = "계근";
    } else if (hasMeat) {
        item.type = "발주";
    } else {
        item.type = "기타";
    }

    // 거래처명 추출 (맨 앞 단어)
    let cleanedText = text.replace(/^[\[\(].*?[\]\)]\s*/, '').trim();
    let firstWord = cleanedText.split(/[\s\n\.\,\-\~]/);
    if (firstWord && firstWord.length > 1 && firstWord.length < 15) {
        item.clientName = firstWord;
    } else {
        item.clientName = "미확인거래처";
    }

    item.formattedTime = convertTime(item.timeRaw);
}

function toggleOrderFilter() {
    const btn = document.getElementById("toggleBtn");
    onlyOrderMode = !onlyOrderMode;
    if (onlyOrderMode) {
        btn.innerText = "🔍 순수 발주만 보기: ON (발주만 표시됨)";
        btn.classList.add("active");
    } else {
        btn.innerText = "🔍 순수 발주만 보기: OFF (전체 표시됨)";
        btn.classList.remove("active");
    }
    renderTable();
}

function renderTable() {
    const tbody = document.querySelector("#resultTable tbody");
    tbody.innerHTML = "";

    let displayList = allParsedData;
    if (onlyOrderMode) {
        displayList = allParsedData.filter(item => item.type === "발주");
    }

    if (displayList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red; padding: 20px;">표시할 내역이 없습니다.</td></tr>`;
        document.getElementById("stats").innerText = `표시된 항목: 0건`;
        return;
    }

    document.getElementById("stats").innerText = `📋 총 표시 항목: ${displayList.length}건 (전체 ${allParsedData.length}건 중)`;

    displayList.forEach(item => {
        let badgeHTML = `<span class="badge-other">기타</span>`;
        if (item.type === "발주") badgeHTML = `<span class="badge-order">발주</span>`;
        else if (item.type === "계근") badgeHTML = `<span class="badge-weight">계근</span>`;

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td style="white-space: nowrap;">${escapeHtml(item.dateRaw)}<br><small style="color:#666;">${escapeHtml(item.formattedTime)}</small></td>
            <td><span class="client-name">${escapeHtml(item.clientName)}</span></td>
            <td style="white-space: pre-line;">${escapeHtml(item.content)}</td>
            <td style="white-space: nowrap;">${escapeHtml(item.sender)}<br>${badgeHTML}</td>
        `;
        tbody.appendChild(tr);
    });
}

function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function downloadCSV() {
    let displayList = onlyOrderMode ? allParsedData.filter(item => item.type === "발주") : allParsedData;
    let csv = "\uFEFF날짜,시간,거래처명,발주내용,발신자,구분\n";
    displayList.forEach(o => {
        const cleanText = o.content.replace(/"/g, '""').replace(/\n/g, ' ');
        csv += `"${o.dateRaw}","${o.formattedTime}","${o.clientName}","${cleanText}","${o.sender}","${o.type}"\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "미트포앤_통합정제발주.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}
</script>

</body>
</html>
