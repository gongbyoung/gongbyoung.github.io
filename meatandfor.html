<script>

let parsedOrders = [];
let currentTab = 'destinations';

function openInputSection() {

  details.open = true;

function showToast(msg, isError = false) {
  const banner = document.getElementById('toastBanner');
  document.getElementById('toastMsg').innerText = msg;
  banner.className = `fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full shadow-xl font-bold text-xs flex items-center gap-2 transition-all ${isError ? 'bg-rose-600 text-white' : 'bg-indigo-600 text-white'}`;
  banner.classList.remove('hidden');
  setTimeout(() => banner.classList.add('hidden'), 3000);
}

const DEPOT = { lat: 37.305, lon: 126.855 };
function calcDistKm(lat1, lon1, lat2, lon2) {
  const R = 6371.0;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 1.35;
}

function getApproxGeo(addr) {
  if (addr.includes('대부')) return { region: '안산 대부', lat: 37.24, lon: 126.58 };
  if (addr.includes('단원구') || addr.includes('정왕') || addr.includes('배곧')) return { region: '안산/시흥 서부', lat: 37.33, lon: 126.75 };
  if (addr.includes('상록구') || addr.includes('매송')) return { region: '안산/화성 내륙', lat: 37.30, lon: 126.85 };
  if (addr.includes('서울')) return { region: '서울권', lat: 37.5, lon: 126.9 };
  if (addr.includes('인천')) return { region: '인천권', lat: 37.45, lon: 126.70 };
  if (addr.includes('부천') || addr.includes('광명')) return { region: '부천/광명', lat: 37.49, lon: 126.82 };
  if (addr.includes('수원') || addr.includes('동탄') || addr.includes('오산') || addr.includes('용인')) return { region: '경기 동남부', lat: 37.26, lon: 127.05 };
  return { region: '기타/지방', lat: 37.38, lon: 126.80 };
}

document.getElementById('csvFileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    CLIENT_DB = [];
    const lines = evt.target.result.split(/\r?\n/);
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',');
      if (cols.length >= 2 && cols[0].trim()) {
        const name = cols[0].trim();
        const addr = cols[1].trim();
        const customAlias = cols[2] ? cols[2].trim() : '';
        const baseClean = name.replace(/\([^\)]*\)/g, '').replace(/(주식회사|농업회사법인|\(주\))/g, '').trim();
        
        let aliases = [];
        if (customAlias) aliases.push(customAlias);
        if (baseClean && baseClean !== name && baseClean.length > 1) aliases.push(baseClean);
        
        const geo = getApproxGeo(addr);
        CLIENT_DB.push({ name, addr, aliases, region: geo.region, lat: geo.lat, lon: geo.lon });
      }
    }
    document.getElementById('dbStatusBadge').innerText = `${CLIENT_DB.length}곳 등록완료`;
    document.getElementById('dbStatusBadge').className = "text-emerald-400 font-bold";
    showToast(`✅ 주소록 ${CLIENT_DB.length}곳 로드 완료`);
  };
  reader.readAsText(file, 'utf-8');
});

function extractTargetTimeMessages(rawText) {
  const targetDateStr = document.getElementById('targetDate').value;
  const tDt = new Date(targetDateStr + "T00:00:00");
  const winStart = new Date(tDt.getFullYear(), tDt.getMonth(), tDt.getDate() - 1, 8, 0);
  const winEnd = new Date(tDt.getFullYear(), tDt.getMonth(), tDt.getDate(), 14, 0);

  let lines = rawText.split(/\r?\n/);
  let resultText = "";
  let currentExtractDate = tDt;

  const reMobileDot = /^\s*[·\.\-]?\s*(\d{1,2})[\/\.](\d{1,2})\.?\s+(오전|오후)\s+(\d{1,2}):(\d{2}),\s*([^:]+)\s*:\s*(.*)$/;
  const reExport = /^(\d{4})[년\.\-\/]\s*(\d{1,2})[월\.\-\/]\s*(\d{1,2})[일\.]?\s*(오전|오후)?\s*(\d{1,2}):(\d{2}),\s*([^:]+)\s*:\s*(.*)$/;
  const rePc = /^\[([^\]]+)\]\s*\[(오전|오후)?\s*(\d{1,2}):(\d{2})\]\s*(.*)$/;
  const reDateDiv = /^-*\s*(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/;

  let matchedAny = false;

  for (const rawLine of lines) {
    const line = rawLine.trim();
    if (!line || line.includes('저장한 날짜') || line.includes('카카오톡 대화')) continue;

    const mDateDiv = line.match(reDateDiv);
    if (mDateDiv) {
      currentExtractDate = new Date(parseInt(mDateDiv[1]), parseInt(mDateDiv[2]) - 1, parseInt(mDateDiv[3]));
      continue;
    }

    const mDot = line.match(reMobileDot);
    const mExp = line.match(reExport);
    const mPc = line.match(rePc);

    let dt = null;
    if (mDot) {
      let mo = parseInt(mDot[1]), dy = parseInt(mDot[2]), ampm = mDot[3];
      let hr = parseInt(mDot[4]), mn = parseInt(mDot[5]);
      if (ampm === '오후' && hr !== 12) hr += 12;
      if (ampm === '오전' && hr === 12) hr = 0;
      dt = new Date(tDt.getFullYear(), mo - 1, dy, hr, mn);
      if (dt > tDt && mo === 1 && tDt.getMonth() === 11) dt.setFullYear(tDt.getFullYear() + 1);
      else if (dt < tDt && mo === 12 && tDt.getMonth() === 0) dt.setFullYear(tDt.getFullYear() - 1);
    } else if (mExp) {
      let yr = parseInt(mExp[1]), mo = parseInt(mExp[2]), dy = parseInt(mExp[3]), ampm = mExp[4] || '';
      let hr = parseInt(mExp[5]), mn = parseInt(mExp[6]);
      if (ampm === '오후' && hr !== 12) hr += 12;
      if (ampm === '오전' && hr === 12) hr = 0;
      dt = new Date(yr, mo - 1, dy, hr, mn);
    } else if (mPc) {
      let ampm = mPc[2] || '', hr = parseInt(mPc[3]), mn = parseInt(mPc[4]);
      if (ampm === '오후' && hr !== 12) hr += 12;
      if (ampm === '오전' && hr === 12) hr = 0;
      dt = new Date(currentExtractDate.getFullYear(), currentExtractDate.getMonth(), currentExtractDate.getDate(), hr, mn);
      if (hr >= 14) dt = new Date(currentExtractDate.getFullYear(), currentExtractDate.getMonth(), currentExtractDate.getDate() - 1, hr, mn);
    }

    if (dt && dt >= winStart && dt <= winEnd) {
      matchedAny = true;
      resultText += line + "\n";
    }
  }

  if (!matchedAny || !resultText.trim()) {
    resultText = lines.slice(-400).join('\n');
  }

  return resultText;
}

document.getElementById('txtFileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

});

async function fetchWithRetry(url, options, maxRetries = 3) {
  for (let attempt = 1; attempt <= maxRetries; attempt++) {
    const response = await fetch(url, options);
    if (response.status === 503 && attempt < maxRetries) {
      await new Promise(r => setTimeout(r, 3000 * attempt));
      continue;
    }
    return response;
  }
}

async function runAiAnalysis() {
  const apiKey = document.getElementById('geminiApiKey').value.trim();
  if (!apiKey) {
    alert("⚠️ Google Gemini API 키를 먼저 입력해주세요.");
    return;
  }
  if (CLIENT_DB.length === 0) {
    alert("⚠️ 거래처 주소록(CSV)을 먼저 업로드해 주세요.");
    return;
  }

  const cleanText = document.getElementById('kakaoInput').value.trim();
  if (!cleanText) {
    alert("분석할 대화 내용이 없습니다. 파일을 업로드하거나 텍스트를 입력해 주세요.");
    return;
  }

  const btn = document.getElementById('btnRunAnalyze');
  const btnText = document.getElementById('btnRunText');
  btn.disabled = true;
  btn.classList.add('opacity-75');
  btnText.innerText = "⏳ 1단계: AI 모델 탐지 중...";

  try {
    const listUrl = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;
    const listRes = await fetch(listUrl);
    if (!listRes.ok) throw new Error("API 키 확인 또는 권한 오류입니다.");
    
    const listData = await listRes.json();
    const availableModels = listData.models
        .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"))
        .map(m => m.name.replace('models/', ''));
    
    let targetModel = "";
    const priorityModels = ["gemini-3.5-flash", "gemini-2.5-flash", "gemini-flash-latest", "gemini-3.5-pro", "gemini-2.5-pro", "gemini-1.5-flash"];
    
    for (const pm of priorityModels) {
      if (availableModels.includes(pm)) {
        targetModel = pm;
        break;
      }
    }
    
    if (!targetModel) targetModel = availableModels.find(m => m.includes("flash") && !m.includes("preview"));
    if (!targetModel && availableModels.length > 0) targetModel = availableModels[0];
    if (!targetModel) throw new Error("API 키 권한 오류: 텍스트 생성 모델이 목록에 없습니다.");
    
    btnText.innerText = `⏳ 2단계: 정제된 발주 데이터 분석 중...`;

    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${apiKey}`;

    const prompt = `
너는 육가공 도매업체 '미트포앤'의 카톡 발주 데이터를 정리하는 AI야.
아래 입력된 카카오톡 대화 내용에서 '실제 발주(주문)' 내역만 빠짐없이 추출해서 순수 JSON 배열로 반환해.

[발주 패턴 특징]
- 메시지는 주로 '한재호' 대표가 올리며, 발주 내용은 **대부분 거래처(상호명) 이름으로 시작**합니다.

[절대 주의사항 - 계근 기록 및 요약본 제외]
1. 현장 직원이 고기 무게를 잰 '계근 기록' (예: "암삼 21대 16.9 16.9", "19대 6.10")은 절대 발주가 아니니 무조건 버려! 숫자에 소수점(16.9)이 있거나 단위가 '대', '포', '개'이면 100% 버릴 것.
2. 메시지 첫 줄이 "발주체크"로 시작하는 전체 요약본은 이중 집계되므로 무조건 버려.

[수량 및 단위 추출 규칙]
- 단위는 '박스', '팩', '봉', 'kg', '마리', '판' 등으로 정확히 구분해.
- 만약 품목명 뒤에 숫자만 달랑 적혀있다면 (예: "삼겹 2"), 현장 관행상 '박스'로 간주해.
- "패스", "취소" 단어가 포함된 품목은 발주에서 제외해.

[출력 형식]
반드시 순수 JSON 배열 구조로만 대답해. 마크다운이나 다른 설명은 절대 금지.
[
  {
    "client_name": "상호명(거래처 이름 정확히 추출)",
    "original_text": "발주 원문 1줄",
    "category": "대표 품목 (예: 삼겹, 목살, 미전지, 등뼈 등)",
    "qty": 2.0,
    "unit": "박스",
    "is_special_unit": false,
    "is_delta": false
  }
]

[카카오톡 대화 내용]
${cleanText}
    `;
    
    const response = await fetchWithRetry(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { 
            temperature: 0.1,
            maxOutputTokens: 8192, 
            responseMimeType: "application/json" 
        } 
      })
    });

    if (!response || !response.ok) {
      const errText = response ? await response.text() : "네트워크 응답 없음";
      throw new Error(`[구글 서버 에러]\n서버가 혼잡합니다. 잠시 후 다시 시도해주세요.\n\n${errText}`);
    }

    const data = await response.json();
    let jsonStr = data.candidates[0].content.parts[0].text;
    
    let aiOrders = [];
    try {
        aiOrders = JSON.parse(jsonStr);
    } catch (parseError) {
        jsonStr = jsonStr.replace(/[\n\r\t]/g, ' '); 
        if (!jsonStr.trim().endsWith(']')) {
            const lastBrace = jsonStr.lastIndexOf('}');
            if (lastBrace !== -1) {
                jsonStr = jsonStr.substring(0, lastBrace + 1) + ']';
            } else {
                jsonStr += '}]';
            }
        }
        aiOrders = JSON.parse(jsonStr);
    }

    const orderMap = new Map();
    
    for (const item of aiOrders) {
      let matchedClient = null;
      let bestLen = 0;
      const cNoSpace = item.client_name.replace(/[●■☆★\[\]\(\)\.\,]/g, ' ').replace(/\s+/g, '');
      
      for (const c of CLIENT_DB) {
        for (const k of [c.name, ...c.aliases]) {
          const kNo = k.replace(/\s+/g, '');
          if (kNo.length >= 2 && cNoSpace.includes(kNo)) {
            if (kNo.length > bestLen) {
              bestLen = kNo.length;
              matchedClient = c;
            }
          }
        }
      }

      if (!matchedClient) continue; 

      if (!orderMap.has(matchedClient.name)) {
        orderMap.set(matchedClient.name, { 
            client: matchedClient, 
            distKm: calcDistKm(DEPOT.lat, DEPOT.lon, matchedClient.lat, matchedClient.lon), 
            items: [],
            isDelta: false
        });
      }

      const entry = orderMap.get(matchedClient.name);
      if (item.is_delta) entry.isDelta = true;
      
      entry.items.push({
        originalText: item.original_text,
        category: item.category,
        qty: parseFloat(item.qty),
        unit: item.unit,
        isSpecialUnit: item.is_special_unit,
        isDeltaItem: item.is_delta
      });
    }

    parsedOrders = Array.from(orderMap.values());
    
    if (parsedOrders.length > 0) {
      showToast(`✨ AI 분석 완료! ${parsedOrders.length}곳 추출 성공`);
      document.getElementById('inputDetails').open = false; 
    } else {
      showToast(`⚠️ AI 분석 결과 유효한 발주가 없습니다.`, true);
    }

    let specialUnitsCount = 0;
    let deltaCount = 0;
    let totalBoxes = 0;
    
    parsedOrders.forEach(o => {
      if (o.isDelta) deltaCount++;
      o.items.forEach(it => {
        if (it.unit.includes('박스')) totalBoxes += it.qty;
        else if (it.isSpecialUnit) {
          specialUnitsCount++;
          totalBoxes += (it.qty * 0.35); 
        }
      });
    });

    document.getElementById('kpiStores').innerText = parsedOrders.length;
    document.getElementById('kpiTotalBoxes').innerText = Math.round(totalBoxes*10)/10;
    document.getElementById('kpiDelta').innerText = deltaCount;
    document.getElementById('kpiSpecials').innerText = specialUnitsCount;

    setTab('destinations');

  } catch (err) {
    console.error(err);
    alert("오류 원인 상세:\n\n" + err.message);
  } finally {
    btn.disabled = false;
    btn.classList.remove('opacity-75');
    btnText.innerText = "🚀 AI 추출 및 집계 실행 (v2.015)";
  }
}

// 4. 모바일 스와이프 탭별 렌더링
// ==========================================================
function setTab(tabId) {
  currentTab = tabId;
  const tabs = ['destinations', 'items', 'specials'];
  tabs.forEach(t => {
    const btn = document.getElementById('tab_' + t);
    if (t === tabId) {
      btn.className = "flex-1 min-w-[100px] py-2.5 px-2 rounded-lg text-white font-bold transition-all shadow bg-indigo-500";
    } else {
      btn.className = "flex-1 min-w-[100px] py-2.5 px-2 rounded-lg text-slate-600 font-bold transition-all bg-slate-200 hover:bg-slate-300";
    }
  });

  const container = document.getElementById('outputContainer');

  if (tabId === 'destinations') {
    const sorted = [...parsedOrders].sort((a, b) => a.distKm - b.distKm);
    let html = `<div class="p-2">`;
    sorted.forEach((o, i) => {
      let bSum = o.items.filter(it => it.unit.includes('박스')).reduce((s,it) => s+it.qty, 0);
      let sSum = o.items.filter(it => it.isSpecialUnit).length;
      html += `
        <details class="bg-slate-50 border border-slate-200 rounded-xl mb-2.5 overflow-hidden group">
          <summary class="p-3 bg-white flex justify-between items-center active:bg-slate-50 border-b border-transparent group-open:border-slate-200 cursor-pointer">
            <div class="flex items-center gap-2.5 truncate">
              <span class="bg-indigo-100 text-indigo-700 font-extrabold w-6 h-6 flex items-center justify-center rounded-full text-[10px] flex-shrink-0">${i+1}</span>
              <div class="truncate">
                <div class="font-extrabold text-slate-900 text-sm flex items-center gap-1.5 truncate">
                  <span class="truncate">${o.client.name}</span>
                  ${o.isDelta ? '<span class="bg-rose-100 text-rose-600 px-1 py-0.5 rounded text-[8px] flex-shrink-0">추가/수정</span>' : ''}
                </div>
                <div class="text-[10px] text-slate-500 mt-0.5 truncate">${o.client.region} <span class="text-slate-300">|</span> 약 ${o.distKm.toFixed(1)}km</div>
              </div>
            </div>
            <div class="flex flex-col items-end gap-1 flex-shrink-0 ml-2">
              <span class="text-xs font-extrabold text-indigo-600">${bSum > 0 ? bSum+'박' : ''}${sSum > 0 ? ' +특수' : ''}</span>
              <span class="text-[9px] bg-slate-200 text-slate-500 px-1.5 py-0.5 rounded arrow inline-block">▼ 열기</span>
            </div>
          </summary>
          <div class="p-3 bg-slate-50 text-xs">
            <table class="w-full text-left">
              <tbody>
                ${o.items.map(it => `
                  <tr class="border-b border-slate-200/50 last:border-0">
                    <td class="py-2 text-slate-700">${it.originalText}</td>
                    <td class="py-2 text-right font-bold whitespace-nowrap ${it.isSpecialUnit ? 'text-rose-600' : 'text-indigo-600'}">${it.qty}<span class="text-[9px] font-normal ml-0.5">${it.unit}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </details>
      `;
    });
    html += `</div>`;
    container.innerHTML = html;
  }

  else if (tabId === 'items') {
    const catMap = {};
    parsedOrders.forEach(o => {
      o.items.forEach(it => {
        if (!catMap[it.category]) catMap[it.category] = [];
        catMap[it.category].push({ client: o.client.name, item: it });
      });
    });

    const sortedCats = Object.keys(catMap).sort((a, b) => {
      const cats = ['삼겹', '오겹', '목살', '특목살', '미전지', '전지', '미후지', '냉장3mm후지', '후지', '등뼈', '갈비', '등심', '항정', '가브리', '갈매기', '사태', '우삼겹', '차돌', '돈피', '장족', '모돈', '민찌', '살치', '홍두깨', '늑간'];
      const idxA = cats.indexOf(a); const idxB = cats.indexOf(b);
      return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
    });

    let html = `<div class="p-2 flex flex-col gap-2">`;
    sortedCats.forEach(cat => {
      const items = catMap[cat];
      const tBox = items.filter(x => x.item.unit.includes('박스')).reduce((s, x) => s + x.item.qty, 0);
      const tSpc = items.filter(x => x.item.isSpecialUnit).length;
      html += `
        <details class="bg-white border border-slate-300 rounded-xl shadow-sm group">
          <summary class="p-3 bg-slate-50 hover:bg-slate-100 flex justify-between items-center border-b border-transparent group-open:border-slate-300 cursor-pointer">
            <div class="font-extrabold text-slate-800 text-sm flex items-center gap-2">
              ${cat}
              ${tBox > 0 ? `<span class="bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded text-[10px] font-bold">${tBox}박</span>` : ''}
              ${tSpc > 0 ? `<span class="bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded text-[10px] font-bold">특수 ${tSpc}</span>` : ''}
            </div>
            <div class="text-slate-400 text-[10px] font-bold arrow">▼ 열기</div>
          </summary>
          <div class="p-1">
            <table class="w-full text-[11px] text-left">
              <tbody>
                ${items.map(x => `
                  <tr class="border-b border-slate-100 last:border-0 hover:bg-slate-50">
                    <td class="py-2 px-2 font-bold text-slate-700 w-[35%] truncate leading-tight">${x.client}</td>
                    <td class="py-2 px-1 text-slate-600 leading-tight">${x.item.originalText}</td>
                    <td class="py-2 px-2 text-right font-extrabold whitespace-nowrap ${x.item.isSpecialUnit ? 'text-rose-600' : 'text-slate-800'}">${x.item.qty}<span class="text-[9px] font-normal ml-0.5">${x.item.unit}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </details>
      `;
    });
    html += `</div>`;
    container.innerHTML = html;
  }

  else if (tabId === 'specials') {
    const specialItems = [];
    parsedOrders.forEach(o => {
      o.items.filter(it => it.isSpecialUnit).forEach(it => {
        specialItems.push({ client: o.client.name, item: it });
      });
    });

    let html = `
    <div class="p-2">
      <div class="bg-rose-50 border border-rose-200 rounded-xl overflow-hidden shadow-sm">
        <table class="w-full text-[11px] text-left">
          <thead class="bg-rose-100 text-rose-900 border-b border-rose-200">
            <tr>
              <th class="p-2 w-[40%] font-extrabold">거래처명</th>
              <th class="p-2 font-extrabold">품목/작업 지시 원문</th>
              <th class="p-2 w-[18%] text-right font-extrabold">수량</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-rose-100 bg-white">
            ${specialItems.length === 0 ? '<tr><td colspan="3" class="p-6 text-center text-slate-400">특수 단위 발주가 없습니다.</td></tr>' : ''}
            ${specialItems.map(x => `
              <tr class="active:bg-rose-50">
                <td class="p-2 font-bold text-slate-800 leading-tight">${x.client}</td>
                <td class="p-2 text-slate-600 leading-tight">${x.item.originalText}</td>
                <td class="p-2 text-right font-extrabold text-rose-600 whitespace-nowrap text-xs">${x.item.qty}<span class="text-[9px] font-normal ml-0.5">${x.item.unit}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
    container.innerHTML = html;
  }
}
