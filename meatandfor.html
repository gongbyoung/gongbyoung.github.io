<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미트포앤 스마트 발주·배차·상차 자동화 시스템</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tesseract.js (캡처 이미지 한국어 OCR 엔진) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    @media print {
      .no-print { display: none !important; }
      .print-full { width: 100% !important; max-width: 100% !important; }
    }
  </style>
</head>
<body class="text-slate-800">

  <!-- 상단 헤더 -->
  <header class="bg-slate-900 text-white shadow-md no-print">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="bg-amber-500 text-slate-950 font-extrabold px-2.5 py-1 rounded text-sm">MEAT FOR &</span>
        <h1 class="text-lg md:text-xl font-bold tracking-tight">미트포앤 카톡 발주 자동 분류 · 5대 권역 배차 · 역순 상차 시스템</h1>
      </div>
      <div class="flex items-center gap-2 text-xs md:text-sm">
        <label class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-1.5 rounded cursor-pointer transition flex items-center gap-1.5">
          <span>📂 거래처 주소록(CSV) 추가/갱신</span>
          <input type="file" id="csvFileInput" accept=".csv" class="hidden" />
        </label>
        <button onclick="loadSampleOct20()" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded font-semibold transition">
          🧪 10월 20일 실제 카톡 데이터 샘플 불러오기
        </button>
        <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded font-semibold transition">
          🖨️ 작업지시서 인쇄
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 레이아웃 -->
  <main class="max-w-[1600px] mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-4">

    <!-- 좌측 패널: 카톡 입력 (텍스트 / 파일 / 캡처 이미지 OCR) -->
    <section class="lg:col-span-4 bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col gap-3 no-print">
      <div class="flex items-center justify-between border-b pb-2">
        <h2 class="font-bold text-base flex items-center gap-1.5">
          <span>💬 1단계: 카카오톡 발주 데이터 입력</span>
        </h2>
        <span id="dbCountBadge" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-medium">내장 거래처 115곳</span>
      </div>

      <!-- 날짜 및 시간 필터 설정 -->
      <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 grid grid-cols-2 gap-2 text-xs">
        <div>
          <label class="font-semibold text-slate-600 block mb-1">📅 납품(출고) 기준일</label>
          <input type="date" id="targetDate" value="2026-10-20" class="w-full border border-slate-300 rounded px-2 py-1.5 font-semibold text-slate-800" />
        </div>
        <div>
          <label class="font-semibold text-slate-600 block mb-1">⏱️ 날짜 필터 모드</label>
          <select id="dateFilterMode" class="w-full border border-slate-300 rounded px-2 py-1.5 font-medium text-slate-800">
            <option value="auto" selected>전날 13시 ~ 당일 11시 (자동)</option>
            <option value="all">입력된 텍스트 전체 분석 (캡처용)</option>
          </select>
        </div>
      </div>

      <!-- 멀티 업로드 존 (.txt 파일 + 캡처 이미지 OCR) -->
      <div class="grid grid-cols-2 gap-2">
        <!-- 카톡 .txt 파일 업로드 -->
        <label class="border-2 border-dashed border-amber-400 bg-amber-50/50 hover:bg-amber-50 rounded-lg p-3 text-center cursor-pointer transition flex flex-col items-center justify-center gap-1">
          <span class="text-xl">📄</span>
          <span class="text-xs font-bold text-amber-900">카톡 내보내기 (.txt) 업로드</span>
          <span class="text-[11px] text-amber-700">클릭 또는 파일 드래그</span>
          <input type="file" id="txtFileInput" accept=".txt" class="hidden" />
        </label>

        <!-- 카톡 캡처 이미지 업로드 (OCR) -->
        <label class="border-2 border-dashed border-blue-400 bg-blue-50/50 hover:bg-blue-50 rounded-lg p-3 text-center cursor-pointer transition flex flex-col items-center justify-center gap-1">
          <span class="text-xl">📸</span>
          <span class="text-xs font-bold text-blue-900">카톡 캡처 이미지 업로드</span>
          <span class="text-[11px] text-blue-700">여러 장 선택 또는 화면에 Ctrl+V</span>
          <input type="file" id="imgFileInput" accept="image/*" multiple class="hidden" />
        </label>
      </div>

      <!-- OCR 진행 상태 표시줄 -->
      <div id="ocrStatusBox" class="hidden bg-blue-50 border border-blue-200 rounded-lg p-2.5 text-xs text-blue-900">
        <div class="flex justify-between font-bold mb-1">
          <span id="ocrStatusText">📸 캡처 이미지에서 글자 읽는 중...</span>
          <span id="ocrProgressPct">0%</span>
        </div>
        <div class="w-full bg-blue-200 h-2 rounded-full overflow-hidden">
          <div id="ocrProgressBar" class="bg-blue-600 h-full transition-all duration-200" style="width: 0%"></div>
        </div>
      </div>

      <!-- 텍스트 직접 붙여넣기 영역 -->
      <div class="flex-1 flex flex-col">
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-semibold text-slate-600">✍️ 카카오톡 대화 텍스트 (직접 붙여넣기 / 수정 가능)</label>
          <button onclick="clearInput()" class="text-xs text-rose-600 hover:underline font-medium">비우기</button>
        </div>
        <textarea id="kakaoInput" rows="14" placeholder="여기에 카카오톡 대화 내용을 붙여넣거나(Ctrl+V), 위 버튼으로 카톡 내보내기(.txt) 파일 또는 캡처 이미지를 업로드하세요.&#10;&#10;[예시 형식]&#10;2026년 10월 19일 오후 6:10, 한재호 대표 : 한돈미트&#10;삼겹2.&#10;미삼2.&#10;목살3&#10;&#10;또는 날짜 없이 캡처된 텍스트:&#10;성대g마트&#10;삼겹살 4 박스&#10;갈비 6 박스" class="w-full flex-1 border border-slate-300 rounded-lg p-2.5 text-xs font-mono leading-relaxed focus:ring-2 focus:ring-indigo-500 focus:outline-none custom-scroll"></textarea>
      </div>

      <!-- 실행 버튼 -->
      <button onclick="parseAndAnalyze()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow transition flex items-center justify-center gap-2 text-sm">
        <span>🚀 발주 물품 자동 분류 & 차량 5대 배차 실행</span>
      </button>
    </section>

    <!-- 우측 패널: 분석 결과, 피킹/상차 보드, ETA 스케줄러 -->
    <section class="lg:col-span-8 flex flex-col gap-4 print-full">

      <!-- 상단 요약 KPI 카드 -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200">
          <div class="text-xs text-slate-500 font-medium">총 납품 거래처</div>
          <div class="text-2xl font-extrabold text-slate-900 mt-0.5"><span id="kpiTotalStores">0</span><span class="text-sm font-normal text-slate-500 ml-1">곳</span></div>
          <div id="kpiWaveSplit" class="text-[11px] text-slate-500 mt-1">1차(전날): 0곳 / 2차(아침): 0곳</div>
        </div>
        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200">
          <div class="text-xs text-slate-500 font-medium">총 환산 물량 (박스)</div>
          <div class="text-2xl font-extrabold text-indigo-600 mt-0.5"><span id="kpiTotalBoxes">0.0</span><span class="text-sm font-normal text-slate-500 ml-1">박스</span></div>
          <div id="kpiBoxSplit" class="text-[11px] text-slate-500 mt-1">1차: 0박 / 2차(추가): 0박</div>
        </div>
        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200">
          <div class="text-xs text-slate-500 font-medium">⚡ 아침 추가·변경(Delta)</div>
          <div class="text-2xl font-extrabold text-rose-600 mt-0.5"><span id="kpiMorningAdds">0</span><span class="text-sm font-normal text-slate-500 ml-1">건</span></div>
          <div class="text-[11px] text-rose-600 font-medium mt-1">07:00 이후 유입 및 ●추가 건</div>
        </div>
        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200">
          <div class="text-xs text-slate-500 font-medium">11시 전 출발 가능 여부</div>
          <div id="kpiDepartureStatus" class="text-lg font-extrabold text-emerald-600 mt-1">대기 중</div>
          <div id="kpiLatestReturn" class="text-[11px] text-slate-500 mt-1">정차시간 지점당 10분 기준</div>
        </div>
      </div>

      <!-- 컨트롤 바: 모드 전환 (피킹/배차 vs 역순 상차 vs 카톡 공유) & 필터 -->
      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-2 no-print">
        <div class="flex flex-wrap items-center gap-1.5">
          <button onclick="setViewMode('route')" id="btnModeRoute" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white transition">
            🚚 1. 배송 방문순 (1번➔끝번)
          </button>
          <button onclick="setViewMode('lifo')" id="btnModeLifo" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
            📦 2. 차량 역순 상차 지시서 (안쪽➔문쪽)
          </button>
          <button onclick="setViewMode('items')" id="btnModeItems" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
            🥩 3. 품목별 총 피킹 합산표
          </button>
        </div>

        <div class="flex items-center gap-3">
          <label class="flex items-center gap-1.5 text-xs font-bold text-rose-600 cursor-pointer bg-rose-50 border border-rose-200 px-2.5 py-1.5 rounded-lg">
            <input type="checkbox" id="chkDeltaOnly" onchange="renderAll()" class="rounded text-rose-600 focus:ring-rose-500" />
            <span>⚡ 아침 추가/변경분(2차)만 보기</span>
          </label>
          <div class="flex items-center gap-1 text-xs">
            <span class="font-semibold text-slate-600">정차(하차):</span>
            <input type="number" id="dwellMinutes" value="10" min="3" max="60" onchange="renderAll()" class="w-12 border border-slate-300 rounded px-1.5 py-1 text-center font-bold" />
            <span class="text-slate-500">분/곳</span>
          </div>
        </div>
      </div>

      <!-- 차량 탭 선택 바 -->
      <div class="flex overflow-x-auto gap-2 no-print" id="vehicleTabs"></div>

      <!-- 메인 결과 보드 -->
      <div id="resultContainer" class="flex flex-col gap-4"></div>

    </section>
  </main>

document.getElementById('txtFileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    document.getElementById('kakaoInput').value = evt.target.result;
    parseAndAnalyze();
  };
  reader.readAsText(file, 'utf-8');
});

document.getElementById('csvFileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const lines = evt.target.result.split(/\r?\n/);
    let added = 0;
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',');
      if (cols.length >= 2 && cols[0].trim()) {
        const name = cols[0].trim();
        const addr = cols[1].trim();
        const alias = cols[2] ? cols[2].trim() : '';
        if (!CLIENT_DB.some(c => c.name === name)) {
          const zInfo = autoClassifyAddress(name, addr);
          CLIENT_DB.push({
            name,
            aliases: alias ? [alias, name] : [name],
            addr,
            zone: zInfo.zone,
            region: zInfo.region,
            lat: zInfo.lat,
            lon: zInfo.lon
          });
          added++;
        }
      }
    }
    document.getElementById('dbCountBadge').innerText = `내장 거래처 ${CLIENT_DB.length}곳 (+${added}갱신)`;
    alert(`최근거래처 CSV에서 신규 거래처 ${added}곳을 추가 연동했습니다.`);
    if (document.getElementById('kakaoInput').value.trim()) parseAndAnalyze();
  };
  reader.readAsText(file, 'utf-8');
});

// 캡처 이미지 OCR 처리 함수
async function runOcrOnImages(files) {
  if (!files || files.length === 0) return;
  const statusBox = document.getElementById('ocrStatusBox');
  const statusText = document.getElementById('ocrStatusText');
  const pctText = document.getElementById('ocrProgressPct');
  const bar = document.getElementById('ocrProgressBar');
  statusBox.classList.remove('hidden');

  let combinedText = document.getElementById('kakaoInput').value;
  if (combinedText && !combinedText.endsWith('\n')) combinedText += '\n\n';

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    statusText.innerText = `📸 캡처 이미지 인식 중 (${i + 1}/${files.length}): ${file.name || '클립보드 이미지'}`;
    const result = await Tesseract.recognize(file, 'kor+eng', {
      logger: m => {
        if (m.status === 'recognizing text') {
          const p = Math.round(m.progress * 100);
          pctText.innerText = `${p}%`;
          bar.style.width = `${p}%`;
        }
      }
    });
    combinedText += `\n[캡처이미지_${i + 1}]\n` + result.data.text.trim() + '\n';
  }

  document.getElementById('kakaoInput').value = combinedText.trim();
  // 캡처 이미지는 날짜 헤더가 잘려 있을 수 있으므로 전체 분석 모드로 자동 전환 제안
  document.getElementById('dateFilterMode').value = 'all';
  statusText.innerText = `✅ 캡처 이미지 ${files.length}장 텍스트 추출 완료!`;
  setTimeout(() => statusBox.classList.add('hidden'), 2500);
  parseAndAnalyze();
}

document.getElementById('imgFileInput').addEventListener('change', function(e) {
  runOcrOnImages(e.target.files);
});

// 화면 어디서나 Ctrl+V로 캡처 이미지를 붙여넣으면 자동 OCR 동작
window.addEventListener('paste', function(e) {
  if (!e.clipboardData) return;
  const items = e.clipboardData.items;
  const imgFiles = [];
  for (let i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') !== -1) {
      imgFiles.push(items[i].getAsFile());
    }
  }
  if (imgFiles.length > 0) {
    e.preventDefault();
    runOcrOnImages(imgFiles);
  }
});

// 주소 기반 자동 권역 분류기 (신규 거래처용)
function autoClassifyAddress(name, addr) {
  if (addr.includes('대부') || name.includes('대부')) return { zone: 2, region: '안산 대부도', lat: 37.243, lon: 126.582 };
  if (addr.includes('안산시 상록구') || addr.includes('매송') || addr.includes('비봉')) return { zone: 1, region: '안산 상록/매송', lat: 37.298, lon: 126.860 };
  if (addr.includes('안산시 단원구')) return { zone: 2, region: '안산 단원', lat: 37.330, lon: 126.812 };
  if (addr.includes('정왕') || addr.includes('배곧') || addr.includes('거모')) return { zone: 2, region: '시흥 남부', lat: 37.347, lon: 126.755 };
  if (addr.includes('시흥') || addr.includes('인천') || addr.includes('부천') || addr.includes('고양')) return { zone: 3, region: '시흥/인천/부천', lat: 37.450, lon: 126.765 };
  if (addr.includes('광명') || addr.includes('서울') || addr.includes('구리')) return { zone: 4, region: '광명/서울권', lat: 37.485, lon: 126.905 };
  return { zone: 5, region: '군포/분당/용인/수원', lat: 37.310, lon: 127.040 };
}

// ============================================================================
// 3. 카카오톡 대화 파싱 & 거래처 매칭 & 물량(박스) 환산 엔진
// ============================================================================
function matchClientFromText(firstLine, fullBody) {
  const cleanFirst = firstLine.replace(/[●■☆★\[\]\(\)]/g, ' ').replace(/(추가|더추가|정정|오늘|내일|오후에|급급)/g, '').trim();
  if (!cleanFirst) return null;

  // 1순위: 별명(aliases) 및 정식명칭 완전/전방 일치 검색
  let bestMatch = null;
  let longestKey = 0;

  for (const client of CLIENT_DB) {
    const candidates = [client.name, ...client.aliases];
    for (const cand of candidates) {
      const cleanCand = cand.replace(/\s+/g, '');
      const cleanLineNoSpace = cleanFirst.replace(/\s+/g, '');
      if (cleanCand.length >= 2 && cleanLineNoSpace.includes(cleanCand)) {
        if (cleanCand.length > longestKey) {
          longestKey = cleanCand.length;
          bestMatch = client;
        }
      }
    }
  }
  return bestMatch;
}

// 품목 줄에서 박스 환산 수량 및 냉동/세절 태그 추출
function parseOrderItems(lines, isMorningWave) {
  const items = [];
  let totalBoxEq = 0;
  const ignoreKeywords = ['안녕하십니까', '안녕하세요', '부탁드립니다', '부탁드려요', '감사합니다', '이상입니다', '보내주세요', '주세여', '주세요', '발주입니다', '발주드리려고', '문자드립니다', '여기까지', '고생했어'];

  for (let rawLine of lines) {
    let line = rawLine.trim();
    if (!line) continue;
    if (ignoreKeywords.some(k => line.includes(k) && line.length < 18)) continue;
    if (/^(냉장|냉동)$/.test(line)) continue;

    // 패스/취소 감지
    const isPass = line.includes('패스') || line.includes('취소');

    // 수량 파싱 (박스/빡스/박/b/Box vs 판/팩/봉/덩이/벌/마리/키로/k)
    let boxEq = 0;
    const boxMatch = line.match(/(\d+(?:\.\d+)?)\s*(?:박스|빡스|박|box|Box|b\b)/);
    const packMatch = line.match(/(\d+(?:\.\d+)?)\s*(?:판|팩|펙|봉|봉지|덩이|덩어리)/);
    const kgMatch = line.match(/(\d+(?:\.\d+)?)\s*(?:키로|kg|k\b)/i);
    const bareNumMatch = line.match(/[가-힣a-zA-Z]+\s*[ㅡ\-:\.]?\s*(\d+)\s*(?:포크|대산|정담|재고|큰거|작은거|$)/);

    if (isPass) {
      boxEq = 0;
    } else if (boxMatch) {
      boxEq = parseFloat(boxMatch[1]);
    } else if (packMatch) {
      boxEq = Math.round(parseFloat(packMatch[1]) * 0.35 * 10) / 10;
    } else if (kgMatch) {
      boxEq = Math.round((parseFloat(kgMatch[1]) / 15) * 10) / 10;
    } else if (bareNumMatch && parseInt(bareNumMatch[1]) <= 50) {
      boxEq = parseFloat(bareNumMatch[1]);
    } else if (/\d+/.test(line)) {
      boxEq = 0.5;
    } else {
      continue;
    }

    // 작업 태그 감지
    const tags = [];
    if (line.includes('냉동') || line.includes('테니쉬') || line.includes('두메코') || line.includes('올리멜') || line.includes('우삼겹') || line.includes('차돌')) tags.push('❄️냉동/수입');
    if (line.includes('mm') || line.includes('센치') || line.includes('슬라이스') || line.includes('제육') || line.includes('대패') || line.includes('소분') || line.includes('습지') || line.includes('작업')) tags.push('🔪세절/작업');
    if (line.includes('행사') || line.includes('할인') || line.includes('써비스') || line.includes('서비스') || line.includes('반품')) tags.push('⚠️특이사항');
    if (isPass) tags.push('🚫패스');

    totalBoxEq += boxEq;
    items.push({
      text: line,
      boxEq: Math.round(boxEq * 10) / 10,
      isMorning: isMorningWave,
      isPass,
      tags
    });
  }

  return { items, totalBoxEq: Math.round(totalBoxEq * 10) / 10 };
}

function parseAndAnalyze() {
  const rawText = document.getElementById('kakaoInput').value.trim();
  if (!rawText) {
    alert('카카오톡 대화 텍스트를 입력하거나 파일을 업로드해 주세요.');
    return;
  }

  const targetDateStr = document.getElementById('targetDate').value; // YYYY-MM-DD
  const filterMode = document.getElementById('dateFilterMode').value;
  const targetDt = new Date(targetDateStr + 'T00:00:00');
  const prevDt = new Date(targetDt.getTime() - 24 * 60 * 60 * 1000);

  const lines = rawText.split(/\r?\n/);
  const msgRegex = /^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일\s*(오전|오후)\s*(\d{1,2}):(\d{2}),\s*([^:]+)\s*:\s*(.*)$/;

  // 1. 메시지 블록 분리 (카톡 정식 내보내기 포맷 vs 일반 캡처/복붙 텍스트 모두 호환)
  const messages = [];
  let currentMsg = null;
  let hasKakaoTimestamps = false;

  for (const line of lines) {
    const m = line.match(msgRegex);
    if (m) {
      hasKakaoTimestamps = true;
      if (currentMsg) messages.push(currentMsg);
      const yr = parseInt(m[1]), mo = parseInt(m[2]), dy = parseInt(m[3]);
      const ampm = m[4];
      let hr = parseInt(m[5]);
      const mn = parseInt(m[6]);
      if (ampm === '오후' && hr !== 12) hr += 12;
      if (ampm === '오전' && hr === 12) hr = 0;

      const msgDate = new Date(yr, mo - 1, dy, hr, mn);
      currentMsg = {
        dt: msgDate,
        dateStr: `${yr}-${String(mo).padStart(2,'0')}-${String(dy).padStart(2,'0')}`,
        timeStr: `${String(hr).padStart(2,'0')}:${String(mn).padStart(2,'0')}`,
        hr,
        sender: m[7].trim(),
        lines: [m[8].trim()]
      };
    } else {
      if (/^\d{4}년\s*\d{1,2}월\s*\d{1,2}일\s*(오전|오후)/.test(line)) continue;
      if (line.includes('저장한 날짜 :') || line.includes('초대했습니다') || line.includes('메시지가 삭제되었습니다')) continue;
      if (currentMsg) {
        currentMsg.lines.push(line);
      } else {
        // 타임스탬프가 없는 일반 복붙/OCR 텍스트 블록 처리
        currentMsg = {
          dt: targetDt,
          dateStr: targetDateStr,
          timeStr: '08:00',
          hr: 8,
          sender: '수동/캡처입력',
          lines: [line]
        };
      }
    }
  }
  if (currentMsg) messages.push(currentMsg);

  // 타임스탬프 없는 복붙 텍스트일 경우 빈 줄 기준으로 업체 블록 분할
  let finalBlocks = [];
  if (!hasKakaoTimestamps && messages.length === 1) {
    let tempLines = [];
    for (const l of messages[0].lines) {
      if (!l.trim()) {
        if (tempLines.length > 0) {
          finalBlocks.push({ ...messages[0], lines: tempLines });
          tempLines = [];
        }
      } else {
        tempLines.push(l);
      }
    }
    if (tempLines.length > 0) finalBlocks.push({ ...messages[0], lines: tempLines });
  } else {
    finalBlocks = messages;
  }

  // 2. 날짜 범위 필터링 (전날 13:00 ~ 당일 11:30)
  const startWindow = new Date(prevDt.getFullYear(), prevDt.getMonth(), prevDt.getDate(), 13, 0);
  const endWindow = new Date(targetDt.getFullYear(), targetDt.getMonth(), targetDt.getDate(), 11, 30);

  const orderMap = new Map(); // key: client.name

  for (const msg of finalBlocks) {
    if (hasKakaoTimestamps && filterMode === 'auto') {
      if (msg.dt < startWindow || msg.dt > endWindow) continue;
    }

    const bodyText = msg.lines.join('\n').trim();
    if (!bodyText || bodyText === '사진' || bodyText === '네' || bodyText.startsWith('발주체크')) continue;

    // 계근/바코드 숫자 나열 메시지인지 판별 (예: 1650 1684 1732 또는 14대 9.80 10.9)
    const isWeightLog = /\d+\.\d+\s+\d+\.\d+/.test(bodyText) || /\d{4}\s+\d{4}/.test(bodyText);

    const firstLine = msg.lines[0] || '';
    const matchedClient = matchClientFromText(firstLine, bodyText);
    if (!matchedClient) continue;

    // 당일 아침(06:00~11:30) 유입이거나 '추가/정정' 키워드가 있으면 2차(Morning Delta)로 분류
    const isMorningWave = (msg.dateStr === targetDateStr && msg.hr >= 6) || bodyText.includes('추가') || bodyText.includes('정정');
    const isUrgent = bodyText.includes('급급') || bodyText.includes('오전중') || bodyText.includes('지금');

    if (isWeightLog) {
      // 이미 등록된 발주처의 계근 완료 메모로 첨부
      if (orderMap.has(matchedClient.name)) {
        orderMap.get(matchedClient.name).weightLogs.push(`[${msg.timeStr} ${msg.sender}] ${msg.lines.slice(1).join(' ')}`);
      }
      continue;
    }

    const parsed = parseOrderItems(msg.lines.slice(1), isMorningWave);
    if (parsed.items.length === 0) continue;

    if (!orderMap.has(matchedClient.name)) {
      orderMap.set(matchedClient.name, {
        client: matchedClient,
        nickUsed: firstLine.replace(/[●■☆★]/g, '').trim(),
        vehicle: matchedClient.zone,
        items: [],
        wave1Boxes: 0,
        wave2Boxes: 0,
        totalBoxes: 0,
        hasMorningAdd: isMorningWave,
        isUrgent: isUrgent,
        timestamps: [`${msg.dateStr.slice(5)} ${msg.timeStr}`],
        weightLogs: []
      });
    }

    const entry = orderMap.get(matchedClient.name);
    entry.items.push(...parsed.items);
    if (isMorningWave) {
      entry.wave2Boxes = Math.round((entry.wave2Boxes + parsed.totalBoxEq) * 10) / 10;
      entry.hasMorningAdd = true;
    } else {
      entry.wave1Boxes = Math.round((entry.wave1Boxes + parsed.totalBoxEq) * 10) / 10;
    }
    entry.totalBoxes = Math.round((entry.wave1Boxes + entry.wave2Boxes) * 10) / 10;
    if (isUrgent) entry.isUrgent = true;
    const tsLabel = `${msg.dateStr.slice(5)} ${msg.timeStr}`;
    if (!entry.timestamps.includes(tsLabel)) entry.timestamps.push(tsLabel);
  }

  parsedOrders = Array.from(orderMap.values());
  optimizeAllRoutes();
  renderAll();
}

// ============================================================================
// 4. 거리 계산 (Haversine) & 차량별 최적 방문 순서(Nearest Neighbor TSP) 정렬
// ============================================================================
function calcDistKm(lat1, lon1, lat2, lon2) {
  const R = 6371.0;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 1.35; // 도로 굴곡 계수 1.35 반영
}

function estimateDriveMin(distKm) {
  if (distKm < 1.2) return Math.max(3, Math.round(distKm / 25 * 60));
  if (distKm < 12.0) return Math.max(5, Math.round(distKm / 30 * 60));
  return Math.max(12, Math.round(distKm / 45 * 60));
}

function optimizeAllRoutes() {
  for (let v = 1; v <= 5; v++) {
    const group = parsedOrders.filter(o => o.vehicle === v);
    const unvisited = [...group];
    const ordered = [];
    let curLat = DEPOT.lat, curLon = DEPOT.lon;

    while (unvisited.length > 0) {
      // 급급(isUrgent) 거래처 우선, 그 외에는 현재 위치에서 가장 가까운 거래처 선택 (대부도는 맨 마지막 방문 유도)
      unvisited.sort((a, b) => {
        if (a.isUrgent !== b.isUrgent) return a.isUrgent ? -1 : 1;
        const aDaebu = a.client.region.includes('대부') ? 1 : 0;
        const bDaebu = b.client.region.includes('대부') ? 1 : 0;
        if (aDaebu !== bDaebu) return aDaebu - bDaebu;
        const dA = calcDistKm(curLat, curLon, a.client.lat, a.client.lon);
        const dB = calcDistKm(curLat, curLon, b.client.lat, b.client.lon);
        return dA - dB;
      });
      const nextStop = unvisited.shift();
      ordered.push(nextStop);
      curLat = nextStop.client.lat;
      curLon = nextStop.client.lon;
    }

    ordered.forEach((o, idx) => { o.stopOrder = idx + 1; });
  }
}

function addMinutesToTimeStr(timeStr, addMins) {
  const [hh, mm] = timeStr.split(':').map(Number);
  const total = hh * 60 + mm + addMins;
  const nh = Math.floor(total / 60) % 24;
  const nm = total % 60;
  return `${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`;
}

// ============================================================================
function setViewMode(mode) {
  currentViewMode = mode;
  ['route', 'lifo', 'items'].forEach(m => {
    const btn = document.getElementById('btnMode' + m.charAt(0).toUpperCase() + m.slice(1));
    if (m === mode) {
      btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white transition";
    } else {
      btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition";
    }
  });
  renderAll();
}

function selectVehicleTab(v) {
  selectedVehicleTab = v;
  renderAll();
}

function changeStoreVehicle(clientName, newVehicle) {
  const target = parsedOrders.find(o => o.client.name === clientName);
  if (target) {
    target.vehicle = parseInt(newVehicle);
    optimizeAllRoutes();
    renderAll();
  }
}

function updateDepartureTime(v, newTime) {
  customDepartureTimes[v] = newTime;
  renderAll();
}

function renderAll() {
  const deltaOnly = document.getElementById('chkDeltaOnly').checked;
  const dwellMin = parseInt(document.getElementById('dwellMinutes').value) || 10;

  // KPI 업데이트
  const totalStores = parsedOrders.length;
  const w1Stores = parsedOrders.filter(o => !o.hasMorningAdd).length;
  const w2Stores = parsedOrders.filter(o => o.hasMorningAdd).length;
  const totalBoxes = parsedOrders.reduce((s, o) => s + o.totalBoxes, 0);
  const w1Boxes = parsedOrders.reduce((s, o) => s + o.wave1Boxes, 0);
  const w2Boxes = parsedOrders.reduce((s, o) => s + o.wave2Boxes, 0);

  document.getElementById('kpiTotalStores').innerText = totalStores;
  document.getElementById('kpiWaveSplit').innerText = `전날확정: ${w1Stores}곳 / 아침추가포함: ${w2Stores}곳`;
  document.getElementById('kpiTotalBoxes').innerText = totalBoxes.toFixed(1);
  document.getElementById('kpiBoxSplit').innerText = `1차(전날): ${w1Boxes.toFixed(1)}박 / 2차(아침): ${w2Boxes.toFixed(1)}박`;
  document.getElementById('kpiMorningAdds').innerText = w2Stores;

  const allBefore11 = Object.values(customDepartureTimes).every(t => t < "11:00");
  const statusEl = document.getElementById('kpiDepartureStatus');
  if (totalStores === 0) {
    statusEl.innerText = "데이터 입력 대기";
    statusEl.className = "text-lg font-extrabold text-slate-400 mt-1";
  } else if (allBefore11) {
    statusEl.innerText = "✅ 전 차량 11:00 전 출발 완료";
    statusEl.className = "text-lg font-extrabold text-emerald-600 mt-1";
  } else {
    statusEl.innerText = "⚠️ 11:00 이후 출발 차량 있음";
    statusEl.className = "text-lg font-extrabold text-amber-600 mt-1";
  }

  // 차량 탭 렌더링
  const tabsEl = document.getElementById('vehicleTabs');
  let tabsHtml = `<button onclick="selectVehicleTab('all')" class="px-3.5 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition ${selectedVehicleTab === 'all' ? 'bg-indigo-600 text-white shadow' : 'bg-white text-slate-700 border border-slate-200'}">전체 차량 보기 (${totalStores}곳 / ${totalBoxes.toFixed(1)}박)</button>`;
  for (let v = 1; v <= 5; v++) {
    const vOrders = parsedOrders.filter(o => o.vehicle === v);
    const vBoxes = vOrders.reduce((s, o) => s + o.totalBoxes, 0);
    const active = selectedVehicleTab === v;
    tabsHtml += `<button onclick="selectVehicleTab(${v})" class="px-3.5 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition ${active ? 'bg-indigo-600 text-white shadow' : 'bg-white text-slate-700 border border-slate-200'}">${v}호차 (${vOrders.length}곳 / ${vBoxes.toFixed(1)}박)</button>`;
  }
  tabsEl.innerHTML = tabsHtml;

  const container = document.getElementById('resultContainer');
  if (parsedOrders.length === 0) {
    container.innerHTML = `<div class="bg-white rounded-xl border border-slate-200 p-12 text-center text-slate-400">
      <div class="text-4xl mb-2">📋</div>
      <div class="font-bold text-slate-600 text-base">아직 분석된 발주 내역이 없습니다.</div>
      <div class="text-xs mt-1">좌측에서 카톡 내보내기(.txt), 캡처 이미지 업로드, 또는 상단 [🧪 10월 20일 실제 카톡 데이터 샘플 불러오기] 버튼을 눌러보세요.</div>
    </div>`;
    return;
  }

  // 품목별 총 피킹 합산표 모드
  if (currentViewMode === 'items') {
    let html = `<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
      <h3 class="font-bold text-base mb-3">🥩 전 차량 품목별 피킹 총괄표 ${deltaOnly ? '(⚡아침 추가분만 표시)' : ''}</h3>
      <div class="overflow-x-auto"><table class="w-full text-xs text-left border-collapse">
        <thead><tr class="bg-slate-100 border-b text-slate-700">
          <th class="p-2">호차</th><th class="p-2">거래처명</th><th class="p-2">구분</th><th class="p-2">발주 품목 원문</th><th class="p-2">작업 태그</th><th class="p-2 text-right">환산 박스</th>
        </tr></thead><tbody>`;
    for (let v = 1; v <= 5; v++) {
      if (selectedVehicleTab !== 'all' && selectedVehicleTab !== v) continue;
      const vOrders = parsedOrders.filter(o => o.vehicle === v).sort((a,b) => a.stopOrder - b.stopOrder);
      for (const o of vOrders) {
        for (const item of o.items) {
          if (deltaOnly && !item.isMorning) continue;
          html += `<tr class="border-b hover:bg-slate-50">
            <td class="p-2 font-bold text-indigo-700">${v}호차</td>
            <td class="p-2 font-bold">${o.client.name}</td>
            <td class="p-2">${item.isMorning ? '<span class="bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded font-bold">2차(아침)</span>' : '<span class="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">1차(전날)</span>'}</td>
            <td class="p-2 font-medium ${item.isPass ? 'line-through text-slate-400' : ''}">${item.text}</td>
            <td class="p-2">${item.tags.map(t => `<span class="bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded mr-1 text-[11px] font-semibold">${t}</span>`).join('')}</td>
            <td class="p-2 text-right font-bold">${item.boxEq}박</td>
          </tr>`;
        }
      }
    }
    html += `</tbody></table></div></div>`;
    container.innerHTML = html;
    return;
  }

  // 호차별 카드 렌더링 (배송 방문순 vs 역순 상차 지시서)
  let cardsHtml = '';
  for (let v = 1; v <= 5; v++) {
    if (selectedVehicleTab !== 'all' && selectedVehicleTab !== v) continue;
    const cfg = VEHICLE_CONFIG[v];
    let vOrders = parsedOrders.filter(o => o.vehicle === v).sort((a, b) => a.stopOrder - b.stopOrder);
    if (deltaOnly) vOrders = vOrders.filter(o => o.hasMorningAdd);
    if (vOrders.length === 0) continue;

    // ETA 및 주행거리 계산 (항상 정방향 기준 계산 후 LIFO 모드면 역순 표시)
    const fullRouteOrders = parsedOrders.filter(o => o.vehicle === v).sort((a, b) => a.stopOrder - b.stopOrder);
    let curTime = customDepartureTimes[v];
    let curLat = DEPOT.lat, curLon = DEPOT.lon;
    let totalKm = 0;

    for (const stop of fullRouteOrders) {
      const dKm = calcDistKm(curLat, curLon, stop.client.lat, stop.client.lon);
      const driveMin = estimateDriveMin(dKm);
      stop.driveMin = driveMin;
      stop.distKm = dKm;
      stop.etaArr = addMinutesToTimeStr(curTime, driveMin);
      stop.etaDep = addMinutesToTimeStr(stop.etaArr, dwellMin);
      curTime = stop.etaDep;
      curLat = stop.client.lat;
      curLon = stop.client.lon;
      totalKm += dKm;
    }
    const returnKm = calcDistKm(curLat, curLon, DEPOT.lat, DEPOT.lon);
    const returnMin = estimateDriveMin(returnKm);
    const returnEta = addMinutesToTimeStr(curTime, returnMin);
    totalKm += returnKm;

    const vTotalBoxes = fullRouteOrders.reduce((s, o) => s + o.totalBoxes, 0);
    const capPct = Math.min(100, Math.round((vTotalBoxes / cfg.maxBoxes) * 100));
    const isOverCap = vTotalBoxes > cfg.maxBoxes;

    // LIFO(역순 상차) 모드일 경우 배열 뒤집기
    const displayOrders = currentViewMode === 'lifo' ? [...vOrders].reverse() : vOrders;

    cardsHtml += `
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <!-- 호차 헤더 -->
      <div class="bg-slate-800 text-white p-3.5 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2.5">
          <span class="bg-indigo-500 text-white font-extrabold px-2.5 py-1 rounded text-sm">${cfg.name}</span>
          <span class="text-xs text-slate-300 font-medium">총 ${fullRouteOrders.length}곳 | 약 ${totalKm.toFixed(1)}km</span>
        </div>

        <div class="flex flex-wrap items-center gap-3 text-xs">
          <div class="flex items-center gap-1.5 bg-slate-700 px-2.5 py-1 rounded">
            <span class="text-amber-300 font-bold">🚀 미트포앤 출발:</span>
            <input type="time" value="${customDepartureTimes[v]}" onchange="updateDepartureTime(${v}, this.value)" class="bg-slate-900 text-white font-bold px-1.5 py-0.5 rounded border border-slate-500" />
            <span class="text-emerald-300 font-bold ml-1">➔ 복귀예정 ${returnEta}</span>
          </div>
          <button onclick="copyVehicleSchedule(${v})" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-2.5 py-1 rounded transition no-print">
            📋 기사님 카톡 공유 복사
          </button>
        </div>
      </div>

      <!-- 적재량 게이지 바 & 상차 모드 안내 -->
      <div class="bg-slate-50 px-4 py-2 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2 text-xs">
        <div class="flex items-center gap-2 flex-1 min-w-[240px]">
          <span class="font-bold text-slate-700">적재 물량: ${vTotalBoxes.toFixed(1)} / ${cfg.maxBoxes}박스</span>
          <div class="w-36 bg-slate-200 h-2.5 rounded-full overflow-hidden">
            <div class="${isOverCap ? 'bg-rose-600' : 'bg-indigo-600'} h-full" style="width:${capPct}%"></div>
          </div>
          ${isOverCap ? '<span class="text-rose-600 font-bold">⚠️ 적재 상한 초과 주의! 일부 거래처를 다른 호차로 이동하세요.</span>' : '<span class="text-emerald-600 font-semibold">✔ 적재 적정</span>'}
        </div>
        <div class="font-bold ${currentViewMode === 'lifo' ? 'text-purple-700 bg-purple-100 px-2.5 py-0.5 rounded' : 'text-slate-600'}">
          ${currentViewMode === 'lifo' ? '📦 [역순 상차 모드] 위에서부터 순서대로 탑차 가장 안쪽(깊숙한 곳)부터 실으세요!' : '🚚 [배송 방문순 모드] 미트포앤 출발 후 실제 방문 순서입니다.'}
        </div>
      </div>

      <!-- 경유지 리스트 -->
      <div class="divide-y divide-slate-200">
        ${displayOrders.map((o, idx) => {
          const lifoStep = idx + 1;
          const googleMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.client.addr)}`;
          return `
          <div class="p-3.5 hover:bg-slate-50/80 transition grid grid-cols-1 md:grid-cols-12 gap-3 items-start">
            <!-- 순서 & 거래처 정보 -->
            <div class="md:col-span-5 flex items-start gap-2.5">
              <div class="flex flex-col items-center">
                <span class="${currentViewMode === 'lifo' ? 'bg-purple-700' : 'bg-slate-900'} text-white font-extrabold px-2.5 py-1 rounded-lg text-xs whitespace-nowrap">
                  ${currentViewMode === 'lifo' ? `상차 ${lifoStep}순위 (${o.stopOrder}번하차)` : `방문 ${o.stopOrder}번`}
                </span>
                <span class="text-[11px] font-bold text-indigo-600 mt-1">${o.totalBoxes}박</span>
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="font-extrabold text-sm text-slate-900">${o.client.name}</span>
                  <span class="text-xs bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded font-semibold">카톡: ${o.nickUsed}</span>
                  ${o.hasMorningAdd ? '<span class="text-[11px] bg-rose-100 text-rose-700 border border-rose-300 px-1.5 py-0.5 rounded font-bold">⚡아침추가/변경</span>' : ''}
                  ${o.isUrgent ? '<span class="text-[11px] bg-red-600 text-white px-1.5 py-0.5 rounded font-bold">🚨급급우선</span>' : ''}
                </div>
                <div class="text-xs text-slate-500 mt-1 flex items-center gap-1.5">
                  <span>📍 ${o.client.addr}</span>
                  <a href="${googleMapUrl}" target="_blank" class="text-blue-600 hover:underline font-semibold whitespace-nowrap no-print">[지도]</a>
                </div>
                <div class="text-xs font-bold text-slate-700 mt-1.5 bg-amber-50 border border-amber-200 inline-block px-2 py-0.5 rounded">
                  ⏰ 도착 ${o.etaArr} ~ 출발 ${o.etaDep} <span class="font-normal text-slate-500">(이동 ${o.driveMin}분 / ${o.distKm.toFixed(1)}km, 정차 ${dwellMin}분)</span>
                </div>
              </div>
            </div>

            <!-- 발주 품목 상세 (1차 확정 vs 2차 아침 추가분 구분 표시) -->
            <div class="md:col-span-5 bg-slate-50 rounded-lg p-2.5 border border-slate-200 text-xs">
              <ul class="space-y-1">
                ${o.items.map(it => `
                  <li class="flex items-start justify-between gap-2 ${it.isPass ? 'line-through text-slate-400' : ''}">
                    <div>
                      ${it.isMorning ? '<span class="text-[10px] bg-rose-600 text-white px-1 py-0.2 rounded font-bold mr-1">+추가</span>' : '<span class="text-[10px] bg-slate-200 text-slate-700 px-1 py-0.2 rounded font-semibold mr-1">1차</span>'}
                      <span class="font-medium text-slate-800">${it.text}</span>
                      ${it.tags.map(t => `<span class="text-[10px] bg-amber-100 text-amber-900 px-1 rounded ml-1 font-semibold">${t}</span>`).join('')}
                    </div>
                    <span class="font-bold text-slate-600 whitespace-nowrap">${it.boxEq}박</span>
                  </li>
                `).join('')}
              </ul>
              ${o.weightLogs.length > 0 ? `<div class="mt-2 pt-1.5 border-t border-slate-200 text-[11px] text-emerald-700 font-medium">✔ 현장계근: ${o.weightLogs.join(' / ')}</div>` : ''}
            </div>

            <!-- 호차 수동 변경 드롭다운 -->
            <div class="md:col-span-2 flex flex-col items-end justify-between gap-1 text-xs no-print">
              <label class="text-[11px] text-slate-400">차량(권역) 변경</label>
              <select onchange="changeStoreVehicle('${o.client.name}', this.value)" class="border border-slate-300 rounded px-2 py-1 text-xs font-bold bg-white text-slate-700">
                ${[1,2,3,4,5].map(num => `<option value="${num}" ${o.vehicle === num ? 'selected' : ''}>${num}호차로 배정</option>`).join('')}
              </select>
              <span class="text-[10px] text-slate-400 mt-1">발주: ${o.timestamps.join(', ')}</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  container.innerHTML = cardsHtml;
}

// 기사님 단톡방 공유용 텍스트 복사
function copyVehicleSchedule(v) {
  const cfg = VEHICLE_CONFIG[v];
  const vOrders = parsedOrders.filter(o => o.vehicle === v).sort((a, b) => a.stopOrder - b.stopOrder);
  if (vOrders.length === 0) return;

  const vTotalBoxes = vOrders.reduce((s, o) => s + o.totalBoxes, 0);
  let txt = `📢 [${cfg.name}] 금일 납품 및 상차 지시서\n`;
  txt += `- 출발시각: ${customDepartureTimes[v]} (미트포앤 출발)\n`;
  txt += `- 총 방문지: ${vOrders.length}곳 (총 약 ${vTotalBoxes.toFixed(1)}박스)\n\n`;
  txt += `📦 [상차 순서 (안쪽 ➔ 문쪽 역순)]\n`;
  [...vOrders].reverse().forEach((o, i) => {
    txt += `${i+1}순위(안쪽): ${o.client.name} (${o.totalBoxes}박)\n`;
  });
  txt += `\n🚚 [방문 일정 및 품목]\n`;
  vOrders.forEach(o => {
    txt += `${o.stopOrder}. ${o.client.name} (도착 ${o.etaArr}~${o.etaDep})\n`;
    txt += `   주소: ${o.client.addr}\n`;
    txt += `   품목: ${o.items.filter(i=>!i.isPass).map(i=>i.text).join(' / ')}\n`;
  });

  navigator.clipboard.writeText(txt).then(() => {
    alert(`${v}호차 배송 일정표와 역순 상차 리스트가 클립보드에 복사되었습니다! 카카오톡 채팅창에 붙여넣기(Ctrl+V) 하세요.`);
  });
}
