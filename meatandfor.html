<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미트포앤 카톡 순수 발주 추출기</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; color: #1f4e79; }
        p { color: #666; font-size: 14px; }
        .upload-box { border: 2px dashed #b0c4de; padding: 25px; text-align: center; border-radius: 8px; background: #fafbfc; margin-bottom: 20px; cursor: pointer; }
        .upload-box input { display: none; }
        button { background-color: #1f4e79; color: white; border: none; padding: 10px 20px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #153556; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #1f4e79; color: white; }
        tr:nth-child(even) { background-color: #f9fbfd; }
        .stats { margin-top: 15px; font-weight: bold; color: #444; }
        .btn-download { background-color: #2e7d32; margin-bottom: 15px; display: none; }
        .btn-download:hover { background-color: #1b5e20; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 미트포앤 카카오톡 순수 발주 추출기</h2>
    <p>카카오톡 텍스트 대화 파일(<code>.txt</code>)을 선택하면, 일상 대화와 재고 현황을 제외하고 <b>오직 순수 발주 내용만</b> 날짜별로 깔끔하게 추출해 표로 보여줍니다.</p>

    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <p>📁 이곳을 터치하여 카카오톡 텍스트 파일(.txt)을 선택하세요</p>
        <input type="file" id="fileInput" accept=".txt" onchange="processFile(event)">
    </div>

    <button id="downloadBtn" class="btn-download" onclick="downloadCSV()">엑셀(CSV) 다운로드</button>
    
    <div id="stats" class="stats"></div>

    <div style="overflow-x: auto;">
        <table id="resultTable">
            <thead>
                <tr>
                    <th style="width: 25%;">날짜</th>
                    <th style="width: 25%;">발신자 / 거래처</th>
                    <th style="width: 50%;">발주 내용</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="3" style="text-align: center; color: #888;">파일을 업로드하면 발주 내역이 여기에 표시됩니다.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
let extractedOrders = [];

function processFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const text = e.target.result;
        parseKakao(text);
    };
    reader.readAsText(file, 'utf-8');
}

function parseKakao(text) {
    const lines = text.split('\n');
    extractedOrders = [];
    let currentDate = "날짜 미상";
    
    // 제외할 시스템 메시지 및 키워드
    const excludeKeywords = [
        '사진', '동영상', '이모티콘', '삭제되었습니다', '보낸 사람', 
        '저장한 날짜', '카카오톡 대화', '참여했습니다', '나갔습니다',
        '발주체크', '재고현황', '분류전', '사진 2장', '사진 3장', '사진장'
    ];

    // 카톡 메시지 패턴 매칭 (예: [이름] [오후 2:35] 내용)
    const pattern = /^\[(.*?)\] \[(오전|오후 \d{1,2}:\d{2})\] (.*)$/;

    for (let line of lines) {
        line = line.trim();
        if (!line) continue;

        // 1. 날짜선 감지 (예: --------------- 2026년 10월 17일 토요일 ---------------)
        if (line.includes('---------------') && line.includes('년')) {
            currentDate = line.replace(/[-]/g, '').trim();
            continue;
        }

        // 2. 메시지 라인 파싱
        const match = line.match(pattern);
        if (match) {
            const sender = match[1];
            const message = match[3];

            // 제외 키워드가 포함된 경우 무시
            if (excludeKeywords.some(keyword => message.includes(keyword))) {
                continue;
            }

            // 발주 느낌이 있는 데이터 누적 (내용이 너무 짧거나 시스템 성격인 것 제외)
            extractedOrders.push({
                date: currentDate,
                sender: sender,
                content: message
            });
        } else {
            // 줄바꿈된 멀티라인 발주 내용 이어붙이기
            if (extractedOrders.length > 0 && !line.includes('님과 카카오톡 대화')) {
                if (!line.includes('---------------')) {
                    extractedOrders[extractedOrders.length - 1].content += " " + line;
                }
            }
        }
    }

    displayResults();
}

function displayResults() {
    const tbody = document.querySelector("#resultTable tbody");
    tbody.innerHTML = "";

    if (extractedOrders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: red;">추출된 발주 내역이 없습니다.</td></tr>`;
        document.getElementById("stats").innerText = "";
        document.getElementById("downloadBtn").style.display = "none";
        return;
    }

    document.getElementById("stats").innerText = `총 추출된 발주 건수: ${extractedOrders.length}건`;
    document.getElementById("downloadBtn").style.display = "inline-block";

    extractedOrders.forEach(order => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${escapeHtml(order.date)}</td>
            <td><strong>${escapeHtml(order.sender)}</strong></td>
            <td>${escapeHtml(order.content)}</td>
        `;
        tbody.appendChild(tr);
    });
}

function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function downloadCSV() {
    let csv = "\uFEFF날짜,발신자/거래처,발주내용\n";
    extractedOrders.forEach(o => {
        const cleanContent = o.content.replace(/"/g, '""');
        csv += `"${o.date}","${o.sender}","${cleanContent}"\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "순수발주목록_추출.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}
</script>

</body>
</html>
