  background:#6b5d4b;
  border-radius:99px;
  border:2px solid #15110d
}
::-webkit-scrollbar-track{
  background:#15110d
}
::-webkit-scrollbar-corner{
  background:#15110d
}
.table-scroll{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  scrollbar-color:#6b5d4b #15110d
}
table{
  border-collapse:separate;
  border-spacing:0;
  width:-moz-max-content;
  width:max-content;
  min-width:100%;
  table-layout:fixed
}
th{
  position:sticky;
  top:0;
  background:#2d241c;
  color:var(--yellow);
  z-index:3
}
th,td{
  border:1px solid var(--border);
  padding:5px 6px;
  font-size:15px;
  line-height:1.3;
  white-space:nowrap;
  vertical-align:middle
}
th{
  padding:8px 6px;
  font-size:15px;
  font-weight:800;
  line-height:1.25
}
td{
  white-space:normal
}
tbody tr{
  height:38px
}
.sticky-col{
  position:sticky;
  left:0;
  z-index:2;
  background:var(--card);
  box-shadow:2px 0 0 var(--border)
}
thead .sticky-col{
  z-index:4;
  background:#2d241c
}
.cell-name{
  word-break:keep-all;
  white-space:normal;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  line-height:1.25;
  max-height:2.6em
}
.cell-brand{
  word-break:keep-all;
  white-space:normal;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  line-height:1.25;
  max-height:2.6em;
  text-align:center
}
.cell-date{
  white-space:nowrap;
  text-align:center
}
.cell-note{
  word-break:keep-all;
  white-space:normal;
  line-height:1.25
}
@media (max-width:480px){
  .table-scroll{
    margin-left:-2px;
    margin-right:-2px
  }
}
