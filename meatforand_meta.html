:root{
  --bg:#f1f2f4;
  --surface:#ffffff;
  --surface2:#f7f7f5;
  --ink:#20201e;
  --muted:#6f6a5f;
  --line:#e5e5e2;
  --line2:#eee;
  --primary:#1d4ed8;
  --primary-soft:#eaf0fe;
  --green:#15803d;
  --green-soft:#ecfdf3;
  --red:#b91c1c;
  --red-soft:#fef2f2;
  --amber:#92400e;
  --amber-soft:#fffbeb;
  --blue:#1d4ed8;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#171714;
    --surface:#22221f;
    --surface2:#2a2925;
    --ink:#f2efe8;
    --muted:#b8b2a5;
    --line:#3a382f;
    --line2:#2f2e29;
    --primary:#7aa8ff;
    --primary-soft:#23345a;
    --green:#4ade80;
    --green-soft:#16351f;
    --red:#f87171;
    --red-soft:#3a1f1f;
    --amber:#fbbf24;
    --amber-soft:#3a2c12;
    --blue:#93c5fd;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink)
}

body{
  font-family:"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.5;
  font-size:15px
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

a{
  color:var(--primary)
}

.small{
  font-size:12px;
  line-height:1.45
}

.muted{
  color:var(--muted)
}

.phone-shell{
  width:100%;
  max-width:430px;
  margin:0 auto;
  padding:12px 12px 96px
}

@media (min-width:600px){
  .phone-shell{
    max-width:560px;
    padding-left:16px;
    padding-right:16px
  }

  .card{
    padding:14px 16px !important
  }
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px
}

.chip{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:999px;
  padding:0 6px;
  font-size:12px;
  white-space:nowrap;
  min-height:36px;
  display:inline-flex;
  align-items:center;
  justify-content:center
}

.chip.active{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
  font-weight:800
}

.tabbtn{
  border:0;
  background:transparent;
  padding:10px 12px;
  border-radius:10px;
  font-weight:700;
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
  min-height:44px
}

.tabbtn.active{
  background:var(--ink);
  color:#fff
}

.input{
  width:100%;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:10px;
  padding:10px 11px;
  min-width:0;
  min-height:44px;
  font-size:15px
}

.select{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:10px;
  padding:10px 10px;
  min-width:0;
  min-height:44px;
  font-size:14px
}

.btn{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:10px;
  padding:10px 12px;
  font-weight:700;
  font-size:13px;
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px
}

.btn.primary{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff
}

.btn.dark{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink)
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  border-radius:999px;
  padding:4px 8px;
  font-size:11px;
  font-weight:700;
  border:1px solid var(--line);
  background:var(--surface2);
  max-width:100%;
  overflow-wrap:anywhere
}

.badge.green{
  background:var(--green-soft);
  color:var(--green);
  border-color:#bbf7d0
}

.badge.red{
  background:var(--red-soft);
  color:var(--red);
  border-color:#fecaca
}

.badge.amber{
  background:var(--amber-soft);
  color:var(--amber);
  border-color:#fde68a
}

.rowline{
  border-top:1px solid var(--line2)
}

.bottom-tabbar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:40;
  background:var(--surface);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)
}

.bottom-tabbar-inner{
  max-width:430px;
  margin:0 auto;
  display:flex;
  height:64px
}

@media (min-width:600px){
  .bottom-tabbar-inner{
    max-width:560px
  }
}

.bottom-tab{
  flex:1;
  border:0;
  background:transparent;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  min-height:64px;
  font-size:11px;
  font-weight:600;
  line-height:1.2;
  padding:4px 2px
}

.bottom-tab.active{
  color:var(--primary);
  font-weight:800
}

.bottom-tab.active .tab-icon{
  color:var(--primary)
}

.date-chip{
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:10px;
  min-height:36px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:12px;
  line-height:1.15;
  padding:2px 1px
}

.date-chip.active{
  background:var(--ink);
  color:#fff;
  font-weight:800;
  border-color:var(--ink)
}

.vendor-chip{
  min-height:32px;
  display:inline-flex;
  align-items:center;
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--surface2);
  font-size:12px;
  overflow-wrap:anywhere
}

.sheet-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:50;
  display:flex;
  align-items:flex-end;
  justify-content:center
}

.sheet{
  width:100%;
  max-width:560px;
  background:var(--surface);
  border-radius:16px 16px 0 0;
  padding:14px 14px calc(18px + env(safe-area-inset-bottom));
  max-height:86vh;
  overflow-y:auto
}
