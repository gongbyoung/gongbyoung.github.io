:root{
  --bg:#f7f5ef;
  --surface:#ffffff;
  --surface2:#fffaf0;
  --ink:#20201e;
  --muted:#6f6a5f;
  --line:#e7e0d2;
  --line2:#efe9da;
  --primary:#c2410c;
  --primary-soft:#fff1e8;
  --green:#15803d;
  --green-soft:#ecfdf3;
  --red:#b91c1c;
  --red-soft:#fef2f2;
  --amber:#92400e;
  --amber-soft:#fffbeb;
  --blue:#1d4ed8;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#171714;
    --surface:#22221f;
    --surface2:#2a2925;
    --ink:#f2efe8;
    --muted:#b8b2a5;
    --line:#3a382f;
    --line2:#2f2e29;
    --primary:#ff7a3c;
    --primary-soft:#3a241c;
    --green:#4ade80;
    --green-soft:#16351f;
    --red:#f87171;
    --red-soft:#3a1f1f;
    --amber:#fbbf24;
    --amber-soft:#3a2c12;
    --blue:#93c5fd;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink)
}

body{
  font-family:"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.45
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

a{
  color:var(--primary)
}

.small{
  font-size:12px
}

.muted{
  color:var(--muted)
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px
}

.chip{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:999px;
  padding:5px 10px;
  font-size:12px;
  white-space:nowrap
}

.chip.active{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink)
}

.tabbtn{
  border:0;
  background:transparent;
  padding:10px 12px;
  border-radius:10px;
  font-weight:700;
  font-size:13px;
  color:var(--muted);
  white-space:nowrap
}

.tabbtn.active{
  background:var(--ink);
  color:#fff
}

.input{
  width:100%;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:10px;
  padding:9px 11px;
  min-width:0
}

.select{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:10px;
  padding:8px 10px;
  min-width:0
}

.btn{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:10px;
  padding:9px 12px;
  font-weight:700;
  font-size:13px
}

.btn.primary{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff
}

.btn.dark{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink)
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  border-radius:999px;
  padding:3px 8px;
  font-size:11px;
  font-weight:700;
  border:1px solid var(--line);
  background:var(--surface2);
  max-width:100%;
  text-wrap:wrap
}

.badge.green{
  background:var(--green-soft);
  color:var(--green);
  border-color:#bbf7d0
}

.badge.red{
  background:var(--red-soft);
  color:var(--red);
  border-color:#fecaca
}

.badge.amber{
  background:var(--amber-soft);
  color:var(--amber);
  border-color:#fde68a
}

.rowline{
  border-top:1px solid var(--line2)
}

@media (min-width: 640px) {
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:p-4 {
    padding: 1rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:pt-5 {
    padding-top: 1.25rem;
  }

  .sm\:text-sm {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
}

  }

  }

  .md\:grid-cols-\[1fr_\.5fr_\.7fr_1fr_auto\] {

  }
}

    grid-template-columns: .9fr 1.1fr;
